/* ---------- local media store ---------- */
/* Photos were base64 inside the same localStorage blob as the entire
   workspace — a 33% size penalty against a ~5MB ceiling, which is why
   saveLocal() already had a "storage full, remove some photos" path.
   IndexedDB stores them separately and is measured in hundreds of MB.

   The render code is untouched: `lead.photo` and `image.src` are still data
   URLs in memory. Only what gets *written to localStorage* changes. */
var MEDIA_DB=null, MEDIA_OK={}, MEDIA_SENT={};

function mediaOpen(){
  if(MEDIA_DB)return Promise.resolve(MEDIA_DB);
  return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('no indexedDB'));
    var rq=indexedDB.open('gem-media',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('media'); };
    rq.onsuccess=function(){ MEDIA_DB=rq.result; res(MEDIA_DB); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function mediaPut(id,rec){
  return mediaOpen().then(function(d){
    return new Promise(function(res,rej){
      var tx=d.transaction('media','readwrite');
      tx.objectStore('media').put(rec,id);
      tx.oncomplete=function(){ MEDIA_OK[id]=true; res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function mediaAll(){
  return mediaOpen().then(function(d){
    return new Promise(function(res,rej){
      var out={},tx=d.transaction('media','readonly');
      var rq=tx.objectStore('media').openCursor();
      rq.onsuccess=function(){ var c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } };
      tx.oncomplete=function(){ res(out); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function mediaPrune(keep){
  return mediaOpen().then(function(d){
    return new Promise(function(res){
      var tx=d.transaction('media','readwrite'), st=tx.objectStore('media');
      var rq=st.openCursor();
      rq.onsuccess=function(){ var c=rq.result; if(c){ if(!keep[c.key]){ st.delete(c.key); delete MEDIA_OK[c.key]; } c.continue(); } };
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ res(false); };
    });
  }).catch(function(){ return false; });
}

/* Every photo in the workspace, with enough context to give it a storage key. */
function mediaItems(){
  var out=[];
  /* Every lead is a candidate, not just those currently holding pixels. After
     a reload the photo has been stripped and there is nothing left on the
     record to say it ever had one — the lookup is by id against IndexedDB. */
  (db.leads||[]).forEach(function(l){
    out.push({id:l.id,owner:l,field:'photo',pathField:'photoPath',eventId:null,boardId:null});
  });
  (db.events||[]).forEach(function(e){
    ((((e.design||{}).boards)||[])).forEach(function(b){
      (b.images||[]).forEach(function(im){
        out.push({id:im.id,owner:im,field:'src',pathField:'path',eventId:e.id,boardId:b.id,caption:im.caption});
      });
    });
  });
  return out;
}

/* Copy anything new into IndexedDB. Until a photo is confirmed stored there,
   saveLocal() deliberately keeps it inline — losing a photo to a failed
   IndexedDB write would be far worse than a large localStorage entry. */
function mediaStash(){
  try{
    mediaItems().forEach(function(m){
      var d=m.owner[m.field];
      if(!d||typeof d!=='string'||d.indexOf('data:')!==0)return;
      if(MEDIA_OK[m.id])return;
      mediaPut(m.id,{data:d,path:m.owner[m.pathField]||null}).catch(function(){});
    });
  }catch(e){}
}
/* Put the photos back on the records after a reload. */
function mediaRehydrate(){
  return mediaAll().then(function(all){
    var n=0;
    mediaItems().forEach(function(m){
      var rec=all[m.id];
      if(!rec||!rec.data)return;
      MEDIA_OK[m.id]=true;
      if(!m.owner[m.field]){ m.owner[m.field]=rec.data; n++; }
      if(!m.owner[m.pathField]&&rec.path)m.owner[m.pathField]=rec.path;
    });
    if(n&&typeof render==='function')render();
    return n;
  }).catch(function(){ return 0; });
}

/* ---------- attached document files ---------- */
/* Photos are held as data URLs because the render path wants one. A signed
   contract can be 10MB, and a data URL costs 33% on top of that in memory for
   no benefit — nothing renders it inline. So documents keep the Blob itself in
   IndexedDB and carry only metadata on the record. */
function docKey(id){ return 'doc:'+id; }
function docFilePut(id,blob,meta){
  return mediaPut(docKey(id),{blob:blob,name:meta.name,type:meta.type,size:meta.size,path:meta.path||null});
}
function docFileGet(id){
  return mediaOpen().then(function(d){
    return new Promise(function(res){
      var tx=d.transaction('media','readonly');
      var rq=tx.objectStore('media').get(docKey(id));
      rq.onsuccess=function(){ res(rq.result||null); };
      tx.onerror=function(){ res(null); };
    });
  }).catch(function(){ return null; });
}
/* Offline, serve the local copy; online without one (a file another device
   uploaded), fall back to a short-lived signed URL. */
function docOpen(id){
  var d=db.documents.find(function(x){return x.id===id;});
  if(!d||!d.file)return Promise.resolve(false);
  return docFileGet(id).then(function(rec){
    if(rec&&rec.blob){
      var u=URL.createObjectURL(rec.blob);
      var a=document.createElement('a');
      a.href=u; a.download=d.file.name||'document';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); },4000);
      return true;
    }
    if(!d.file.path||!sbReady())return false;
    return sbStorage('object/sign/gem-media/'+d.file.path,{method:'POST',json:true,body:{expiresIn:3600}})
      .then(function(r){
        var cfg=sbCfg();
        if(!r||!r.signedURL)return false;
        window.open(cfg.url+'/storage/v1'+r.signedURL,'_blank','noopener');
        return true;
      }).catch(function(){ return false; });
  });
}
function docAttach(id,file){
  var d=db.documents.find(function(x){return x.id===id;});
  if(!d)return Promise.resolve(false);
  if(file.size>10*1024*1024){ toast('That file is over the 10MB limit.'); return Promise.resolve(false); }
  return docFilePut(id,file,{name:file.name,type:file.type||'application/octet-stream',size:file.size})
    .then(function(){
      d.file={name:file.name,type:file.type||'application/octet-stream',size:file.size,path:null};
      save(); render(); wireDocuments();
      toast('Attached '+file.name+' ✦');
      return true;
    }).catch(function(){ toast('Could not store that file.'); return false; });
}
/* Push any attachment that is not in Storage yet. */
/* A document's bytes live in IndexedDB under its record id, and the first push
   rewrites every id to a uuid. Photos survive that because they are still in
   memory and get re-stashed; a document blob is only on disk, so it has to be
   moved deliberately or it is orphaned and never uploads. */
function docRekey(map){
  var pairs=Object.keys(map||{}).map(function(o){ return [docKey(o),docKey(map[o])]; });
  if(!pairs.length)return Promise.resolve(0);
  return mediaOpen().then(function(d){
    return new Promise(function(res){
      var tx=d.transaction('media','readwrite'), st=tx.objectStore('media'), moved=0;
      pairs.forEach(function(pr){
        var g=st.get(pr[0]);
        g.onsuccess=function(){ if(g.result){ st.put(g.result,pr[1]); st.delete(pr[0]); moved++; } };
      });
      tx.oncomplete=function(){ res(moved); };
      tx.onerror=function(){ res(0); };
    });
  }).catch(function(){ return 0; });
}
function docUpload(org){
  var todo=(db.documents||[]).filter(function(d){ return d.file&&!d.file.path; });
  if(!todo.length)return Promise.resolve(0);
  var done=0, chain=Promise.resolve();
  todo.forEach(function(d){
    chain=chain.then(function(){
      return docFileGet(d.id).then(function(rec){
        if(!rec||!rec.blob)return;
        var key=org+'/docs/'+d.id;
        return sbStorage('object/gem-media/'+key,{method:'POST',body:rec.blob,
          contentType:rec.type||'application/octet-stream',upsert:true})
          .then(function(){
            d.file.path=key; done++;
            return docFilePut(d.id,rec.blob,{name:rec.name,type:rec.type,size:rec.size,path:key});
          });
      }).catch(function(){});
    });
  });
  return chain.then(function(){ if(done)saveLocal(); return done; });
}

/* ---------- Supabase Storage ---------- */
function dataUrlToBlob(u){
  var parts=String(u).split(','), mime=((parts[0]||'').match(/:(.*?);/)||[])[1]||'image/jpeg';
  var bin=atob(parts[1]||''), n=bin.length, arr=new Uint8Array(n);
  while(n--)arr[n]=bin.charCodeAt(n);
  return new Blob([arr],{type:mime});
}
function sbStorage(path,opts){
  var cfg=sbCfg();
  if(!cfg)return Promise.reject(new Error('Not connected.'));
  opts=opts||{};
  return sbToken().then(function(tok){
    var h={apikey:cfg.key,Authorization:'Bearer '+(tok||cfg.key)};
    if(opts.contentType)h['Content-Type']=opts.contentType;
    if(opts.json)h['Content-Type']='application/json';
    if(opts.upsert)h['x-upsert']='true';
    return fetch(cfg.url+'/storage/v1/'+path,{
      method:opts.method||'GET',headers:h,
      body:opts.body===undefined?undefined:(opts.json?JSON.stringify(opts.body):opts.body)
    });
  }).then(function(r){
    if(opts.raw)return r;
    return r.text().then(function(t){
      var d=null; try{ d=t?JSON.parse(t):null; }catch(e){ d=t; }
      if(!r.ok)throw new Error((d&&(d.message||d.error))||('storage HTTP '+r.status));
      return d;
    });
  });
}
/* Object keys:  <org>/leads/<leadId>   client photos, staff only
                 <org>/<eventId>/<imageId>   event media, staff + that couple */
function mediaKey(org,m){
  return m.eventId?(org+'/'+m.eventId+'/'+m.id):(org+'/leads/'+m.id);
}
/* Upload anything that has pixels but no path yet. Runs before the table push
   so the rows can carry their storage_path in the same run. */
function mediaUpload(org){
  var todo=mediaItems().filter(function(m){
    return m.owner[m.field]&&String(m.owner[m.field]).indexOf('data:')===0&&!m.owner[m.pathField];
  });
  if(!todo.length)return Promise.resolve(0);
  var done=0, chain=Promise.resolve();
  todo.forEach(function(m){
    chain=chain.then(function(){
      var key=mediaKey(org,m), blob=dataUrlToBlob(m.owner[m.field]);
      return sbStorage('object/gem-media/'+key,{method:'POST',body:blob,contentType:blob.type,upsert:true})
        .then(function(){
          m.owner[m.pathField]=key; done++;
          return mediaPut(m.id,{data:m.owner[m.field],path:key}).catch(function(){});
        })
        .catch(function(){ /* one bad photo must not fail the whole sync */ });
    });
  });
  return chain.then(function(){ if(done)saveLocal(); return done; });
}
/* Fetch anything the server knows about that this device has never seen. */
function mediaDownload(){
  var todo=mediaItems().filter(function(m){ return m.owner[m.pathField]&&!m.owner[m.field]; });
  if(!todo.length)return Promise.resolve(0);
  var done=0, chain=Promise.resolve();
  todo.forEach(function(m){
    chain=chain.then(function(){
      return sbStorage('object/sign/gem-media/'+m.owner[m.pathField],{method:'POST',json:true,body:{expiresIn:3600}})
        .then(function(d){
          var cfg=sbCfg();
          var u=d&&d.signedURL?(cfg.url+'/storage/v1'+d.signedURL):null;
          if(!u)throw new Error('no signed url');
          return fetch(u).then(function(r){ return r.blob(); });
        })
        .then(function(blob){
          return new Promise(function(res){
            var fr=new FileReader();
            fr.onload=function(){
              m.owner[m.field]=String(fr.result); done++;
              mediaPut(m.id,{data:String(fr.result),path:m.owner[m.pathField]}).catch(function(){});
              res();
            };
            fr.onerror=function(){ res(); };
            fr.readAsDataURL(blob);
          });
        })
        .catch(function(){ /* a photo that will not come down must not block the pull */ });
    });
  });
  return chain.then(function(){ if(done){ saveLocal(); if(typeof render==='function')render(); } return done; });
}

/* ============================================================
   Supabase transport — deliberately no SDK.

   PostgREST and GoTrue are plain REST. Pulling supabase-js from a CDN would
   put an external script on the critical path of a single-file app whose
   whole point is that it works offline from a cold start; the artifact CSP
   blocks it outright. This is the same contract, hand-rolled, ~5KB.

   Sync model: the app keeps its local-first `db` + save() and pushes the
   whole workspace, rather than rewriting every mutation site in a 450KB
   file. For one studio that is a few hundred rows — cheap, and far less
   likely to lose data than a half-converted per-record path.
   ============================================================ */
var SB_SESSION_KEY='gem-sb-session';
var SB_STATE={org:null,busy:false,lastSync:null,lastError:null};

function sbCfg(){
  var p=prefs();
  if(!p.sbUrl||!p.sbKey)return null;
  return {url:String(p.sbUrl).replace(/\/+$/,'').replace(/\/rest\/v1$/,''),key:p.sbKey};
}
function sbSession(){ try{ return JSON.parse(localStorage.getItem(SB_SESSION_KEY))||null; }catch(e){ return null; } }
function setSbSession(s){
  try{ s?localStorage.setItem(SB_SESSION_KEY,JSON.stringify(s)):localStorage.removeItem(SB_SESSION_KEY); }catch(e){}
}
function sbAuthed(){ var s=sbSession(); return !!(s&&s.access_token); }
function sbReady(){ return !!sbCfg()&&sbAuthed(); }

/* Refresh a minute early — a token that expires mid-push would fail half the
   tables and leave the workspace split across two states. */
function sbToken(){
  var s=sbSession(), cfg=sbCfg();
  if(!s||!cfg)return Promise.resolve(null);
  if(!s.expires_at||Date.now()/1000<s.expires_at-60)return Promise.resolve(s.access_token);
  return fetch(cfg.url+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})
  }).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
      /* Only a definitive rejection clears the session. A 500, a captive
         portal or a flaky connection must not silently sign you out — that
         alone would look exactly like "my login doesn't stick". */
      if(!r.ok){
        if(r.status===400||r.status===401||r.status===403)setSbSession(null);
        return null;
      }
      if(!j||!j.access_token)return null;
      j.expires_at=Math.floor(Date.now()/1000)+(j.expires_in||3600);
      setSbSession(j); return j.access_token;
    });
  }).catch(function(){ return null; });
}

function sbRest(path,opts){
  var cfg=sbCfg();
  if(!cfg)return Promise.reject(new Error('No project URL or key saved.'));
  opts=opts||{};
  return sbToken().then(function(tok){
    var h={apikey:cfg.key,Authorization:'Bearer '+(tok||cfg.key),'Content-Type':'application/json'};
    if(opts.prefer)h.Prefer=opts.prefer;
    return fetch(cfg.url+'/rest/v1/'+path,{
      method:opts.method||'GET',headers:h,
      body:opts.body===undefined?undefined:JSON.stringify(opts.body)
    });
  }).then(function(r){
    return r.text().then(function(t){
      var d=null; try{ d=t?JSON.parse(t):null; }catch(e){ d=t; }
      if(!r.ok)throw new Error((d&&(d.message||d.hint||d.details))||('HTTP '+r.status));
      return d;
    });
  });
}

/* ---------- portal access for the couple ---------- */
/* event_clients is written server-side, because the browser cannot turn an
   email address into a user id — auth.users is not readable with the anon key.
   So an invitation is stored against the address and claimed on first sign-in.
   See migration 14. */
function sbInviteClient(eventId,email,canEdit){
  return sbRest('rpc/gem_invite_client',{method:'POST',
    body:{p_event:eventId,p_email:email,p_can_edit:canEdit!==false}});
}
function sbInvitePartner(eventId,email){
  return sbRest('rpc/gem_invite_partner',{method:'POST',body:{p_event:eventId,p_email:email}});
}
function sbRevokeClient(eventId,email){
  return sbRest('rpc/gem_revoke_client',{method:'POST',body:{p_event:eventId,p_email:email}});
}
function sbClientInvites(eventId){
  return sbRest('event_client_invites?select=*&event_id=eq.'+encodeURIComponent(eventId));
}
/* Called after every sign-in. Harmless when there is nothing to claim, and it
   is what turns an invited couple into an attached one. */
function sbClaimInvites(){
  return sbRest('rpc/gem_claim_client_invites',{method:'POST',body:{}}).catch(function(){ return 0; });
}
/* The address the couple would visit. Falls back to this origin when no portal
   domain is set, which is correct for a studio that has not split the hosts. */
function portalUrl(){
  var h=String(prefs().portalHost||'').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  return h?('https://'+h+'/'):location.origin+'/';
}

/* ---------- auth: magic link ---------- */
function sbAfterSignIn(){
  /* An invited couple is only linked to their wedding once they have signed in
     at least once — the invitation is stored against their email and claimed
     here. Safe and cheap for staff, who simply have none to claim. */
  return sbClaimInvites();
}
function sbSignIn(email){
  var cfg=sbCfg();
  if(!cfg)return Promise.reject(new Error('Add your project URL and key first.'));
  return fetch(cfg.url+'/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin),{
    method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,create_user:true})
  }).then(function(r){
    return r.text().then(function(t){
      var d=null; try{ d=t?JSON.parse(t):null; }catch(e){}
      if(!r.ok)throw new Error((d&&(d.msg||d.message||d.error_description))||('HTTP '+r.status));
      return 'Check '+email+' for the sign-in link.';
    });
  });
}
/* Email and password. A magic link depends on mail delivery, on the link not
   being pre-fetched by a scanner (which consumes the one-time token), and on
   the redirect being allow-listed — three ways to fail before you ever reach
   the app. A password fails in one obvious place. */
function sbPassword(mode,email,pw){
  var cfg=sbCfg();
  if(!cfg)return Promise.reject(new Error('Add your project URL and key first.'));
  var url=cfg.url+(mode==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password');
  return fetch(url,{
    method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:pw})
  }).then(function(r){
    return r.text().then(function(t){
      var d=null; try{ d=t?JSON.parse(t):null; }catch(e){}
      if(!r.ok){
        var m=(d&&(d.msg||d.error_description||d.message))||('HTTP '+r.status);
        if(/invalid login|invalid_credentials/i.test(m))
          m='Email or password not recognised.';
        else if(/email not confirmed/i.test(m))
          m='That account still needs its email confirmed. Check your inbox, or turn off “Confirm email” in Supabase → Authentication → Providers.';
        else if(/already registered|already been registered/i.test(m))
          m='That email already has an account — sign in instead.';
        else if(/password/i.test(m)&&/least|short/i.test(m))
          m='Password must be at least 6 characters.';
        throw new Error(m);
      }
      if(d&&d.access_token){
        d.expires_at=Math.floor(Date.now()/1000)+(d.expires_in||3600);
        setSbSession(d);
        return 'in';
      }
      /* Signup succeeded but confirmation is required, so there is no session
         yet — say so rather than leaving them staring at an unchanged screen. */
      return 'confirm';
    });
  });
}
function sbSignOut(){ setSbSession(null); SB_STATE.org=null; }

/* The magic link returns to the app with the tokens in the URL fragment.
   Capture and strip them before anything renders, so they never sit in the
   address bar or reach the service worker's cache key. */
function sbCaptureRedirect(){
  if(!location.hash||location.hash.indexOf('access_token')<0)return false;
  var q={};
  location.hash.replace(/^#/,'').split('&').forEach(function(kv){
    var p=kv.split('='); q[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||'');
  });
  if(!q.access_token)return false;
  q.expires_at=Math.floor(Date.now()/1000)+Number(q.expires_in||3600);
  setSbSession(q);
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  return true;
}

/* Several policies check sender_id = auth.uid(). The id is already in the
   access token, so decode it rather than spend a round trip on /auth/v1/user. */
function sbUserId(){
  var sess=sbSession();
  if(!sess||!sess.access_token)return null;
  try{
    var b=sess.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4)b+='=';
    return JSON.parse(atob(b)).sub||null;
  }catch(e){ return null; }
}
function sbResolveOrg(){
  return sbRest('org_members?select=org_id&limit=1').then(function(r){
    SB_STATE.org=(r&&r[0])?r[0].org_id:null; return SB_STATE.org;
  });
}
function sbCreateOrg(name){
  return sbRest('rpc/gem_create_org',{method:'POST',body:{p_name:name}}).then(function(id){
    SB_STATE.org=id; return id;
  });
}

/* ---------- ids ---------- */
/* Local records carry ids like 'l2' and 'st-7-k29f'; every primary key in the
   schema is a uuid. Rather than keep a translation table forever, the ids are
   rewritten once — with every cross-reference followed — the first time the
   workspace is pushed. After that local and remote agree and sync is a plain
   upsert keyed on id. */
var UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function uuidv4(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  var b=new Uint8Array(16); crypto.getRandomValues(b);
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  var h=[].map.call(b,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
var ID_MAP_LAST={};
function sbMigrateIds(){
  var map={};
  ID_MAP_LAST=map;
  function reid(o){
    if(!o)return;
    if(!o.id){ o.id=uuidv4(); return; }
    if(UUID_RE.test(o.id))return;
    /* Sample records are identified by a fixed id. Once that id is rewritten
       the "remove sample data" control would lose track of them, so carry the
       flag across first. */
    Object.keys(SAMPLE_IDS).forEach(function(k){
      if(SAMPLE_IDS[k].indexOf(o.id)>=0)o.sample=true;
    });
    var n=uuidv4(); map[o.id]=n; o.id=n;
  }
  ['leads','vendors','bookings','invoices','documents','messages','submissions'].forEach(function(k){
    (db[k]||[]).forEach(reid);
  });
  if(db.leadForm)reid(db.leadForm);
  (db.questionnaires||[]).forEach(function(q){
    reid(q);
    /* answers is a map keyed by question id; rewrite the keys alongside the
       questions themselves or every stored answer is orphaned. */
    var old={}; (q.questions||[]).forEach(function(x){ old[x.id]=true; });
    var prev=q.answers||{}, moved={};
    (q.questions||[]).forEach(function(x){ var was=x.id; reid(x);
      if(prev[was]!==undefined)moved[x.id]=prev[was]; });
    if(q.answers)q.answers=moved;
  });
  (db.events||[]).forEach(function(e){
    reid(e);
    ['timeline','checklist','budget','tables','guests'].forEach(function(k){ (e[k]||[]).forEach(reid); });
    if(e.floor&&e.floor.items)e.floor.items.forEach(reid);
    if(e.design){
      (e.design.palette||[]).forEach(reid);
      (e.design.decor||[]).forEach(reid);
      (e.design.boards||[]).forEach(function(b){
        reid(b);
        ['ideas','swatches','images'].forEach(function(k){ (b[k]||[]).forEach(reid); });
      });
    }
  });
  function fix(o,k){ if(o&&o[k]&&map[o[k]])o[k]=map[o[k]]; }
  (db.events||[]).forEach(function(e){
    fix(e,'leadId');
    /* parentId points at another event, so it is rewritten with everything
       else. Left alone, the first push would send a child whose parent id no
       longer exists and the whole weekend would come apart. */
    fix(e,'parentId');
    (e.guests||[]).forEach(function(g){ fix(g,'tableId'); });
    (e.budget||[]).forEach(function(b){ fix(b,'tagEventId'); });
    if(e.design)(e.design.decor||[]).forEach(function(d){ fix(d,'vendorId'); });
  });
  /* An invitation points at three rewritten records at once. Miss any one and
     the first push sends a row whose foreign keys name ids that no longer
     exist — the same trap as parentId, three times over. */
  (db.invites||[]).forEach(function(i){
    reid(i); fix(i,'guestId'); fix(i,'eventId'); fix(i,'tableId');
  });
  (db.bookings||[]).forEach(function(b){ fix(b,'vendorId'); fix(b,'eventId'); });
  ['invoices','documents','questionnaires','messages'].forEach(function(k){
    (db[k]||[]).forEach(function(r){ fix(r,'eventId'); });
  });
  (db.submissions||[]).forEach(function(s){ fix(s,'leadId'); });
  ['activeEventId','eventId','clientId','boardId','qId'].forEach(function(k){ fix(state,k); });
  return Object.keys(map).length;
}

/* ---------- value translation ---------- */
/* The app labels an unpaid, past-due invoice 'over'; the schema calls it
   'overdue'. Everything else agrees. */
var INV_OUT={over:'overdue'}, INV_IN={overdue:'over'};
function nn(v){ return v===undefined||v===''?null:v; }        // '' → null for date/uuid columns
function s(v){ return v==null?'':String(v); }
function num(v){ return Number(v)||0; }

/* ---------- change tracking ---------- */
/* Pushing all 24 tables on every keystroke is fine for a button and hopeless
   on a timer. Each collection is hashed after it is built; only the ones that
   actually moved get written. */
function sbHashes(){ try{ return JSON.parse(localStorage.getItem('gem-sb-hash'))||{}; }catch(e){ return {}; } }
function setSbHashes(h){ try{ localStorage.setItem('gem-sb-hash',JSON.stringify(h)); }catch(e){} }
function sbHash(o){
  var t=JSON.stringify(o)||'', h=5381, i=t.length;
  while(i)h=(h*33^t.charCodeAt(--i))>>>0;
  return h;
}
function sbVer(){ var v=null; try{ v=localStorage.getItem('gem-sb-ver'); }catch(e){} return v===null?null:Number(v); }
function setSbVer(v){ try{ v===null?localStorage.removeItem('gem-sb-ver'):localStorage.setItem('gem-sb-ver',String(v)); }catch(e){} }

/* Compare-and-increment on the server. A device whose last-seen version has
   moved on is refused rather than allowed to prune away another device's
   work — the prune is what makes a blind push dangerous. */
function sbClaim(){
  return sbRest('rpc/gem_claim_sync',{method:'POST',body:{p_org:SB_STATE.org,p_expect:sbVer()}})
    .then(function(v){ return Number(v); })
    .catch(function(e){
      var m=String(e.message||'');
      if(/unsynced/i.test(m)){
        /* This device has never pulled, but the studio already holds records.
           Its ids differ from the ones on the server, so a push would insert a
           second copy of everything rather than update. */
        var u=new Error('This device has never synced with your studio. Pull first — pushing now would create a duplicate copy of everything.');
        u.stale=true; throw u;
      }
      if(/stale/i.test(m)){
        var err=new Error('Another device has saved since this one last synced. Pull first, then push.');
        err.stale=true; throw err;
      }
      throw e;
    });
}

/* ---------- push ---------- */
/* Upsert, then delete anything the server still holds that we no longer do.
   A blunt delete-all-then-insert would empty the studio if the push failed
   halfway. */
function sbUpsert(table,rows){
  if(!rows.length)return Promise.resolve();
  return sbRest(table,{method:'POST',body:rows,prefer:'resolution=merge-duplicates,return=minimal'});
}
function sbPrune(table,keepIds,scope){
  var q=table+'?'+(scope||('org_id=eq.'+SB_STATE.org));
  q+=keepIds.length?('&id=not.in.('+keepIds.join(',')+')'):'';
  return sbRest(q,{method:'DELETE',prefer:'return=minimal'});
}

function sbPush(opts){
  var org=SB_STATE.org;
  if(!org)return Promise.reject(new Error('No studio yet.'));
  opts=opts||{};
  sbMigrateIds();
  saveLocal();

  var me=sbUserId();
  var L=db.leads||[], E=db.events||[], V=db.vendors||[], B=db.bookings||[];
  /* form_submissions.form_id is NOT NULL and points at lead_forms, so the form
     itself has to exist first — it was never being pushed at all. */
  var lf=db.leadForm||null;
  if(lf&&!lf.id){ lf.id=uuidv4(); }
  var evIds=E.map(function(e){return e.id;});
  var has=function(id){ return evIds.indexOf(id)>=0; };

  var timeline=[],checklist=[],budget=[],tables=[],guests=[],fitems=[],
      palette=[],boards=[],swatches=[],ideas=[],decor=[],images=[];
  E.forEach(function(e){
    (e.timeline||[]).forEach(function(t,i){ timeline.push({id:t.id,org_id:org,event_id:e.id,at_time:s(t.t),title:s(t.ev),detail:s(t.ds),sort_order:i}); });
    (e.checklist||[]).forEach(function(c,i){ checklist.push({id:c.id,org_id:org,event_id:e.id,label:s(c.lbl),
      category:s(c.cat),done:!!c.done,due_date:nn(c.due),sort_order:i,
      owner:c.owner==='client'?'client':'planner',note:s(c.note)}); });
    /* tag_event_id marks the sub-event a line belongs to. The budget itself
       stays on the primary — a planner quotes a weekend as one number. */
    (e.budget||[]).forEach(function(b,i){ budget.push({id:b.id,org_id:org,event_id:e.id,category:s(b.cat),
      estimated:num(b.est),actual:num(b.act),sort_order:i,tag_event_id:nn(b.tagEventId)}); });
    (e.tables||[]).forEach(function(t,i){ tables.push({id:t.id,org_id:org,event_id:e.id,name:s(t.name),seats:num(t.seats)||1,
      shape:t.shape||'round',w:num(t.w),h:num(t.h),x:num(t.x),y:num(t.y),rotation:num(t.rot||t.rotation),sort_order:i}); });
    (e.guests||[]).forEach(function(g){ guests.push({id:g.id,org_id:org,event_id:e.id,name:s(g.name),party:s(g.party),
      side:s(g.side)||'A',rsvp:g.rsvp||'pending',meal:nn(g.meal),dietary:nn(g.diet),table_id:nn(g.tableId)}); });
    if(e.floor&&e.floor.items)e.floor.items.forEach(function(f,i){ fitems.push({id:f.id,org_id:org,event_id:e.id,
      kind:s(f.kind||f.type)||'fixture',label:s(f.label),x:num(f.x),y:num(f.y),w:num(f.w),h:num(f.h),rotation:num(f.rot||f.rotation),sort_order:i}); });
    var d=e.design||{};
    (d.palette||[]).forEach(function(c,i){ palette.push({id:c.id,org_id:org,event_id:e.id,hex:s(c.hex),name:s(c.name),sort_order:i}); });
    (d.decor||[]).forEach(function(x,i){ decor.push({id:x.id,org_id:org,event_id:e.id,item:s(x.item),vendor:s(x.vendor),
      vendor_id:nn(x.vendorId),status:x.status||'sourcing',sort_order:i}); });
    (d.boards||[]).forEach(function(b,i){
      boards.push({id:b.id,org_id:org,event_id:e.id,title:s(b.title),tone:s(b.tone),note:s(b.note),sort_order:i});
      (b.swatches||[]).forEach(function(c,j){ swatches.push({id:c.id,org_id:org,board_id:b.id,hex:s(c.hex),name:s(c.name),sort_order:j}); });
      (b.ideas||[]).forEach(function(x){ ideas.push({id:x.id,org_id:org,board_id:b.id,body:s(x.body||x.text)}); });
      /* Only images that made it into Storage — storage_path is NOT NULL. */
      (b.images||[]).forEach(function(im,j){
        if(im.path)images.push({id:im.id,org_id:org,board_id:b.id,event_id:e.id,
          storage_path:im.path,caption:s(im.caption),sort_order:j});
      });
    });
  });

  var qs=[],qq=[],qa=[];
  (db.questionnaires||[]).forEach(function(q){
    qs.push({id:q.id,org_id:org,event_id:has(q.eventId)?q.eventId:null,title:s(q.title),intro:s(q.intro),status:q.status||'draft'});
    (q.questions||[]).forEach(function(x,i){
      qq.push({id:x.id,org_id:org,questionnaire_id:q.id,prompt:s(x.prompt),kind:x.kind||'short_text',
               options:x.options||[],required:!!x.required,sort_order:i});
    });
    Object.keys(q.answers||{}).forEach(function(qid){
      var v=q.answers[qid];
      if(v===''||v==null)return;
      /* Keyed on the question id rather than a fresh uuid, so re-pushing
         updates the answer instead of deleting and re-creating it. */
      qa.push({id:qid,org_id:org,questionnaire_id:q.id,question_id:qid,
               event_id:has(q.eventId)?q.eventId:null,value:{v:v}});
    });
  });

  var steps=[
    ['leads',L.map(function(l){ return {id:l.id,org_id:org,names:s(l.names),event_type:s(l.type),event_date:nn(l.date),
      venue:s(l.venue),value:num(l.value),stage:s(l.stage)||'inquiry',guest_count:num(l.guests),email:s(l.email),
      phone:s(l.phone),notes:s(l.notes),partner_a:s(l.partnerA),partner_b:s(l.partnerB),pronouns_a:s(l.pronounsA),
      pronouns_b:s(l.pronounsB),alt_email:s(l.altEmail),preferred_contact:s(l.preferred),source:s(l.source),
      address:l.address||{},photo_path:nn(l.photoPath)}; })],
    /* Primaries first. events_parent_guard is a BEFORE ROW trigger, so it runs
       as each row lands rather than at the end of the statement — a child sent
       ahead of its parent is refused for pointing at an event that does not
       exist yet. Ordering here is cheaper than deferring the constraint. */
    ['events',E.slice().sort(function(a,b){ return (a.parentId?1:0)-(b.parentId?1:0); })
      .map(function(e){ var f=e.floor||{};
      /* A dangling parentId — its primary deleted on another device — would be
         rejected by the FK. Treat the event as standalone instead of failing
         the whole push; role and parent must agree or the check constraint
         refuses the row. */
      var par=(e.parentId&&E.some(function(x){return x.id===e.parentId;}))?e.parentId:null;
      return {id:e.id,org_id:org,lead_id:nn(e.leadId),title:s(e.title),
      event_date:nn(e.date),venue:s(e.venue),location:s(e.loc),start_time:s(e.startTime),
      parent_event_id:par,event_role:par?(s(e.role)||'other'):'primary',sort_order:num(e.sort),
      event_type:s(e.eventType)||'Wedding',
      role_label:par&&e.role==='custom'?s(e.roleLabel):'',
      venue_address:e.venueAddress||{},venue_contact:e.venueContact||{},venue_notes:s(e.venueNotes),
      floor:{w:num(f.w)||60,h:num(f.h)||40,unit:f.unit||'ft',snap:f.snap!==false,showChairs:f.showChairs!==false}}; })],
    ['vendors',V.map(function(v){ return {id:v.id,org_id:org,name:s(v.name),category:s(v.cat),contact:s(v.contact),
      email:s(v.email),phone:s(v.phone),notes:s(v.notes),preferred:!!v.preferred,rating:num(v.rating)}; })],
    ['seating_tables',tables],['guests',guests],
    /* After guests AND seating_tables — an invite carries a foreign key to
       both. The prune runs this list in reverse for the same reason.
       Invitations whose guest or event has gone are dropped rather than sent:
       the database would reject them, and locally they are already dead. */
    ['guest_invites',(db.invites||[]).filter(function(i){
        return has(i.eventId)&&guests.some(function(g){return g.id===i.guestId;});
      }).map(function(i){ return {id:i.id,org_id:org,guest_id:i.guestId,event_id:i.eventId,
        table_id:nn(i.tableId),rsvp:i.rsvp||'invited',meal:nn(i.meal)}; })],
    ['timeline_items',timeline],['checklist_items',checklist],
    ['budget_lines',budget],['floor_items',fitems],['event_palette',palette],['design_boards',boards],
    ['board_swatches',swatches],['board_ideas',ideas],['board_images',images],['decor_items',decor],
    ['vendor_bookings',B.filter(function(b){return has(b.eventId);}).map(function(b){ return {id:b.id,org_id:org,
      vendor_id:b.vendorId,event_id:b.eventId,status:b.status||'quote',fee:num(b.fee),notes:s(b.notes)}; })],
    ['invoices',(db.invoices||[]).map(function(i){ return {id:i.id,org_id:org,event_id:has(i.eventId)?i.eventId:null,
      number:s(i.num),client_name:s(invoiceClientName(i)),lead_id:has(i.leadId)?i.leadId:null,amount:num(i.amount),due_date:nn(i.due),
      status:INV_OUT[i.status]||i.status||'draft'}; })],
    ['documents',(db.documents||[]).map(function(d){ return {id:d.id,org_id:org,event_id:has(d.eventId)?d.eventId:null,
      title:s(d.title),type:d.type||'other',status:d.status||'draft',amount:num(d.amount),
      /* The attachment's metadata rides in the body column alongside any typed
         text, so no extra migration is needed for it. */
      body:JSON.stringify({text:s(d.body),file:d.file||null}),
      sent_at:nn(d.sent),signed_at:nn(d.signed)}; })],
    ['questionnaires',qs],['questions',qq],['answers',qa],
    /* messages.event_id is NOT NULL, so a message whose event has gone is
       dropped rather than sent with a null that the database will reject. */
    ['messages',(db.messages||[]).filter(function(m){ return has(m.eventId)&&s(m.body).trim(); })
      .map(function(m){ return {id:m.id,org_id:org,event_id:m.eventId,
      sender_role:m.role==='client'?'client':'planner',sender_name:s(m.name)||'—',
      body:s(m.body),sender_id:me}; })],
    ['lead_forms',lf?[{id:lf.id,org_id:org,slug:s(lf.slug)||'inquire',title:s(lf.title)||'Enquiry',
      intro:s(lf.intro),fields:lf.fields||[],active:lf.active!==false}]:[]],
    ['form_submissions',lf?(db.submissions||[]).map(function(x){ return {id:x.id,form_id:lf.id,org_id:org,
      payload:x,names:s(x.names),email:s(x.email),phone:s(x.phone),
      event_date:nn(x.date),status:x.status||'new'}; }):[]]
  ];

  /* Only write what moved. A full push ignores the hashes — that is what the
     manual button means by "make Supabase match this device". */
  var prevH=sbHashes(), nextH={}, live=[];
  steps.forEach(function(st){
    var h=sbHash(st[1]); nextH[st[0]]=h;
    if(opts.full||prevH[st[0]]!==h)live.push(st);
  });
  SB_SYNC.wrote=live.length;

  /* Parents before children — every child carries an FK to the row above it. */
  var chain=sbClaim().then(function(v){ SB_SYNC.claimed=v; });
  /* Photos first: mediaUpload() stamps photoPath/path onto the records, and
     the payloads above were built before that ran, so refresh the two that
     carry a storage reference. */
  chain=chain.then(function(){ return docRekey(ID_MAP_LAST); })
             .then(function(){ return mediaUpload(org); })
             .then(function(){ return docUpload(org); }).then(function(){
    steps.forEach(function(st){
      if(st[0]==='leads')st[1].forEach(function(r){
        var l=L.find(function(x){return x.id===r.id;}); if(l)r.photo_path=nn(l.photoPath);
      });
    });
    var im2=[];
    E.forEach(function(e){ ((((e.design||{}).boards)||[])).forEach(function(b){
      (b.images||[]).forEach(function(im,j){
        if(im.path)im2.push({id:im.id,org_id:org,board_id:b.id,event_id:e.id,
          storage_path:im.path,caption:s(im.caption),sort_order:j});
      });
    }); });
    steps.forEach(function(st){ if(st[0]==='board_images')st[1]=im2; });
    live.forEach(function(st){ if(st[0]==='board_images')st[1]=im2; });
    [steps,live].forEach(function(set){ set.forEach(function(st){
      if(st[0]!=='documents')return;
      st[1].forEach(function(r){
        var d=(db.documents||[]).find(function(x){return x.id===r.id;});
        if(d)r.body=JSON.stringify({text:s(d.body),file:d.file||null});
      });
    }); });
  });
  live.forEach(function(st){ chain=chain.then(function(){ return sbUpsert(st[0],st[1]); }); });

  /* Prune in reverse, so children go before the parents they point at. An
     untouched table already matches, so it needs no prune. */
  chain=chain.then(function(){
    var back=Promise.resolve();
    live.slice().reverse().forEach(function(st){
      back=back.then(function(){ return sbPrune(st[0],st[1].map(function(r){return r.id;})); });
    });
    return back;
  });

  /* Settings last: harmless on its own, and it confirms the whole run. */
  return chain.then(function(){
    var p=prefs();
    return sbRest('org_prefs',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',
      body:[{org_id:org,prefs:p,stages:loadStages(),templates:p.templates||{},fields:p.fields||[]}]});
  }).then(function(){
    /* Photos belonging to records that have since been deleted would sit in
       IndexedDB forever otherwise. */
    var keep={}; mediaItems().forEach(function(m){ keep[m.id]=true; });
    mediaPrune(keep);
    setSbHashes(nextH);
    setSbVer(SB_SYNC.claimed);
    SB_STATE.lastSync=new Date().toISOString(); SB_STATE.lastError=null;
    try{ localStorage.setItem('gem-sb-last',SB_STATE.lastSync); }catch(e){}
    return true;
  });
}

/* ---------- pull ---------- */
function sbPull(){
  var org=SB_STATE.org;
  if(!org)return Promise.reject(new Error('No studio yet.'));
  var t=['leads','events','timeline_items','checklist_items','budget_lines','seating_tables','guests','guest_invites',
         'floor_items','event_palette','design_boards','board_swatches','board_ideas','board_images','decor_items',
         'vendors','vendor_bookings','invoices','documents','questionnaires','questions','answers',
         'messages','form_submissions','lead_forms','org_prefs'];
  return Promise.all(t.map(function(n){ return sbRest(n+'?select=*'); })).then(function(res){
    var R={}; t.forEach(function(n,i){ R[n]=res[i]||[]; });
    var of=function(rows,id){ return rows.filter(function(r){return r.event_id===id;}); };

    var next={
      leads:R.leads.map(function(l){ return {id:l.id,names:l.names,type:l.event_type,date:l.event_date,venue:l.venue,
        value:Number(l.value),stage:l.stage,guests:l.guest_count,email:l.email,phone:l.phone,notes:l.notes,
        partnerA:l.partner_a,partnerB:l.partner_b,pronounsA:l.pronouns_a,pronounsB:l.pronouns_b,
        altEmail:l.alt_email,preferred:l.preferred_contact,source:l.source,address:l.address||{},
        photo:null,photoPath:l.photo_path||null}; }),
      events:R.events.map(function(e){
        var boards=R.design_boards.filter(function(b){return b.event_id===e.id;}).map(function(b){
          return {id:b.id,title:b.title,tone:b.tone,note:b.note,
            swatches:R.board_swatches.filter(function(x){return x.board_id===b.id;}).map(function(x){return {id:x.id,hex:x.hex,name:x.name};}),
            ideas:R.board_ideas.filter(function(x){return x.board_id===b.id;}).map(function(x){return {id:x.id,body:x.body};}),
            /* src stays empty; mediaDownload() fills it from Storage after. */
            images:R.board_images.filter(function(x){return x.board_id===b.id;})
              .sort(function(a,c){return a.sort_order-c.sort_order;})
              .map(function(x){ return {id:x.id,path:x.storage_path,caption:x.caption||'',src:null}; })};
        });
        return {id:e.id,leadId:e.lead_id,title:e.title,date:e.event_date,venue:e.venue,loc:e.location,
          startTime:e.start_time,venueAddress:e.venue_address||{},venueContact:e.venue_contact||{},venueNotes:e.venue_notes,
          parentId:e.parent_event_id||null,role:e.event_role||'primary',sort:e.sort_order||0,
          eventType:e.event_type||'Wedding',
          roleLabel:e.role_label||'',
          timeline:of(R.timeline_items,e.id).map(function(x){return {id:x.id,t:x.at_time,ev:x.title,ds:x.detail};}),
          checklist:of(R.checklist_items,e.id).map(function(x){return {id:x.id,lbl:x.label,cat:x.category,done:x.done,
            due:x.due_date,owner:x.owner==='client'?'client':'planner',note:x.note||''};}),
          budget:of(R.budget_lines,e.id).map(function(x){return {id:x.id,cat:x.category,est:Number(x.estimated),
            act:Number(x.actual),tagEventId:x.tag_event_id||null};}),
          tables:of(R.seating_tables,e.id).map(function(x){return {id:x.id,name:x.name,seats:x.seats,shape:x.shape,
            w:Number(x.w),h:Number(x.h),x:Number(x.x),y:Number(x.y),rot:Number(x.rotation)};}),
          guests:of(R.guests,e.id).map(function(x){return {id:x.id,name:x.name,party:x.party,side:x.side,rsvp:x.rsvp,
            meal:x.meal||'',diet:x.dietary||'',tableId:x.table_id};}),
          floor:Object.assign({items:of(R.floor_items,e.id).map(function(x){return {id:x.id,kind:x.kind,label:x.label,
            x:Number(x.x),y:Number(x.y),w:Number(x.w),h:Number(x.h),rot:Number(x.rotation)};})},e.floor||{}),
          design:{palette:of(R.event_palette,e.id).map(function(x){return {id:x.id,hex:x.hex,name:x.name};}),
            boards:boards,
            decor:of(R.decor_items,e.id).map(function(x){return {id:x.id,item:x.item,vendor:x.vendor,vendorId:x.vendor_id,status:x.status};})}};
      }),
      vendors:R.vendors.map(function(v){ return {id:v.id,name:v.name,cat:v.category,contact:v.contact,email:v.email,
        phone:v.phone,notes:v.notes||'',preferred:!!v.preferred,rating:v.rating||0}; }),
      invites:(R.guest_invites||[]).map(function(i){ return {id:i.id,guestId:i.guest_id,eventId:i.event_id,
        tableId:i.table_id||null,rsvp:i.rsvp||'invited',meal:i.meal||''}; }),
      bookings:R.vendor_bookings.map(function(b){ return {id:b.id,vendorId:b.vendor_id,eventId:b.event_id,
        status:b.status,fee:Number(b.fee),notes:b.notes||''}; }),
      invoices:R.invoices.map(function(i){ return {id:i.id,client:i.client_name,num:i.number,amount:Number(i.amount),
        due:i.due_date,status:INV_IN[i.status]||i.status,eventId:i.event_id,leadId:i.lead_id||null}; }),
      documents:R.documents.map(function(d){ return {id:d.id,title:d.title,type:d.type,status:d.status,
        amount:Number(d.amount),eventId:d.event_id,
        body:(function(){ try{ var j=JSON.parse(d.body||'{}'); return typeof j.text==='string'?j.text:(d.body||''); }catch(e){ return d.body||''; } })(),
        file:(function(){ try{ return (JSON.parse(d.body||'{}')||{}).file||null; }catch(e){ return null; } })(),
        sent:d.sent_at?String(d.sent_at).slice(0,10):'',signed:d.signed_at?String(d.signed_at).slice(0,10):''}; }),
      questionnaires:R.questionnaires.map(function(q){ return {id:q.id,title:q.title,intro:q.intro,status:q.status,
        eventId:q.event_id,
        questions:R.questions.filter(function(x){return x.questionnaire_id===q.id;})
          .sort(function(a,b){return a.sort_order-b.sort_order;})
          .map(function(x){ return {id:x.id,prompt:x.prompt,kind:x.kind,options:x.options||[],
            required:x.required}; }),
        answers:R.answers.filter(function(a){return a.questionnaire_id===q.id;})
          .reduce(function(m,a){ m[a.question_id]=a.value&&a.value.v; return m; },{})}; }),
      messages:R.messages.map(function(m){ return {id:m.id,eventId:m.event_id,name:m.sender_name,
        role:m.sender_role,body:m.body,at:m.created_at}; }),
      submissions:R.form_submissions.map(function(x){ return Object.assign({},x.payload||{},{id:x.id,status:x.status}); })
    };
    if(R.lead_forms&&R.lead_forms[0]){
      var f=R.lead_forms[0];
      next.leadForm={id:f.id,slug:f.slug,title:f.title,intro:f.intro||'',
                     fields:f.fields||[],active:f.active!==false};
    }
    normalize(next);
    db=next;
    if(R.org_prefs[0]&&R.org_prefs[0].stages&&R.org_prefs[0].stages.length){
      var sp=R.org_prefs[0];
      settings=Object.assign(prefs(),sp.prefs||{},{stages:sp.stages,templates:sp.templates,fields:sp.fields});
      try{ localStorage.setItem(SET_KEY,JSON.stringify(settings)); }catch(e){}
      loadStages();
    }
    saveLocal();
    /* Fresh from the server: nothing is locally dirty, and this device is now
       level with the version it just read. */
    setSbHashes({});
    setSbVer(R.org_prefs[0]?Number(R.org_prefs[0].sync_version||0):null);
    SB_STATE.lastSync=new Date().toISOString();
    try{ localStorage.setItem('gem-sb-last',SB_STATE.lastSync); }catch(e){}
    /* Pixels come down after the rows, so the pull returns as soon as the
       workspace is usable rather than waiting on every photo. */
    mediaDownload();
    return true;
  });
}

/* ---------- automatic sync ---------- */
var SB_SYNC={timer:null,busy:false,queued:false,claimed:null,wrote:0,status:'idle'};
function sbSetStatus(st,msg){
  SB_SYNC.status=st; SB_SYNC.msg=msg||'';
  var el=document.getElementById('sbPill');
  if(!el){
    if(st==='idle')return;
    el=document.createElement('div'); el.id='sbPill'; el.className='sb-pill';
    document.body.appendChild(el);
  }
  el.className='sb-pill '+st+(st==='idle'?'':' show');
  el.textContent=msg||'';
}
function sbAuto(){ return prefs().autoSync!==false; }
function sbAutoQueue(){
  if(!sbReady()||!SB_STATE.org||!sbAuto())return;
  clearTimeout(SB_SYNC.timer);
  /* Coalesce a burst of edits into one push rather than one per keystroke. */
  SB_SYNC.timer=setTimeout(sbSyncNow,4000);
}
function sbSyncNow(){
  if(!sbReady()||!SB_STATE.org)return Promise.resolve(false);
  if(SB_SYNC.busy){ SB_SYNC.queued=true; return Promise.resolve(false); }
  if(!navigator.onLine){ sbSetStatus('off','Offline — will sync when you reconnect'); return Promise.resolve(false); }
  SB_SYNC.busy=true; sbSetStatus('busy','Syncing…');
  return sbPush().then(function(){
    sbSetStatus(SB_SYNC.wrote?'ok':'idle',SB_SYNC.wrote?'Saved to Supabase':'');
    setTimeout(function(){ if(SB_SYNC.status==='ok')sbSetStatus('idle',''); },2200);
    return true;
  }).catch(function(e){
    if(e.stale)sbSetStatus('warn','Another device is ahead — open Settings › Connection to pull');
    else sbSetStatus('warn',e.message);
    return false;
  }).then(function(r){
    SB_SYNC.busy=false;
    if(SB_SYNC.queued){ SB_SYNC.queued=false; sbAutoQueue(); }
    return r;
  });
}
/* Cheap single-row read: has anyone else written since we last synced? */
function sbCheckRemote(){
  if(!sbReady()||!SB_STATE.org)return Promise.resolve(null);
  return sbRest('org_prefs?select=sync_version&org_id=eq.'+SB_STATE.org).then(function(r){
    if(!r||!r[0])return null;
    var remote=Number(r[0].sync_version||0), local=sbVer();
    if(local!==null&&remote>local)sbSetStatus('warn','Another device has newer work — pull from Settings › Connection');
    return remote;
  }).catch(function(){ return null; });
}
function sbWatch(){
  window.addEventListener('online',function(){
    if(sbReady()&&SB_STATE.org){ sbSetStatus('idle',''); sbAutoQueue(); }
  });
  window.addEventListener('offline',function(){
    if(sbReady())sbSetStatus('off','Offline — will sync when you reconnect');
  });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible'||!sbReady()||!SB_STATE.org)return;
    sbCheckRemote();
  });
  /* Flush anything still pending rather than lose it on close. */
  window.addEventListener('pagehide',function(){
    if(SB_SYNC.timer){ clearTimeout(SB_SYNC.timer); sbSyncNow(); }
  });
}


/* A magic-link return must be banked before the first paint. */
try{ sbCaptureRedirect(); }catch(e){}
/* Resolve the studio once at boot so a background push has somewhere to go
   without waiting for the Connection page to be opened. */
try{
  sbWatch();
  if(sbReady())sbResolveOrg().then(function(id){ if(id)sbCheckRemote(); }).catch(function(){});
}catch(e){}

/* Branding and stages were only ever applied by their own edit handlers, so
   both reverted to defaults on the next load even though prefs had saved
   correctly — the settings screen showed the right palette over a stock one. */
/* Couples reach the portal on their own hostname. Same Worker, same file —
   the host decides which face of the app you get, so a client never lands on
   the studio's pipeline even for the instant before a redirect. */
function portalHostMatch(){
  var want=String(prefs().portalHost||'').trim().toLowerCase()
    .replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(!want)return false;
  return location.hostname.toLowerCase()===want;
}
var PORTAL_ONLY=false;
try{ PORTAL_ONLY=portalHostMatch(); }catch(e){}
if(PORTAL_ONLY)document.body.classList.add('portal-only');

loadStages(); applyPrefs(); applyBrand(); paintIdentity();
/* Photos live in IndexedDB now, so put them back on the records. Async: it
   re-renders once they land. */
try{ mediaRehydrate(); }catch(e){}
setView(PORTAL_ONLY?'portal':(prefs().landing||'dashboard'));

/* First visit gets the walkthrough; afterwards it's on demand. */
$('#helpBtn').onclick=function(){ startTour('basics'); };
$('#settingsBtn').onclick=function(){ setView('settings',{settingsPage:null}); };

/* ---- collapse the sidebar to a rail so a tool can use the full width ---- */
var RAIL_KEY='gem-rail';
var appEl=document.querySelector('.app');
function setRail(on){
  appEl.classList.toggle('rail',on);
  var b=$('#railBtn');
  if(b){ b.textContent=on?'›':'✕';
         b.setAttribute('aria-label',on?'Expand sidebar':'Close sidebar');
         b.title=on?'Expand sidebar':'Close sidebar'; }
  try{ localStorage.setItem(RAIL_KEY,on?'1':'0'); }catch(e){}
  // the board measures itself against the available width
  setTimeout(function(){ dispatchEvent(new Event('resize')); },260);
}
try{ if(localStorage.getItem(RAIL_KEY)==='1')setRail(true); }catch(e){}
$('#railBtn').onclick=function(){
  // On a phone the sidebar is a drawer, so × means close it.
  if(mq('(max-width:860px)')){ setNav(false); return; }
  setRail(!appEl.classList.contains('rail'));
};
// ⌘\ / Ctrl-\ toggles it, the way editors do
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='\\'){ e.preventDefault(); setRail(!appEl.classList.contains('rail')); }
});
try{
  if(!localStorage.getItem(TOUR_KEY)) setTimeout(startTour,420);
}catch(e){}
})();
</script>
