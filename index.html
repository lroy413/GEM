/* --- Analytics --- */
function viewAnalytics(){
  var paid=db.invoices.filter(function(i){return i.status==='paid';});
  var revenue=paid.reduce(function(a,i){return a+i.amount;},0);
  var booked=db.leads.filter(function(l){return ['booked','planning','wrapped'].indexOf(l.stage)>-1;});
  var closedLost=db.leads.filter(function(l){return l.stage==='lost';}).length;
  var allDecided=booked.length+closedLost;
  var winRate=allDecided?Math.round(booked.length/allDecided*100):Math.round(booked.length/Math.max(1,db.leads.length)*100);
  var avg=booked.length?Math.round(booked.reduce(function(a,l){return a+l.value;},0)/booked.length):0;

  // revenue by month from paid invoices
  var months={};
  paid.forEach(function(i){ var k=(i.due||'').slice(0,7); if(k)months[k]=(months[k]||0)+i.amount; });
  var mKeys=Object.keys(months).sort();
  var mMax=Math.max.apply(null,mKeys.map(function(k){return months[k];}).concat([1]));

  // funnel
  var funnel=STAGES.map(function(s){
    var n=db.leads.filter(function(l){return l.stage===s.id;}).length;
    return {name:s.name,color:s.color,n:n,val:db.leads.filter(function(l){return l.stage===s.id;}).reduce(function(a,l){return a+l.value;},0)};
  });
  var fMax=Math.max.apply(null,funnel.map(function(f){return f.n;}).concat([1]));

  // lead sources
  var src={};
  db.leads.forEach(function(l){ var k=(l.source||'Unknown').split(' · ')[0]; src[k]=(src[k]||0)+1; });
  var sKeys=Object.keys(src).sort(function(a,b){return src[b]-src[a];});
  var sMax=Math.max.apply(null,sKeys.map(function(k){return src[k];}).concat([1]));

  // event types
  var types={};
  db.leads.forEach(function(l){ types[l.type]=(types[l.type]||0)+l.value; });
  var tKeys=Object.keys(types).sort(function(a,b){return types[b]-types[a];});
  var tTotal=tKeys.reduce(function(a,k){return a+types[k];},0)||1;

  return ''+
  '<div class="stat-row">'+
    stat('Revenue Collected',money(revenue),paid.length+' paid invoices','up')+
    stat('Booked Value',money(booked.reduce(function(a,l){return a+l.value;},0)),booked.length+' events')+
    stat('Avg Contract',money(avg),'per booked event')+
    stat('Win Rate',winRate+'%','of decided leads')+
  '</div>'+
  '<div class="grid-2" style="align-items:start">'+
    '<div class="card" style="margin-bottom:20px"><div class="card-h"><h3>Revenue by Month</h3>'+
      '<span class="sec-badge">'+money(revenue)+' total</span></div>'+
      '<div class="chart">'+(mKeys.length?mKeys.map(function(k){
        var h=Math.round(months[k]/mMax*100);
        var d=new Date(k+'-01T00:00');
        return '<div class="col-bar"><div class="cb-track"><div class="cb-fill" style="height:'+h+'%" title="'+money(months[k])+'"></div></div>'+
          '<div class="cb-l">'+d.toLocaleDateString('en-US',{month:'short'})+'</div>'+
          '<div class="cb-v">'+(months[k]>=1000?'$'+Math.round(months[k]/1000)+'k':money(months[k]))+'</div></div>';
      }).join(''):'<div class="empty-hint">No paid invoices yet.</div>')+'</div></div>'+
    '<div class="card" style="margin-bottom:20px"><div class="card-h"><h3>Pipeline Funnel</h3></div>'+
      '<div style="padding:18px 22px">'+funnel.map(function(f){
        return '<div class="fn"><div class="fn-l"><span class="dot" style="background:'+f.color+'"></span>'+esc(f.name)+'</div>'+
          '<div class="fn-bar"><i style="width:'+Math.round(f.n/fMax*100)+'%;background:'+f.color+'"></i></div>'+
          '<div class="fn-n">'+f.n+'</div><div class="fn-v">'+money(f.val)+'</div></div>';
      }).join('')+'</div></div>'+
  '</div>'+
  '<div class="grid-2" style="align-items:start">'+
    '<div class="card"><div class="card-h"><h3>Where Leads Come From</h3></div>'+
      '<div style="padding:18px 22px">'+sKeys.map(function(k){
        return '<div class="bud-row" style="padding:9px 0;border:none"><div class="cat" style="width:150px">'+esc(k)+'</div>'+
          '<div class="track"><div class="bar" style="height:10px"><i style="width:'+Math.round(src[k]/sMax*100)+'%"></i></div></div>'+
          '<div class="amt" style="width:60px"><b>'+src[k]+'</b></div></div>';
      }).join('')+'</div></div>'+
    '<div class="card"><div class="card-h"><h3>Value by Event Type</h3></div>'+
      '<div style="padding:18px 22px">'+
        '<div class="donut-row">'+tKeys.map(function(k,i){
          var pct=Math.round(types[k]/tTotal*100);
          var cols=['#C9A24B','#E4AAB3','#8FBF9F','#B7A6D6','#E7C86B'];
          return '<div class="dl"><span class="dot" style="background:'+cols[i%cols.length]+'"></span>'+
            '<span class="dl-n">'+esc(k)+'</span><span class="dl-p">'+pct+'%</span><span class="dl-v">'+money(types[k])+'</span></div>';
        }).join('')+'</div>'+
        '<div class="stackbar">'+tKeys.map(function(k,i){
          var cols=['#C9A24B','#E4AAB3','#8FBF9F','#B7A6D6','#E7C86B'];
          return '<i style="width:'+(types[k]/tTotal*100)+'%;background:'+cols[i%cols.length]+'"></i>';
        }).join('')+'</div>'+
      '</div></div>'+
  '</div>';
}

/* --- Tax tool --- */
function taxState(){
  if(!db.tax)db.tax={rate:25,quarterly:true,expenses:[
    {id:'tx1',label:'Software & subscriptions',amount:2400},
    {id:'tx2',label:'Mileage & travel',amount:3100},
    {id:'tx3',label:'Marketing & advertising',amount:1800},
    {id:'tx4',label:'Insurance',amount:1450},
    {id:'tx5',label:'Contract labour (day-of assistants)',amount:6200}
  ]};
  return db.tax;
}
function viewTax(){
  var t=taxState();
  var paid=db.invoices.filter(function(i){return i.status==='paid';});
  var gross=paid.reduce(function(a,i){return a+i.amount;},0);
  var expenses=t.expenses.reduce(function(a,e){return a+e.amount;},0);
  var net=Math.max(0,gross-expenses);
  var setAside=Math.round(net*(t.rate/100));
  var perQuarter=Math.round(setAside/4);
  var upcoming=db.invoices.filter(function(i){return i.status==='due'||i.status==='over';}).reduce(function(a,i){return a+i.amount;},0);
  var projected=Math.round((net+upcoming)*(t.rate/100));

  // quarterly revenue split
  var q=[0,0,0,0];
  paid.forEach(function(i){ var m=Number((i.due||'').slice(5,7))||1; q[Math.floor((m-1)/3)]+=i.amount; });
  var qMax=Math.max.apply(null,q.concat([1]));

  return ''+
  '<div class="stat-row">'+
    stat('Gross Revenue',money(gross),paid.length+' paid invoices','up')+
    stat('Deductions',money(expenses),t.expenses.length+' categories')+
    stat('Net Income',money(net),'after deductions')+
    stat('Set Aside',money(setAside),t.rate+'% of net')+
  '</div>'+
  '<div class="tax-note">§ These are estimates to help you plan cash flow — not tax advice. Confirm rates and deductible categories with your accountant.</div>'+
  '<div class="grid-2" style="align-items:start">'+
    '<div>'+
      '<div class="card" style="margin-bottom:20px"><div class="card-h"><h3>Set-Aside Calculator</h3></div>'+
        '<div style="padding:20px 22px">'+
          '<div class="field" style="margin-bottom:18px"><label>Estimated tax rate — <b>'+t.rate+'%</b></label>'+
            '<input type="range" id="taxRate" min="0" max="50" step="1" value="'+t.rate+'" class="range"></div>'+
          '<div class="kv"><span>Gross revenue</span><b>'+money(gross)+'</b></div>'+
          '<div class="kv"><span>Less deductions</span><b>−'+money(expenses)+'</b></div>'+
          '<div class="kv"><span>Net income</span><b>'+money(net)+'</b></div>'+
          '<div class="kv total"><span>Set aside for tax</span><b>'+money(setAside)+'</b></div>'+
          '<div class="kv"><span>Per quarter</span><b>'+money(perQuarter)+'</b></div>'+
          '<div class="kv"><span>Projected incl. outstanding</span><b>'+money(projected)+'</b></div>'+
        '</div></div>'+
      '<div class="card"><div class="card-h"><h3>Revenue by Quarter</h3></div>'+
        '<div class="chart">'+q.map(function(v,i){
          return '<div class="col-bar"><div class="cb-track"><div class="cb-fill" style="height:'+Math.round(v/qMax*100)+'%"></div></div>'+
            '<div class="cb-l">Q'+(i+1)+'</div><div class="cb-v">'+(v>=1000?'$'+Math.round(v/1000)+'k':money(v))+'</div></div>';
        }).join('')+'</div></div>'+
    '</div>'+
    '<div class="card"><div class="card-h"><h3>Deductible Expenses</h3>'+
      '<button class="btn btn-ghost btn-sm" id="addExpense">＋ Expense</button></div>'+
      '<div class="tbl-wrap"><table><tbody>'+t.expenses.map(function(e){
        return '<tr><td><b>'+esc(e.label)+'</b></td>'+
          '<td style="text-align:right"><span class="val">'+money(e.amount)+'</span></td>'+
          '<td style="width:44px"><button class="idea-x" style="position:static;opacity:1;background:var(--pink-100);color:var(--ink-soft)" data-delexp="'+esc(e.id)+'" aria-label="Remove">✕</button></td></tr>';
      }).join('')+
      '<tr><td><b>Total</b></td><td style="text-align:right"><span class="val">'+money(expenses)+'</span></td><td></td></tr>'+
      '</tbody></table></div></div>'+
  '</div>';
}
function wireTax(){
  var t=taxState();

/* --- Client Portal (mirrors the RLS rules: no leads, budget, or vendor fees) --- */
function viewPortal(){
  var act=activeEvent(); if(!act)return emptyState('No events yet.');
  /* The portal always anchors on the primary, whichever event the planner has
     selected. A couple does not think of their welcome party as a separate
     login — they think "our weekend", counted down to the wedding. */
  var e=evPrimary(act);
  /* Chronological here, unlike the staff views: the couple reads their weekend
     forwards, and the welcome party genuinely comes before the ceremony. */
  var block=evBlock(e).slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
  var blockIds=block.map(function(x){return x.id;});
  var multi=block.length>1;
  var inBlock=function(id){ return blockIds.indexOf(id)>-1; };
  var done=0,tot=0;
  /* The couple's progress is progress on THEIR tasks. Counting the studio's
     internal work would show them a number they cannot move. */
  block.forEach(function(x){
    var own=(x.checklist||[]).filter(function(c){return c.owner==='client';});
    done+=own.filter(function(c){return c.done;}).length; tot+=own.length;
  });
  var pct=tot?Math.round(done/tot*100):0;
  var roster=rosterFor(e);
  var attending=roster.filter(function(g){return gRsvp(g,e)==='yes';}).length;
  var awaiting=roster.filter(function(g){var r=gRsvp(g,e);return r==='pending'||r==='invited';}).length;
  /* Everything the couple is owed across the whole weekend — paperwork for the
     rehearsal dinner is theirs to sign too. */
  var docs=db.documents.filter(function(d){return inBlock(d.eventId)&&d.status!=='draft';});
  var inv=invoicesForLead(leadForEvent(e));
  var qs=db.questionnaires.filter(function(q){return inBlock(q.eventId)&&q.status!=='draft';});
  var thread=db.messages.filter(function(m){return inBlock(m.eventId);}).sort(function(a,b){return a.at<b.at?-1:1;});

    'so you can test signing and answering. Leads, vendor fees, and internal budget lines stay hidden, enforced by row-level security.</div>'+

    '<div class="ph-date">'+fmtDate(e.date)+'</div>'+
    (prefs().portalWelcome?'<div class="ph-welcome">'+esc(prefs().portalWelcome)+'</div>':'')+
    /* The weekend at a glance, in the hero, so the first thing a couple sees
       is that all of it is being looked after — not just the ceremony. */
    (multi?'<div class="ph-block">'+block.map(function(x){
      return '<div class="phb'+(x.id===e.id?' lead':'')+'">'+
        '<span class="phb-r">'+esc(roleLabel(x,true))+'</span>'+
        '<span class="phb-d">'+fmtDate(x.date)+'</span>'+

    }).join('')+'</div>':'')+
  '</div>'+

      (multi?block.map(function(x){

/* --- Finance --- */
function viewFinance(){
  /* Invoices stand on their own; the budget card needs an event, and there may
     not be one — a new studio, or the sample data removed. */
  var e=db.events[0];
  var estT=e?e.budget.reduce(function(a,b){return a+b.est;},0):0;
  var actT=e?e.budget.reduce(function(a,b){return a+b.act;},0):0;
  var paid=db.invoices.filter(function(x){return x.status==='paid';}).reduce(function(a,x){return a+x.amount;},0);
  var out=db.invoices.filter(function(x){return x.status==='due'||x.status==='over';}).reduce(function(a,x){return a+x.amount;},0);
  return ''+
  '<div class="stat-row cols-3">'+
    stat('Collected',money(paid),'this season','up')+
    stat('Outstanding',money(out),db.invoices.filter(function(x){return x.status==='due';}).length+' due · '+db.invoices.filter(function(x){return x.status==='over';}).length+' overdue')+
    stat('Drafts',money(db.invoices.filter(function(x){return x.status==='draft';}).reduce(function(a,x){return a+x.amount;},0)),'ready to send')+
  '</div>'+
  '<div class="card" style="margin-bottom:20px"><div class="card-h"><h3>Invoices</h3><span class="pill">'+db.invoices.length+'</span></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Invoice</th><th>Client</th><th>Due</th><th>Status</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+
    db.invoices.map(function(x){var cls={paid:'s-paid',due:'s-due',over:'s-over',draft:'s-draft'}[x.status],lbl={paid:'Paid',due:'Due',over:'Overdue',draft:'Draft'}[x.status];
      return '<tr><td><b>'+esc(x.num)+'</b></td><td>'+esc(invoiceClientName(x))+'</td><td>'+fmtDate(x.due)+'</td><td><span class="status '+cls+'">'+lbl+'</span></td><td style="text-align:right"><span class="val">'+money(x.amount)+'</span>'+rowActions('invoice',x.id)+'</td></tr>';
    }).join('')+'</tbody></table></div></div>'+
  (e?
  '<div class="card"><div class="card-h"><h3>Budget · '+esc(e.title)+'</h3><span class="sec-badge">'+money(actT)+' of '+money(estT)+' committed</span></div>'+
    '<div style="padding:8px 0 12px">'+(e.budget.length?e.budget.map(function(b){var aw=b.est?Math.round(b.act/b.est*100):0;
      return '<div class="bud-row"><div class="cat">'+esc(b.cat)+'</div><div class="track"><div class="bar" style="height:12px"><i style="width:'+aw+'%"></i></div></div>'+
      '<div class="amt"><b>'+money(b.act)+'</b> / '+money(b.est)+'</div></div>';
    }).join(''):'<div class="empty-hint">No budget lines yet.</div>')+'</div></div>'
  :'<div class="card"><div class="card-h"><h3>Budget</h3></div>'+
    '<div class="empty-hint" style="padding:26px">Create an event to start tracking a budget.</div></div>');
}

/* Quick add: built for typing several in a row, because nobody adds one guest.
   "Save & add another" keeps the sheet open and the cursor in the name field;
   the link out goes to the full list for anything more involved. */
function openGuestModal(ev){
  var e=ev||activeEvent(); if(!e){toast('Create an event first ✦');return;}
  /* Guests belong to the primary. Adding one from a sub-event adds them to the
     weekend's list and invites them to that night, which is what "add a guest
     here" means when you are looking at the rehearsal dinner. */
  var prim=evPrimary(e)||e, sub=evIsSub(e), added=0;
  md.className='modal';md.innerHTML='<h3>Add Guest</h3><p class="sub">'+
    (sub?'Adding to '+esc(prim.title)+', and inviting them to '+esc(roleLabel(e))+'.'
        :'Adding to '+esc(prim.title)+'.')+'</p>'+
    '<div class="field"><label>Full name</label><input id="f_gname" placeholder="e.g. Eleanor Vance"></div>'+
    '<div class="field"><label>Party / group</label><input id="f_gparty" placeholder="e.g. Vance Family"></div>'+
    '<div class="field"><label>RSVP</label><select id="f_grsvp"><option value="invited">Invited</option><option value="pending">Pending</option><option value="yes">Attending</option><option value="no">Declined</option></select></div>'+
    '<div class="field"><label>Meal choice</label><select id="f_gmeal"><option value="">Not selected</option><option>Beef</option><option>Fish</option><option>Vegetarian</option><option>Kids</option></select></div>'+
    '<div class="field"><label>Dietary needs <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="f_gdiet" placeholder="e.g. Nut allergy"></div>'+
    '<div class="modal-actions wrap"><button class="link-btn ma-lead" id="gFull">Open the full guest list ›</button>'+
      '<button class="btn btn-ghost" id="mCancel">Cancel</button>'+
      '<button class="btn btn-ghost" id="mAnother">Save &amp; add another</button>'+
      '<button class="btn btn-gold" id="mSave">Add guest</button></div>'+
    '<div class="gm-count" id="gCount"></div>';
  ov.classList.add('show');
  setTimeout(function(){ var f=$('#f_gname'); if(f)f.focus(); },60);

  function add(){
    var n=$('#f_gname').value.trim();
    if(!n){ $('#f_gname').focus(); return false; }
    var g={id:uid('g'),name:n,party:$('#f_gparty').value.trim()||'Guest',side:'A',
      rsvp:$('#f_grsvp').value,meal:$('#f_gmeal').value,diet:$('#f_gdiet').value.trim(),tableId:null};
    prim.guests.push(g);
    /* On a sub-event the RSVP and meal just chosen describe THAT night, so
       they go on the invitation rather than the guest row. */
    if(sub){ setInvited(g,e,true); gSet(g,e,'rsvp',$('#f_grsvp').value); gSet(g,e,'meal',$('#f_gmeal').value); }
    added++;
    save();
    return true;
  }
  function done(){ closeModal(); render(); }

  $('#mCancel').onclick=function(){ if(added)done(); else closeModal(); };
  $('#mSave').onclick=function(){ if(add())done(); };
  $('#mAnother').onclick=function(){
    if(!add())return;
    ['f_gname','f_gparty','f_gdiet'].forEach(function(id){ var el=$('#'+id); if(el)el.value=''; });
    $('#gCount').textContent=added+' added — keep going, or Cancel when you are done.';
    $('#f_gname').focus();
  };
  /* Enter adds and stays put; the whole point is a run of names. */
  $('#f_gname').onkeydown=function(ev2){ if(ev2.key==='Enter'){ ev2.preventDefault(); $('#mAnother').click(); } };
  $('#gFull').onclick=function(){
    if($('#f_gname').value.trim())add();
    closeModal(); state.activeEventId=e.id; setView('guests');
  };
}

/* ============================================================
 * Generic record editor + delete confirmation.
 * One field-spec driven modal keeps every entity behaving the same
 * instead of a dozen bespoke dialogs drifting apart.
 * ============================================================ */
/* Times are typed a dozen ways and printed on a running order that a vendor
   team reads at a glance, so they get normalised to one shape. Anything this
   cannot parse is left exactly as typed rather than mangled — a planner who
   writes "after the toasts" keeps it.

     10        → 10:00 AM        1000   → 10:00 AM
     4:30      → 4:30 PM         430p   → 4:30 PM
     17:30     → 5:30 PM         9.05   → 9:05 AM
     noon      → 12:00 PM        0:15   → 12:15 AM

   With no am/pm given, 7–11 reads as morning and everything else as
   afternoon — the shape of a wedding day. It normalises as you leave the
   field, so a wrong guess is visible immediately and one keystroke to fix. */
function normTime(v){
  var s=String(v==null?'':v).trim();
  if(!s)return '';
  if(/^noon$/i.test(s))return '12:00 PM';
  if(/^midnight$/i.test(s))return '12:00 AM';
  /* Every part after the hour is optional — "4:30" and "17:30" are times too,
     and requiring the am/pm here left them untouched. */
  var m=s.match(/^(\d{1,2})\s*[:.\-]?\s*(\d{2})?\s*([ap])?\.?\s*m?\.?$/i);
  if(!m){
    /* Bare digits: 930 and 1015 are times, 9 and 10 are hours. */
    var d=s.match(/^(\d{3,4})$/);
    if(d)m=[s,d[1].slice(0,d[1].length-2),d[1].slice(-2),null];
    else{
      var h1=s.match(/^(\d{1,2})$/);
      if(h1)m=[s,h1[1],null,null];
      else return s;
    }
  }
  var h=parseInt(m[1],10), min=m[2]?parseInt(m[2],10):0;
  var mer=m[3]?m[3].toLowerCase():null;
  if(isNaN(h)||isNaN(min)||min>59||h>23)return s;
  if(h===0){ h=12; mer=mer||'a'; }
  else if(h>12){ h-=12; mer='p'; }              // 24-hour input is unambiguous
  else if(h===12&&!mer){ mer='p'; }
  if(!mer)mer=(h>=7&&h<=11)?'a':'p';
  return h+':'+String(min).padStart(2,'0')+' '+(mer==='a'?'AM':'PM');
}

function openEditor(o){
  var fields=o.fields||[];
  md.className='modal';
  md.innerHTML='<h3>'+esc(o.title)+'</h3>'+(o.sub?'<p class="sub">'+esc(o.sub)+'</p>':'')+
    '<div class="modal-scroll"><div class="'+(o.twoCol?'fgrid':'')+'">'+
    fields.map(function(f){
      var id='ed_'+f.id, v=f.value==null?'':f.value;
      var ctl;
      if(f.type==='textarea') ctl='<textarea id="'+id+'" rows="3" class="notes-box">'+esc(v)+'</textarea>';
      else if(f.type==='select') ctl='<select id="'+id+'">'+(f.options||[]).map(function(op){
          var val=(typeof op==='object')?op.value:op, lab=(typeof op==='object')?op.label:op;
          return '<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(lab)+'</option>';
        }).join('')+'</select>';
      else ctl='<input id="'+id+'" type="'+(f.type||'text')+'" value="'+esc(v)+'"'+
        (f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>';
      return '<div class="field" data-fid="'+f.id+'"'+(f.full?' style="grid-column:1/-1"':'')+'><label for="'+id+'">'+esc(f.label)+
        (f.required?' <span class="req">required</span>':'')+'</label>'+ctl+'</div>';
    }).join('')+'</div></div>'+
    '<div class="modal-actions">'+
      (o.onDelete?'<button class="btn btn-danger" id="mDelete">Delete</button><span style="flex:1"></span>':'')+
      '<button class="btn btn-ghost" id="mCancel">Cancel</button>'+
      '<button class="btn btn-gold" id="mSave">'+esc(o.saveLabel||'Save changes')+'</button></div>';
  ov.classList.add('show');
  $('#mCancel').onclick=closeModal;
  var del=$('#mDelete');
  if(del)del.onclick=function(){ confirmDelete(o.deleteLabel||o.title,function(){ o.onDelete(); }); };
  /* Conditional fields. A field with showIf(vals) is hidden while that returns
     false, and reads as empty on save — so a question that does not apply
     cannot answer itself with a stale value. Fields are still built once, so
     nothing typed is lost if a field hides and reappears. */
  function currentVals(){
    var v={};
    fields.forEach(function(f){
      var el=$('#ed_'+f.id); if(!el)return;
      var raw=el.value; if(typeof raw==='string')raw=raw.trim();
      v[f.id]=(f.type==='number')?(Number(raw)||0):raw;
    });
    return v;
  }
  function visible(f,v){ return typeof f.showIf!=='function'||!!f.showIf(v); }
  function refresh(){
    var v=currentVals();
    fields.forEach(function(f){
      if(typeof f.showIf!=='function')return;
      var wrap=md.querySelector('.field[data-fid="'+f.id+'"]');
      if(wrap)wrap.style.display=visible(f,v)?'':'none';
    });
  }
  /* Some selects depend on another field's value for their OPTIONS, not just
     their visibility — the sub-event roles come from the event type. */
  if(typeof o.onFieldChange==='function'){
    md.querySelectorAll('.modal-scroll input,.modal-scroll select')
      .forEach(function(el){ el.addEventListener('change',function(){ o.onFieldChange(currentVals(),md); }); });
  }
  if(fields.some(function(f){return typeof f.showIf==='function';})){
    md.querySelectorAll('.modal-scroll input,.modal-scroll select,.modal-scroll textarea')
      .forEach(function(el){ el.addEventListener('change',refresh); el.addEventListener('input',refresh); });
    refresh();
  }

  $('#mSave').onclick=function(){
    var live=currentVals(), vals={}, missing=null;
    fields.forEach(function(f){
      var el=$('#ed_'+f.id); if(!el)return;
      /* A hidden field is not a question that was asked. */
      if(!visible(f,live)){ vals[f.id]=(f.type==='number')?0:''; return; }
      var raw=el.value; if(typeof raw==='string')raw=raw.trim();
      if(f.required&&!raw&&!missing)missing=el;
      vals[f.id]=(f.type==='number')?(Number(raw)||0):(f.fmt==='time'?normTime(raw):raw);
    });
    if(missing){ missing.focus(); toast('Please complete the required fields.'); return; }
    o.onSave(vals);
  };
  /* fmt:'time' fields tidy themselves as you leave them, so the result is
     visible and correctable rather than a surprise at save time. */
  fields.forEach(function(f){
    if(f.fmt!=='time')return;
    var el=$('#ed_'+f.id); if(!el)return;
    el.setAttribute('inputmode','numeric');
    el.onblur=function(){ el.value=normTime(el.value); };
  });
  var first=md.querySelector('.modal-scroll input,.modal-scroll select,.modal-scroll textarea');
  if(first)setTimeout(function(){first.focus();},60);
}

    '<p class="sub">This cannot be undone.</p>'+

      '<button class="btn btn-danger" id="mYes">Delete</button></div>';

  $('#mYes').onclick=function(){ closeModal(); onYes(); };
  setTimeout(function(){ var b=$('#mNo'); if(b)b.focus(); },60);
}

}

function tourEls(){
  var veil=document.getElementById('tourVeil');
  if(veil)return {veil:veil,hole:document.getElementById('tourHole'),card:document.getElementById('tourCard')};
  veil=document.createElement('div'); veil.id='tourVeil'; veil.className='tour-veil';
  veil.innerHTML='<div class="tour-hole" id="tourHole"></div><div class="tour-card" id="tourCard" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(veil);
  return {veil:veil,hole:document.getElementById('tourHole'),card:document.getElementById('tourCard')};
}
function endTour(completed){
  var v=document.getElementById('tourVeil');
  if(v)v.remove();
  document.body.classList.remove('tour-on');
  try{ localStorage.setItem(TOUR_KEY,completed?'done':'skipped'); }catch(e){}
  if(completed){
    toursDone[tourKeyRunning]=true; saveTours();
    var t=TOURS[tourKeyRunning];
    toast((t?t.name:'Tour')+' complete ✦');
    if(tourKeyRunning==='basics')setView('dashboard');
    else setView('settings',{settingsPage:'tours'});
  }
}
function showTourStep(){
  var list=(TOURS[tourKeyRunning]||{}).steps||TOUR;
  var step=list[tourAt];
  if(!step)return endTour(true);
  var go=function(){
    var t=tourEls();
    document.body.classList.add('tour-on');
    var target=step.sel?document.querySelector(step.sel):null;
    var r=target?target.getBoundingClientRect():null;
    // A target that scrolled out of view is no use — bring it in first.
    if(r&&(r.top<0||r.bottom>innerHeight)){
      target.scrollIntoView({block:'center',behavior:'auto'});
      r=target.getBoundingClientRect();
    }
    if(r&&r.width&&r.height){
      var pad=8;
      t.hole.style.opacity='1';
      t.hole.style.left=(r.left-pad)+'px';
      t.hole.style.top=(r.top-pad)+'px';
      t.hole.style.width=(r.width+pad*2)+'px';
      t.hole.style.height=(r.height+pad*2)+'px';
    }else{
      t.hole.style.opacity='0';
      t.hole.style.left='50%'; t.hole.style.top='50%';
      t.hole.style.width='0px'; t.hole.style.height='0px';
    }
    t.card.innerHTML=
      '<div class="tc-step">'+esc((TOURS[tourKeyRunning]||{}).name||'Tour')+' · Step '+(tourAt+1)+' of '+list.length+'</div>'+
      '<h3>'+esc(step.title)+'</h3>'+
      '<p>'+esc(step.body)+'</p>'+
      '<div class="tc-dots">'+list.map(function(_,i){
        return '<i class="'+(i===tourAt?'on':(i<tourAt?'past':''))+'"></i>';}).join('')+'</div>'+
      (step.sample&&hasSampleData()?
        '<div class="tc-sample">'+
          '<div class="tcs-t">Sample wedding · Priya &amp; Sam</div>'+
          '<div class="tcs-b">Removing it clears that event with its client, vendors, '+
            'guests, documents and invoices. Nothing you have added yourself is touched.</div>'+
          '<button class="btn btn-ghost btn-sm" id="tourWipe">Remove sample wedding</button>'+
        '</div>':'')+
      '<div class="tc-actions">'+
        '<button class="btn btn-ghost btn-sm" id="tourSkip">Skip tour</button>'+
        '<span style="flex:1"></span>'+
        (tourAt>0?'<button class="btn btn-ghost btn-sm" id="tourBack">Back</button>':'')+
        '<button class="btn btn-gold btn-sm" id="tourNext">'+(tourAt===list.length-1?'Finish':'Next')+'</button>'+
      '</div>';
    // place the card near the target, flipping and clamping to stay on screen
    var cw=Math.min(330,innerWidth-28), ch=t.card.offsetHeight||210;
    var left,top,place=step.place||'bottom';
    if(!r||!r.width){ left=(innerWidth-cw)/2; top=(innerHeight-ch)/2; }
    else{
      if(place==='right'&&r.right+cw+22<innerWidth){ left=r.right+16; top=r.top; }
      else if(place==='left'&&r.left-cw-22>0){ left=r.left-cw-16; top=r.top; }
      else if(place==='top'&&r.top-ch-22>0){ left=r.left; top=r.top-ch-16; }
      else if(r.bottom+ch+22<innerHeight){ left=r.left; top=r.bottom+16; }
      else if(r.top-ch-22>0){ left=r.left; top=r.top-ch-16; }
      else { left=(innerWidth-cw)/2; top=innerHeight-ch-20; }
      left=Math.max(14,Math.min(innerWidth-cw-14,left));
      top=Math.max(14,Math.min(innerHeight-ch-14,top));
    }
    t.card.style.width=cw+'px';
    t.card.style.left=left+'px';
    t.card.style.top=top+'px';
    var wipe=$('#tourWipe');
    if(wipe)wipe.onclick=function(){
      // Arm-then-fire, so a stray tap can't wipe the sample studio.
      if(wipe.dataset.armed!=='1'){
        wipe.dataset.armed='1';
        wipe.textContent='Tap again to remove';
        wipe.classList.remove('btn-ghost');
        wipe.classList.add('btn-danger');
        return;
      }
      var n=removeSampleData();
      var box=wipe.parentNode;
      box.innerHTML='<div class="tcs-t">Sample wedding removed ✦</div>'+
        '<div class="tcs-b">'+n+' records cleared. Your studio is empty and ready for your own events.</div>';
    };
    $('#tourSkip').onclick=function(){ endTour(false); };
    $('#tourNext').onclick=function(){ tourAt++; showTourStep(); };
    var b=$('#tourBack'); if(b)b.onclick=function(){ tourAt=Math.max(0,tourAt-1); showTourStep(); };
    $('#tourNext').focus();
  };
  if(step.view&&state.view!==step.view){ setView(step.view); setTimeout(go,180); }
  else go();
}
function startTour(key){
  tourKeyRunning=TOURS[key]?key:'basics';
  tourAt=0;
  var first=(TOURS[tourKeyRunning].steps[0]||{}).view||'dashboard';
  setView(first);
  setTimeout(showTourStep,140);
}

/* ---- getting-started checklist, driven by real data ---- */
function setupSteps(){
  var ev=db.events[0];
  return [
    {k:'lead', label:'Add your first enquiry', hint:'Leads & Pipeline → ＋ New Lead',
     done:db.leads.length>0, view:'pipeline'},
    {k:'event', label:'Create an event', hint:'Events → ＋ New Event',
     done:db.events.length>0, view:'events'},
    {k:'tasks', label:'Apply a task template', hint:'Open an event → Checklist → ✦ Apply template',
     done:db.events.some(function(e){return e.checklist.length>=8;}), view:'events'},
    {k:'guests', label:'Add or import your guest list', hint:'Guests & RSVP → ⇪ Import CSV',
     done:db.events.some(function(e){return e.guests.length>0;}), view:'guests'},
    {k:'floor', label:'Lay out the room', hint:'Seating Chart → drag tables into place',
     done:db.events.some(function(e){return e.tables.length>0&&(e.floor&&e.floor.items.length>0);}), view:'seating'},
    {k:'vendor', label:'Build your vendor directory', hint:'Vendors → ＋ Add Vendor',
     done:db.vendors.length>0, view:'vendors'},
    {k:'doc', label:'Send a contract or questionnaire', hint:'Contracts & Docs, or Questionnaires',
     done:db.documents.some(function(d){return d.status!=='draft';})||db.questionnaires.some(function(q){return q.status!=='draft';}),
     view:'documents'}
  ];
}
function setupCard(){
  if(localStorage.getItem('gem-setup-hidden')==='1')return '';
  var steps=setupSteps();
  var done=steps.filter(function(s){return s.done;}).length;
  if(done===steps.length)return '';
  /* Only what is still to do. Struck-through rows for work already finished
     pushed the first useful thing on the dashboard 610px down a phone screen —
     a studio six steps in was scrolling past its own history to reach today's
     tasks. The count and the bar still show the progress. */
  var todo=steps.filter(function(s){return !s.done;});
  var open=localStorage.getItem('gem-setup-open')==='1';
  var shown=open?todo:todo.slice(0,2);
  var rest=todo.length-shown.length;
  return '<div class="setup-card">'+
    '<div class="setup-h">'+
      '<div><div class="setup-k">Getting started</div>'+
        '<div class="setup-t">'+done+' of '+steps.length+' complete</div></div>'+
      '<div class="setup-r">'+
        '<button class="btn btn-ghost btn-sm" id="setupTour">Replay tour</button>'+
        '<button class="r-act" id="setupHide" aria-label="Dismiss">✕</button></div>'+
    '</div>'+
    '<div class="bar setup-bar"><i style="width:'+Math.round(done/steps.length*100)+'%"></i></div>'+
    '<div class="setup-list">'+shown.map(function(s){
      return '<button class="setup-row" data-setup="'+esc(s.view)+'">'+
        '<span class="setup-box"></span>'+
        '<span class="setup-l"><b>'+esc(s.label)+'</b><em>'+esc(s.hint)+'</em></span>'+
        '<span class="setup-go">›</span></button>';
    }).join('')+'</div>'+
    (rest>0||open
      ?'<button class="setup-more" id="setupMore">'+(open?'Show less':rest+' more to go')+'</button>'
      :'')+
  '</div>';
}
function wireSetupCard(){
  var t=$('#setupTour'); if(t)t.onclick=startTour;
  var h=$('#setupHide');
  if(h)h.onclick=function(){ try{localStorage.setItem('gem-setup-hidden','1');}catch(e){} render(); };
  var mo=$('#setupMore');
  if(mo)mo.onclick=function(){
    var open=localStorage.getItem('gem-setup-open')==='1';
    try{ localStorage.setItem('gem-setup-open',open?'0':'1'); }catch(e){}
    render();
  };
  document.querySelectorAll('[data-setup]').forEach(function(b){
    b.onclick=function(){ setView(b.dataset.setup); };
  });
}

/* ============================================================
 * Global search — one index across everything, ⌘K / Ctrl-K.
 * ============================================================ */
function searchIndex(){
  var out=[];
  db.leads.forEach(function(l){ out.push({kind:'Client',label:l.names,
    meta:[l.type,l.venue,l.email].filter(Boolean).join(' · '),
    hay:[l.names,l.type,l.venue,l.email,l.phone,l.partnerA,l.partnerB,l.source,l.notes,
         (l.address||{}).city].join(' '),
    go:function(){setView('clients',{clientId:l.id});}}); });
  db.events.forEach(function(e){ out.push({kind:'Event',label:e.title,
    meta:venueDot(e.venue,fmtDate(e.date)),
    hay:[e.title,e.venue,e.loc,(e.venueAddress||{}).city,(e.venueContact||{}).name].join(' '),
    go:function(){setView('events',{eventId:e.id});}}); });
  db.vendors.forEach(function(v){ var e=db.events.find(function(x){return x.id===v.eventId;});
    out.push({kind:'Vendor',label:v.name,meta:v.cat+(e?' · '+e.title:''),
    hay:[v.name,v.cat,v.contact,v.email,v.phone].join(' '),
    go:function(){setView('vendors');}}); });
  db.events.forEach(function(e){ e.guests.forEach(function(g){
    out.push({kind:'Guest',label:g.name,meta:(g.party||'')+' · '+e.title,
      hay:[g.name,g.party,g.meal,g.diet,g.email].join(' '),
      go:function(){state.activeEventId=e.id;setView('guests');}}); }); });
  db.documents.forEach(function(d){ var e=db.events.find(function(x){return x.id===d.eventId;});
    out.push({kind:'Document',label:d.title,meta:d.type+(e?' · '+e.title:''),
    hay:[d.title,d.type,d.status,d.signedName].join(' '),
    go:function(){setView('documents');}}); });
  db.invoices.forEach(function(i){ var cn=invoiceClientName(i);
    out.push({kind:'Invoice',label:i.num,meta:cn+' · '+money(i.amount),
    hay:[i.num,cn,i.status].join(' '),go:function(){setView('finance');}}); });
  db.questionnaires.forEach(function(q){ out.push({kind:'Questionnaire',label:q.title,meta:q.status,
    hay:[q.title,q.intro].join(' '),go:function(){setView('questionnaires',{qId:q.id});}}); });
  db.events.forEach(function(e){ (e.design&&e.design.boards||[]).forEach(function(b){
    out.push({kind:'Mood board',label:b.title,meta:e.title,hay:[b.title,b.note].join(' '),
      go:function(){state.activeEventId=e.id;setView('design',{boardId:b.id});}}); }); });
  db.events.forEach(function(e){ e.checklist.filter(function(c){return !c.done;}).forEach(function(c){
    out.push({kind:'Task',label:c.lbl,meta:e.title+(c.due?' · due '+fmtDate(c.due):''),
      hay:[c.lbl,c.cat].join(' '),go:function(){setView('events',{eventId:e.id});}}); }); });
  db.submissions.forEach(function(sm){ out.push({kind:'Inquiry',label:sm.names,meta:sm.type+' · '+sm.status,
    hay:[sm.names,sm.email,sm.message,sm.type].join(' '),go:function(){setView('inquiries');}}); });
  return out;
}
var _searchResults=[],_searchSel=0;
function openSearch(){
  md.className='modal modal-search';
  md.innerHTML='<div class="srch-bar"><span class="srch-ic">⌕</span>'+
      '<input id="srchInput" placeholder="Search clients, events, vendors, guests…" aria-label="Search" autocomplete="off">'+
      '<kbd class="srch-esc">esc</kbd></div>'+
    '<div class="srch-results" id="srchResults"></div>';
  ov.classList.add('show');
  var inp=$('#srchInput'), box=$('#srchResults');
  var index=searchIndex();
  function run(){
    var q=inp.value.trim().toLowerCase();
    if(!q){ _searchResults=[];
      box.innerHTML='<div class="srch-empty">Type to search across every client, event, vendor, guest, document and task.</div>';
      return; }
    var terms=q.split(/\s+/);
    _searchResults=index.filter(function(r){
      var h=(r.label+' '+r.meta+' '+r.hay).toLowerCase();
      return terms.every(function(t){return h.indexOf(t)>-1;});
    }).slice(0,40);
    _searchSel=0;
    if(!_searchResults.length){ box.innerHTML='<div class="srch-empty">Nothing matches “'+esc(inp.value.trim())+'”.</div>'; return; }
    box.innerHTML=_searchResults.map(function(r,i){
      return '<button class="srch-row'+(i===0?' sel':'')+'" data-i="'+i+'">'+
        '<span class="srch-kind">'+esc(r.kind)+'</span>'+
        '<span class="srch-label">'+esc(r.label)+'</span>'+
        '<span class="srch-meta">'+esc(r.meta)+'</span></button>';
    }).join('');
    box.querySelectorAll('.srch-row').forEach(function(b){
      b.onclick=function(){ pick(Number(b.dataset.i)); };
    });
  }
  function pick(i){ var r=_searchResults[i]; if(!r)return; closeModal(); r.go(); }
  function move(d){
    if(!_searchResults.length)return;
    _searchSel=(_searchSel+d+_searchResults.length)%_searchResults.length;
    box.querySelectorAll('.srch-row').forEach(function(b,i){ b.classList.toggle('sel',i===_searchSel); });
    var el=box.querySelector('.srch-row.sel'); if(el)el.scrollIntoView({block:'nearest'});
  }
  inp.oninput=run;
  inp.onkeydown=function(e){
    if(e.key==='ArrowDown'){e.preventDefault();move(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
    else if(e.key==='Enter'){e.preventDefault();pick(_searchSel);}
  };
  run();
  setTimeout(function(){inp.focus();},60);
}

/* ============================================================
 * Print / PDF — the sheets a planner actually hands out on site.
 * ============================================================ */
function printSheet(kind,ev){
  if(!ev){toast('Open an event first ✦');return;}
  var addr=addrLines(ev.venueAddress);
  var pf=prefs();
  var head='<div class="pr-head">'+
    (pf.logo?'<img class="pr-logo" src="'+pf.logo+'" alt="">':'')+
    '<div class="pr-brand">'+esc(pf.bizName)+'</div>'+
    '<h1>'+esc(ev.title)+'</h1>'+
    '<div class="pr-sub">'+esc(venueName(ev.venue))+(addr.length?' · '+esc(addr.join(', ')):'')+'</div>'+
    '<div class="pr-sub">'+fmtDate(ev.date)+(ev.startTime?' · '+esc(ev.startTime)+' start':'')+'</div></div>';
  var body='',title='';
  if(kind==='timeline'){
    title='Day-of Timeline';
    body='<table class="pr-t"><thead><tr><th style="width:110px">Time</th><th>Moment</th><th>Detail</th></tr></thead><tbody>'+
      ev.timeline.map(function(t){return '<tr><td><b>'+esc(t.t)+'</b></td><td>'+esc(t.ev)+'</td><td>'+esc(t.ds||'')+'</td></tr>';}).join('')+
      '</tbody></table>';
  } else if(kind==='weekend'){
    /* The sheet a coordinator actually carries: every event of the weekend in
       order, each with its venue and running order, on one piece of paper. */
    title='Weekend Running Order';
    var wk=evBlock(ev).slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;});
    body=wk.map(function(x){
      var xa=addrLines(x.venueAddress);
      return '<div class="pr-tbl"><h3>'+esc(roleLabel(x,true))+' — '+esc(x.title)+
        ' <span>'+fmtDate(x.date)+(x.startTime?' · '+esc(x.startTime):'')+'</span></h3>'+
        '<div class="pr-note">'+esc(venueName(x.venue))+(xa.length?' · '+esc(xa.join(', ')):'')+
          ' · '+rosterFor(x).filter(function(g){return gRsvp(g,x)==='yes';}).length+' attending</div>'+
        ((x.timeline||[]).length
          ?'<table class="pr-t"><thead><tr><th style="width:110px">Time</th><th>Moment</th><th>Detail</th></tr></thead><tbody>'+
            x.timeline.map(function(t){return '<tr><td><b>'+esc(t.t)+'</b></td><td>'+esc(t.ev)+'</td><td>'+esc(t.ds||'')+'</td></tr>';}).join('')+
            '</tbody></table>'
          :'<div class="pr-note">No running order yet.</div>')+
      '</div>';
    }).join('');
  } else if(kind==='guests'){
    title='Guest List';
    var pr=rosterFor(ev);
    var att=pr.filter(function(g){return gRsvp(g,ev)==='yes';});
    body='<div class="pr-note">'+att.length+' attending of '+pr.length+' invited · '+
      pr.filter(function(g){return g.diet;}).length+' with dietary needs</div>'+
      '<table class="pr-t"><thead><tr><th>Guest</th><th>Party</th><th>RSVP</th><th>Meal</th><th>Dietary</th><th>Table</th></tr></thead><tbody>'+
      pr.map(function(g){
        var tb=ev.tables.find(function(t){return t.id===gTable(g,ev);});
        return '<tr><td><b>'+esc(g.name)+'</b></td><td>'+esc(g.party||'')+'</td><td>'+esc((RSVP[gRsvp(g,ev)]||{}).lbl||'')+'</td>'+
          '<td>'+esc(gMeal(g,ev))+'</td><td>'+esc(g.diet||'')+'</td><td>'+esc(tb?tb.name:'')+'</td></tr>';
      }).join('')+'</tbody></table>';
  } else if(kind==='seating'){
    title='Seating Chart';
    body=ev.tables.map(function(t){
      var at=seatedAt(ev,t.id);
      return '<div class="pr-tbl"><h3>'+esc(t.name)+' <span>'+at.length+' of '+t.seats+'</span></h3>'+
        '<ol>'+at.map(function(g){return '<li>'+esc(g.name)+(g.diet?' <em>('+esc(g.diet)+')</em>':'')+'</li>';}).join('')+'</ol></div>';
    }).join('')||'<div class="pr-note">No tables yet.</div>';
  } else if(kind==='vendors'){
    title='Vendor Contact Sheet';
    var vs=db.vendors.filter(function(v){return v.eventId===ev.id;});
    body='<table class="pr-t"><thead><tr><th>Vendor</th><th>Category</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th></tr></thead><tbody>'+
      vs.map(function(v){return '<tr><td><b>'+esc(v.name)+'</b></td><td>'+esc(v.cat||'')+'</td><td>'+esc(v.contact||'')+'</td>'+
        '<td>'+esc(v.phone||'')+'</td><td>'+esc(v.email||'')+'</td><td>'+esc((VSTATUS[v.status]||{}).lbl||'')+'</td></tr>';}).join('')+
      '</tbody></table>'+
      (ev.venueContact&&ev.venueContact.name?'<div class="pr-note"><b>Venue:</b> '+esc(ev.venueContact.name)+
        ' · '+esc(ev.venueContact.phone||'')+' · '+esc(ev.venueContact.email||'')+'</div>':'')+
      (ev.venueNotes?'<div class="pr-note"><b>Site notes:</b> '+esc(ev.venueNotes)+'</div>':'');
  } else if(kind==='floorplan'){
    title='Floor Plan';
    var f=ev.floor, sc=680/f.w;                       // scale the room onto the page
    body='<div class="pr-note">Room '+f.w+' × '+f.h+' '+esc(f.unit)+
      ' · '+ev.tables.length+' tables · '+rosterFor(ev).filter(function(g){return gRsvp(g,ev)==='yes'&&gTable(g,ev);}).length+' seated</div>'+
      '<div class="pr-floor" style="width:'+Math.round(f.w*sc)+'px;height:'+Math.round(f.h*sc)+'px">'+
      f.items.map(function(i){
        return '<div class="pr-fx" style="left:'+((i.x-i.w/2)*sc)+'px;top:'+((i.y-i.h/2)*sc)+'px;'+
          'width:'+(i.w*sc)+'px;height:'+(i.h*sc)+'px;transform:rotate('+(i.rot||0)+'deg)">'+
          esc(i.label||(FIXTURES[i.kind]||{}).label||'')+'</div>';
      }).join('')+
      ev.tables.map(function(t){
        var at=seatedAt(ev,t.id);
        return '<div class="pr-tb" style="left:'+((t.x-t.w/2)*sc)+'px;top:'+((t.y-t.h/2)*sc)+'px;'+
          'width:'+(t.w*sc)+'px;height:'+(t.h*sc)+'px;transform:rotate('+(t.rot||0)+'deg);'+
          'border-radius:'+(t.shape==='round'?'50%':t.shape==='oval'?'50%/40%':'5px')+'">'+
          '<b>'+esc(t.name)+'</b><span>'+at.length+'/'+t.seats+'</span></div>';
      }).join('')+'</div>'+
      ev.tables.map(function(t){
        var at=seatedAt(ev,t.id);
        if(!at.length)return '';
        return '<div class="pr-tbl"><h3>'+esc(t.name)+' <span>'+at.length+' of '+t.seats+'</span></h3>'+
          '<ol>'+at.map(function(g){return '<li>'+esc(g.name)+(g.diet?' <em>('+esc(g.diet)+')</em>':'')+'</li>';}).join('')+'</ol></div>';
      }).join('');
  } else if(kind==='checklist'){
    title='Task Checklist';
    body='<table class="pr-t"><thead><tr><th style="width:26px"></th><th>Task</th><th>Category</th><th style="width:120px">Due</th></tr></thead><tbody>'+
      ev.checklist.map(function(c){return '<tr><td>'+(c.done?'☑':'☐')+'</td><td'+(c.done?' class="pr-done"':'')+'>'+esc(c.lbl)+'</td>'+
        '<td>'+esc(c.cat||'')+'</td><td>'+(c.due?fmtDate(c.due):'')+'</td></tr>';}).join('')+'</tbody></table>';
  }
  var w=document.getElementById('printFrame');
  if(!w){ w=document.createElement('iframe'); w.id='printFrame';
    w.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(w); }
  var doc=w.contentDocument;
  doc.open();

/* Saved countdowns join the built-ins wherever templates are offered. */
function refreshTemplates(){
  Object.keys(TASK_TEMPLATES).forEach(function(k){
    if(TASK_TEMPLATES[k].custom)delete TASK_TEMPLATES[k];
  });
  (prefs().taskTemplates||[]).forEach(function(t){
    TASK_TEMPLATES[t.id]={name:t.name,mins:Math.max(1,Math.round(t.items.length/12)),
                          type:t.type||'',items:t.items,custom:true};
  });
  return TASK_TEMPLATES;
}
function isoMinusDays(iso,days){
  var d=new Date(iso+'T00:00');
  if(isNaN(d))return null;
  d.setDate(d.getDate()-days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function openTemplateModal(ev){
  if(!ev){toast('Open an event first ✦');return;}
  refreshTemplates();
  var keys=Object.keys(TASK_TEMPLATES);
  var suggested=keys.find(function(k){return TASK_TEMPLATES[k].type===(db.leads.find(function(l){return l.id===ev.leadId;})||{}).type;})||'wedding12';
  md.className='modal';
  md.innerHTML='<h3>Apply a Task Template</h3>'+
    '<p class="sub">Due dates are calculated backwards from '+fmtDate(ev.date)+'. Existing tasks are kept.</p>'+
    '<div class="field"><label>Template</label><select id="tpl_pick">'+
      keys.map(function(k){return '<option value="'+k+'"'+(k===suggested?' selected':'')+'>'+esc(TASK_TEMPLATES[k].name)+' ('+TASK_TEMPLATES[k].items.length+' tasks)</option>';}).join('')+
    '</select></div>'+
    '<div class="field"><label><input type="checkbox" id="tpl_skip" checked style="width:auto;margin-right:8px">Skip tasks whose date has already passed</label></div>'+
    '<div class="tpl-preview" id="tplPreview"></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost" id="tplSave">Save this checklist</button>'+
      '<span style="flex:1"></span>'+
      '<button class="btn btn-ghost" id="mCancel">Cancel</button>'+
      '<button class="btn btn-gold" id="mSave">Add tasks</button></div>';
  ov.classList.add('show');
  function preview(){
    var t=TASK_TEMPLATES[$('#tpl_pick').value];
    var skip=$('#tpl_skip').checked;
    var rows=t.items.map(function(i){
      var due=isoMinusDays(ev.date,i.d);
      var past=due&&daysAway(due)<0;
      if(skip&&past)return null;
      return '<div class="tpl-row"><span class="tpl-d">'+(due?fmtDate(due):'—')+'</span>'+
        '<span class="tpl-t">'+esc(i.t)+'</span><span class="pill">'+esc(i.c)+'</span></div>';
    }).filter(Boolean);
    $('#tplPreview').innerHTML='<div class="tpl-count">'+rows.length+' task'+(rows.length===1?'':'s')+' will be added</div>'+rows.join('');
  }
  $('#tpl_pick').onchange=preview; $('#tpl_skip').onchange=preview; preview();
  var sv=$('#tplSave');
  if(sv)sv.onclick=function(){
    var open=ev.checklist.filter(function(c){return c.due;});
    if(!open.length){ toast('Give the tasks due dates first — templates work from them.'); return; }
    openEditor({title:'Save this checklist',sub:'Offsets are worked out from '+fmtDate(ev.date)+'.',
      saveLabel:'Save template',
      fields:[{id:'name',label:'Template name',required:true,value:(db.leads.find(function(l){return l.id===ev.leadId;})||{}).type||'My countdown'}],
      onSave:function(v){
        var items=open.map(function(c){
          return {d:Math.round((new Date(ev.date+'T00:00')-new Date(c.due+'T00:00'))/86400000),
                  c:c.cat||'General', t:c.lbl};
        }).sort(function(a2,b2){return b2.d-a2.d;});
        var pr=prefs();
        var id='cust'+uid('');
        pr.taskTemplates.push({id:id,name:v.name,items:items});
        savePrefs(); refreshTemplates();
        closeModal(); closeModal();
        toast('“'+v.name+'” saved with '+items.length+' tasks ✦');
      }});
  };
  $('#mCancel').onclick=closeModal;
  $('#mSave').onclick=function(){
    var t=TASK_TEMPLATES[$('#tpl_pick').value], skip=$('#tpl_skip').checked, n=0;
    t.items.forEach(function(i){
      var due=isoMinusDays(ev.date,i.d);
      if(skip&&due&&daysAway(due)<0)return;
      ev.checklist.push({id:uid('ck'),lbl:i.t,cat:i.c,done:false,due:due});
      n++;
    });
    ev.checklist.sort(function(a,b){return (a.due||'9999')<(b.due||'9999')?-1:1;});
    closeModal(); afterChange(); toast(n+' tasks added ✦');
  };
}

/* ---- event create / edit ---- */
function openEventModal(existing,parentId){
  var e=existing||null;
  var a=(e&&e.venueAddress)||{};
  var vc=(e&&e.venueContact)||{};
  /* Two ways in: "+ Sub-event" passes the primary's id, and editing an event
     that already has one reads it off the record. */
  var parent=evById(parentId)||(e?evById(e.parentId):null)||null;
  var isSub=!!parent;
  var bookable=db.leads.filter(function(l){return ['booked','planning','wrapped'].indexOf(l.stage)>-1;});
  /* "＋ Add a new client" writes into the name field below rather than opening
     a second modal on top of this one. */
  var opts=[{value:'',label:'No linked client'},{value:'__new',label:'＋ Add a new client…'}].concat(
    (e?db.leads:bookable.length?bookable:db.leads).map(function(l){return {value:l.id,label:l.names+' · '+l.type};}));
  /* A sub-event's type follows its parent — the roles on offer have to match
     the block it is joining, not whatever this form last had selected. */
  var typeOf=parent?evType(parent):(e?evType(e):((leadById((e&&e.leadId))||{}).type||'Wedding'));
  var roleOpts=rolesForType(typeOf).map(function(r){return {value:r.id,label:r.label};});
  /* Sub-events are one level deep, so only events that are not already part of
     a block, and have no block of their own, may be attached to one. An event
     cannot be offered itself. */
  var attachOpts=[{value:'',label:'Standalone event'}].concat(
    db.events.filter(function(x){
      if(e&&x.id===e.id)return false;
      if(evIsSub(x))return false;
      return true;
    }).map(function(x){return {value:x.id,label:x.title+' · '+fmtDate(x.date)};}));
  var canAttach=!e||(!evChildren(e.id).length);
  /* Offer the first role the weekend has not used yet, so adding all four in a
     row needs no fiddling with the select. */
  var used=parent?evChildren(parent.id).map(function(x){return evRole(x);}):[];
  var free=roleOpts.filter(function(r){return used.indexOf(r.value)<0&&r.value!=='other';})[0];
  var defRole=evRole(e)!=='primary'?evRole(e):(free?free.value:'other');
  openEditor({
    title:e?'Edit Event':(isSub?'New Sub-event':'New Event'),
    sub:e?e.title:(isSub?'Part of '+parent.title:'Events are usually created from a booked lead.'),
    twoCol:true,
    saveLabel:e?'Save changes':(isSub?'Add sub-event':'Create event'),
    /* Changing the event type changes which occasions exist. Rebuilt in place
       so a Corporate event never offers a rehearsal dinner, even when the type
       is switched after the form is already open. */
    onFieldChange:function(v,root){
      var sel=root.querySelector('#ed_role'); if(!sel)return;
      var want=rolesForType(v.eventType||typeOf);
      var ids=want.map(function(r){return r.id;}).join(',');
      if(sel.dataset.roleset===ids)return;
      sel.dataset.roleset=ids;
      var keep=sel.value;
      sel.innerHTML=want.map(function(r){
        return '<option value="'+r.id+'"'+(r.id===keep?' selected':'')+'>'+esc(r.label)+'</option>';
      }).join('');
      if(sel.value!==keep)sel.value=(want[0]||{}).id||'other';
    },
    onDelete:e?function(){ closeModal(); deleteRecord('event',e.id); }:null,
    deleteLabel:e&&e.title,
    fields:[
      {id:'title',label:'Event name',value:e&&e.title,required:true,full:true,
       placeholder:isSub?'Rehearsal Dinner':''},
      {id:'leadId',label:'Client',type:'select',value:(e&&e.leadId)||(parent&&parent.leadId),options:opts,full:true},
      /* Present rather than revealed: openEditor builds its fields once, and a
         field that appears mid-edit loses whatever was typed in it. */
      {id:'newClient',label:'New client’s name',value:'',placeholder:'e.g. Okafor & Bello',
       full:true,required:true,showIf:function(v){ return v.leadId==='__new'; }},
      /* A sub-event inherits the block's type, so it is only asked for on a
         standalone or primary event. */
      (isSub?null:{id:'eventType',label:'Event type',type:'select',
        value:typeOf,options:EVENT_TYPES.map(function(t){return {value:t.id,label:t.id};}),full:true,
        /* A sub-event takes its block's type; asking again could contradict it. */
        showIf:function(v){ return !v.parentId; }}),
      /* The parent picker is hidden once an event has sub-events of its own —
         the database holds the tree one level deep and the UI should not offer
         a move it will refuse. */
      (canAttach?{id:'parentId',label:'Part of',type:'select',
        value:(e&&e.parentId)||(parent&&parent.id)||'',options:attachOpts,full:true,
        /* A client created on this form has no events yet, so there is nothing
           for this one to be part of. */
        showIf:function(v){ return v.leadId!=='__new'; }}:null),
      (canAttach?{id:'role',label:'Which event is it',type:'select',
        value:defRole,options:roleOpts,full:true,
        /* Only a sub-event has a role. A standalone event is its own primary,
           and asking which wedding occasion it is made no sense at all. */
        showIf:function(v){ return !!v.parentId&&v.parentId!=='__new'; }}:null),
      /* Only meaningful for the Custom… role, but always present: openEditor

/* ---- where each record kind lives, so edit/delete stay generic ---- */
function evById(id){ return db.events.find(function(e){return e.id===id;}); }

/* ---- the wedding weekend ----
   A wedding is realistically four events — welcome party, rehearsal dinner,
   ceremony and reception, farewell brunch — sharing one couple, one contract
   and one guest list. They hang off a primary event rather than sitting flat,
   so the dashboard counts down to the wedding rather than to four competing
   dates, and the client file shows the weekend as a single block.

   Records saved before this existed have no parentId and no role. Both are
   read defensively throughout: absent means "a primary, standing alone". */
/* ---- what kind of event is this ----
   GEM was shaped entirely around weddings: a corporate gala was offered a
   rehearsal dinner and a farewell brunch, and its tasks were assigned to "the
   couple". The type decides which sub-events are on the menu and what the
   client is called. `roles` lists the sub-event roles worth offering; every
   type also gets tasting, walkthrough, photos, setup, custom and other.

   `client` is the term used wherever the app talks about the person paying —
   the task tab, the portal, the assign button. */
var EVENT_TYPES=[
  {id:'Wedding',    client:'the couple', roles:['welcome','rehearsal','ceremony','reception','brunch','fitting','shower','party','afterparty']},
  {id:'Corporate',  client:'the client', roles:['reception','dinner','session','keynote','breakout','networking','afterparty']},
  {id:'Conference', client:'the client', roles:['session','keynote','breakout','networking','dinner','reception']},
  {id:'Gala',       client:'the client', roles:['reception','dinner','ceremony','afterparty']},
  {id:'Birthday',   client:'the host',   roles:['party','dinner','afterparty']},
  {id:'Anniversary',client:'the couple', roles:['party','dinner','ceremony','afterparty']},
  {id:'Shower',     client:'the host',   roles:['shower','party','dinner']},
  {id:'Graduation', client:'the family', roles:['ceremony','party','dinner']},
  {id:'Holiday',    client:'the client', roles:['party','dinner','reception','afterparty']},
  {id:'Memorial',   client:'the family', roles:['ceremony','reception','dinner']},
  {id:'Other',      client:'the client', roles:['ceremony','reception','party','dinner','session','afterparty']}
];
/* Offered whatever the type, because every event has a room to look at and
   suppliers to taste. */
var EV_ROLES_UNIVERSAL=['tasting','walkthrough','photos','setup','custom','other'];
/* A stable colour per event, so a list mixing several jobs separates without
   needing a heading. Chosen from a fixed set rather than generated from a hue
   wheel: random hues collide with the gold and pink the rest of the app uses,
   and these are picked to sit at similar weight and stay legible on the card.
   Derived from the id, so an event keeps its colour across every screen and
   every device. */
/* One per hue family, walked round the wheel so neighbouring events never look
   alike. Every one measured at 4.6:1 or better against the card — the first
   pass had three below 4.5, and this is 11px text. */
var EVENT_TINTS=['#8D6E27','#627C54','#2F7D7A','#597990','#6A6FA0','#96607F','#9A5C5C','#A5633A'];
/* Assigned by position, not by hashing the id. A hash collides — with four
   events and eight colours the first attempt handed out two greens and two
   duplicates — and the whole point is that two jobs never share a colour.
   Sorting by id keeps it stable across renders and devices; it only shifts
   when the set of events changes, which is the acceptable trade. */
function eventTint(id){
  var ids=db.events.map(function(e){return e.id;}).sort();
  var i=ids.indexOf(id);
  return EVENT_TINTS[(i<0?0:i)%EVENT_TINTS.length];
}
function eventTypeDef(t){
  return EVENT_TYPES.find(function(x){return x.id===t;})||
         EVENT_TYPES[EVENT_TYPES.length-1];
}
/* The event's own type, falling back to its client's for anything created
   before events carried one. */
function evType(e){
  if(!e)return 'Wedding';
  if(e.eventType)return e.eventType;
  var p=e.parentId?db.events.find(function(x){return x.id===e.parentId;}):null;
  if(p&&p.eventType)return p.eventType;
  var l=e.leadId?db.leads.find(function(x){return x.id===e.leadId;}):null;
  return (l&&l.type)||'Wedding';
}
/* "the couple" for a wedding, "the client" for a gala, "the host" for a
   birthday. Used anywhere the app addresses whoever is paying. */
function clientTerm(e,cap){
  var t=eventTypeDef(evType(evPrimary(e)||e)).client;
  return cap?t.charAt(0).toUpperCase()+t.slice(1):t;
}
/* The roles worth offering for this event's type. */
function rolesForType(t){
  var want=eventTypeDef(t).roles.concat(EV_ROLES_UNIVERSAL);
  return EV_ROLES.filter(function(r){ return r.id!=='primary'&&want.indexOf(r.id)>=0; })
    .sort(function(a,b){ return want.indexOf(a.id)-want.indexOf(b.id); });
}

/* The occasions a planner actually schedules as their own date and venue.
   Kept in step with the check constraint in migration 15 — a role that is not
   in that list is refused on push and the event silently fails to sync. */
var EV_ROLES=[
  {id:'primary',    label:'Main event',        short:'Main'},
  {id:'welcome',    label:'Welcome party',     short:'Welcome'},
  {id:'rehearsal',  label:'Rehearsal',         short:'Rehearsal'},
  {id:'ceremony',   label:'Ceremony',          short:'Ceremony'},
  {id:'reception',  label:'Reception',         short:'Reception'},
  {id:'brunch',     label:'Farewell brunch',   short:'Brunch'},
  {id:'dinner',     label:'Dinner',            short:'Dinner'},
  {id:'party',      label:'Party',             short:'Party'},
  {id:'afterparty', label:'Afterparty',        short:'After'},
  {id:'session',    label:'Session',           short:'Session'},
  {id:'keynote',    label:'Keynote',           short:'Keynote'},
  {id:'breakout',   label:'Breakout',          short:'Breakout'},
  {id:'networking', label:'Networking',        short:'Networking'},
  {id:'shower',     label:'Shower',            short:'Shower'},
  {id:'fitting',    label:'Fitting',           short:'Fitting'},
  {id:'tasting',    label:'Menu tasting',      short:'Tasting'},
  {id:'walkthrough',label:'Venue walkthrough', short:'Walkthrough'},
  {id:'photos',     label:'Photo session',     short:'Photos'},
  {id:'setup',      label:'Setup / load-in',   short:'Setup'},
  {id:'custom',     label:'Custom…',           short:'Custom'},
  {id:'other',      label:'Other',             short:'Other'}
];
function roleDef(id){
  return EV_ROLES.find(function(x){return x.id===id;})||
         EV_ROLES[EV_ROLES.length-1];
}
function evRole(e){ return (e&&e.parentId&&e.role)?e.role:(e&&e.parentId?'other':'primary'); }
function roleLabel(e,short){
  var r=evRole(e);
  /* A studio-named occasion wins over the preset list. Trimmed and capped so a
     stray paragraph cannot blow out the switcher chips. */
  if(r==='custom'){
    var t=(e&&e.roleLabel||'').trim();
    if(t)return short?t.slice(0,14):t.slice(0,40);
    return short?'Custom':'Custom event';
  }
  var m=roleDef(r);
  return short?m.short:m.label;
}
function evIsSub(e){ return !!(e&&e.parentId&&evById(e.parentId)); }
/* Sub-events in the order the weekend runs: explicit order first, then date. */
function evChildren(id){
  return db.events.filter(function(e){return e.parentId===id;}).sort(function(a,b){
    if((a.sort||0)!==(b.sort||0))return (a.sort||0)-(b.sort||0);
    return (a.date||'')<(b.date||'')?-1:1;
  });
}
/* A dangling parentId — the primary deleted on another device before this one
   pulled — must not make the event vanish, so it falls back to itself. */
function evPrimary(e){ return (e&&e.parentId&&evById(e.parentId))||e||null; }
function evBlock(e){ var p=evPrimary(e); return p?[p].concat(evChildren(p.id)):[]; }
function evPrimaries(){ return db.events.filter(function(e){return !evIsSub(e);}); }
/* ---- invitations ----
   A guest belongs to the PRIMARY event, and the guest row's own rsvp / tableId
   / meal describe that event. An invitation to a sub-event is a separate
   record carrying its own rsvp, its own seat and its own meal: Aunt Marjorie
   comes to the ceremony but not the rehearsal dinner, and if she comes to both
   she may well sit at a different table at each.

   db.invites is a flat join list, the same shape as db.bookings. Nesting it
   under the guest would mean rewriting map keys in sbMigrateIds(), which is
   exactly where the last two id bugs came from. */
function inviteOf(gid,eid){
  return (db.invites||[]).find(function(i){return i.guestId===gid&&i.eventId===eid;})||null;
}
/* Everyone this event actually seats and counts. A primary counts its whole
   list; a sub-event counts only those with an invitation. */
function rosterFor(ev){
  if(!ev)return [];
  var p=evPrimary(ev),all=(p&&p.guests)||[];
  return evIsSub(ev)?all.filter(function(g){return !!inviteOf(g.id,ev.id);}):all;
}
/* One accessor pair, so no screen has to remember where the answer lives. */
function gAttr(g,ev,k){
  if(!evIsSub(ev))return g[k];
  var i=inviteOf(g.id,ev.id); return i?i[k]:null;
}
function gRsvp(g,ev){ return gAttr(g,ev,'rsvp')||'invited'; }
function gTable(g,ev){ return gAttr(g,ev,'tableId')||null; }
function gMeal(g,ev){ return gAttr(g,ev,'meal')||''; }
function gSet(g,ev,k,v){
  if(!evIsSub(ev)){ g[k]=v; return; }
  var i=inviteOf(g.id,ev.id);
  if(!i){ i=newInvite(g,ev); }
  i[k]=v;
}
function newInvite(g,ev){
  var i={id:uid('gi'),guestId:g.id,eventId:ev.id,rsvp:'invited',tableId:null,meal:''};
  db.invites=db.invites||[]; db.invites.push(i);
  return i;
}
/* Un-inviting drops the seat and the RSVP with it — keeping them would seat a
   guest at an event they are not coming to. */
function setInvited(g,ev,on){
  if(!evIsSub(ev))return;
  var i=inviteOf(g.id,ev.id);
  if(on&&!i)newInvite(g,ev);
  else if(!on&&i)db.invites=db.invites.filter(function(x){return x!==i;});

function invitedCount(ev){ return (db.invites||[]).filter(function(i){return i.eventId===ev.id;}).length; }

/* Planning progress across the whole block. "How far along is the Whitfield
   job" never means the ceremony alone. */
function evPct(e){
  var done=0,tot=0;
  evBlock(e).forEach(function(x){
    done+=x.checklist.filter(function(c){return c.done;}).length; tot+=x.checklist.length;
  });
  return tot?Math.round(done/tot*100):0;
}
function recordCtx(kind,id){
  var ev=state.eventId?evById(state.eventId):activeEvent();
  var maps={
    lead:{list:db.leads,label:'lead'},
    vendor:{list:db.vendors,label:'vendor'},
    invoice:{list:db.invoices,label:'invoice'},
    document:{list:db.documents,label:'document'},
    questionnaire:{list:db.questionnaires,label:'questionnaire'},
    event:{list:db.events,label:'event'},
    submission:{list:db.submissions,label:'inquiry'},
    booking:{list:db.bookings,label:'booking'},
    guest:{list:ev&&ev.guests,label:'guest',ev:ev},
    table:{list:ev&&ev.tables,label:'table',ev:ev},
    timeline:{list:ev&&ev.timeline,label:'timeline item',ev:ev},
    checklist:{list:ev&&ev.checklist,label:'task',ev:ev},
    budget:{list:ev&&ev.budget,label:'budget line',ev:ev},
    decor:{list:ev&&ev.design&&ev.design.decor,label:'décor item',ev:ev}
  };
  var m=maps[kind]; if(!m||!m.list)return null;
  m.item=m.list.find(function(x){return x.id===id;});
  m.kind=kind;
  return m;

function afterChange(){ save(); render(); }
function deleteRecord(kind,id){
  var c=recordCtx(kind,id); if(!c||!c.item)return;
  var name=c.item.names||c.item.name||c.item.title||c.item.lbl||c.item.ev||c.item.cat||c.item.num||c.label;
  confirmDelete(name,function(){
    var i=c.list.indexOf(c.item);
    if(i>-1)c.list.splice(i,1);
    // cascade: an event's records and a table's seating must not dangle
    if(kind==='event'){
      db.vendors.forEach(function(v){ if(v.eventId===id)v.eventId=null; });
      db.documents=db.documents.filter(function(d){return d.eventId!==id;});
      db.questionnaires=db.questionnaires.filter(function(q){return q.eventId!==id;});
      db.messages=db.messages.filter(function(m){return m.eventId!==id;});
      db.invites=(db.invites||[]).filter(function(i){return i.eventId!==id;});
      /* Deleting a primary promotes its sub-events rather than destroying
         them. The database cascades, so the push nulls the parent first — see
         the events payload in sbPush. */
      db.events.forEach(function(x){ if(x.parentId===id){ x.parentId=null; x.role='primary'; x.sort=0; } });
      if(state.activeEventId===id)state.activeEventId=(db.events[0]||{}).id;
      if(state.eventId===id)state.eventId=null;
    }
    /* A deleted table must not leave anyone seated at it — on the guest row
       for the primary, and on any invitation that used it. */
    if(kind==='table'&&c.ev){
      c.ev.guests.forEach(function(g){ if(g.tableId===id)g.tableId=null; });
      (db.invites||[]).forEach(function(i){ if(i.tableId===id)i.tableId=null; });
    }
    /* Invitations are owned jointly by a guest and an event; losing either one
       orphans them, and a push would then fail the foreign key. */
    if(kind==='guest'){ db.invites=(db.invites||[]).filter(function(i){return i.guestId!==id;}); }
    if(kind==='vendor'){ db.bookings=db.bookings.filter(function(b){return b.vendorId!==id;}); }
    if(kind==='event'){ db.bookings=db.bookings.filter(function(b){return b.eventId!==id;}); }
    if(kind==='lead'){ db.events.forEach(function(e){ if(e.leadId===id)e.leadId=null; });
      if(state.clientId===id)state.clientId=null; }
    if(kind==='questionnaire'&&state.qId===id)state.qId=null;
    afterChange();
    toast('Deleted');
  });
}

function toMinutes(t){
  var m=/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(t||'').trim());
  if(!m)return 1e9;
  var h=Number(m[1])%12, mi=Number(m[2]);
  if(m[3]&&/pm/i.test(m[3]))h+=12;
  return h*60+mi;
}

/* ============================================================
 * CSV guest import — nobody types a 200-person list by hand.
 * ============================================================ */
function parseCsv(text){
  var rows=[],row=[],cur='',q=false;
  text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);cur='';rows.push(row);row=[];}
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!=='';});});
}
var IMPORT_FIELDS=[
  {k:'name',label:'Full name',aliases:['name','guest','full name','guest name','attendee']},
  {k:'party',label:'Party / group',aliases:['party','group','household','family','table group']},
  {k:'rsvp',label:'RSVP',aliases:['rsvp','status','attending','response']},
  {k:'meal',label:'Meal',aliases:['meal','entree','entrée','food','menu']},
  {k:'diet',label:'Dietary',aliases:['diet','dietary','allergy','allergies','restrictions']},
  {k:'email',label:'Email',aliases:['email','e-mail','mail']}
];
function guessColumn(header){
  var h=String(header||'').trim().toLowerCase();
  var f=IMPORT_FIELDS.find(function(f){return f.aliases.indexOf(h)>-1;});
  return f?f.k:'';
}
function normaliseRsvp(v){
  var s=String(v||'').trim().toLowerCase();
  if(!s)return 'invited';
  if(/^(y|yes|attending|accept|accepted|coming|true|1)/.test(s))return 'yes';
  if(/^(n|no|decline|declined|not|regret|false|0)/.test(s))return 'no';
  if(/pend|await|maybe|tentative/.test(s))return 'pending';
  return 'invited';
}
