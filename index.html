/* --- Events --- */
function viewEvents(){
  /* Only primaries get a card. Their sub-events ride inside it, so a weekend
     reads as one job rather than four unrelated ones competing for the eye. */
  return '<div class="ev-cards">'+evPrimaries().map(function(e){
    var kids=evChildren(e.id),pct=evPct(e);
    /* Row actions live in the banner, not beside the title. Inline, a long
       client name wrapped around them and the card grew a second row — the
       grid then sat at two different heights depending on the name. */
    return '<div class="ev-card'+(isSampleEvent(e)?' is-sample':'')+'" data-ev="'+e.id+'"><div class="banner">'+rowActions('event',e.id)+
      (isSampleEvent(e)?'<span class="samp-tag card">Sample</span>':'')+
      '<span class="d">'+daysAway(e.date)+' days · '+fmtDate(e.date)+'</span>'+
      (kids.length?'<span class="ev-blk">'+(kids.length+1)+' events</span>':'')+'</div>'+
      '<div class="body"><h4>'+esc(e.title)+'</h4>'+
      '<div class="loc"><span class="ev-type">'+esc(evType(e))+'</span> · '+esc(venueDot(e.venue,e.loc))+'</div>'+
      (kids.length?'<div class="ev-subs">'+kids.map(function(k){
        return '<button class="ev-sub" type="button" data-ev="'+k.id+'">'+
          '<span class="es-r">'+esc(roleLabel(k,true))+'</span>'+
          '<span class="es-t">'+esc(k.title)+'</span>'+
          '<span class="es-d">'+fmtDate(k.date)+'</span></button>';
      }).join('')+'</div>':'')+
      '<div class="prog"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px"><span>Planning progress</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div></div></div>';
  }).join('')+'</div>';
}
function wireEvents(){
  document.querySelectorAll('[data-evtoggle]').forEach(function(btn){
    btn.onclick=function(ev){
      ev.stopPropagation();
      var sec=btn.closest('.ev-sec');
      var next=!sec.classList.contains('collapsed');
      sec.classList.toggle('collapsed',next);
      btn.setAttribute('aria-expanded',String(!next));
      evCollapsed[btn.dataset.evtoggle]=next; saveEvSections();
    };
  });
  var ev=state.eventId?evById(state.eventId):null;
  if(ev)wireCustomFields(ev);
  var add=function(sel,fn){ var b=document.querySelector(sel); if(b)b.onclick=function(e){e.stopPropagation();fn();}; };
  add('[data-addtl]',function(){
    openEditor({title:'Add Moment',sub:ev&&ev.title,saveLabel:'Add',
      fields:[{id:'t',label:'Time',required:true,placeholder:'4:30 PM',fmt:'time'},
              {id:'ev',label:'What happens',required:true,placeholder:'Ceremony'},
              {id:'ds',label:'Detail',placeholder:'Conservatory hall'}],
      onSave:function(v){ ev.timeline.push({id:uid('tl'),t:v.t,ev:v.ev,ds:v.ds});
        sortTimeline(ev); closeModal(); afterChange(); }});
  });
  add('[data-addck]',function(){
    openEditor({title:'Add Task',sub:ev&&ev.title,twoCol:true,saveLabel:'Add',
      fields:[{id:'lbl',label:'Task',required:true,full:true},
              {id:'cat',label:'Category',type:'select',
               options:['Logistics','Design','Catering','Music','Finance','Attire','Stationery','General']},
              {id:'due',label:'Due date',type:'date'}],
      onSave:function(v){ ev.checklist.push({id:uid('ck'),lbl:v.lbl,cat:v.cat,due:v.due||null,done:false,
        owner:state.chkTab==='client'?'client':'planner',note:''});
        closeModal(); afterChange(); }});
  });
  add('[data-addbl]',function(){
    openEditor({title:'Add Budget Line',sub:ev&&ev.title,twoCol:true,saveLabel:'Add',
      fields:[{id:'cat',label:'Category',required:true,full:true},
              {id:'est',label:'Estimated',type:'number'},
              {id:'act',label:'Committed',type:'number'}],
      onSave:function(v){ ev.budget.push({id:uid('bl'),cat:v.cat,est:v.est,act:v.act});
        closeModal(); afterChange(); }});
  });
  add('[data-addguest]',function(){ openGuestModal(ev); });
  add('[data-openguests]',function(){ state.activeEventId=(ev||{}).id; setView('guests'); });
  add('[data-template]',function(){ openTemplateModal(ev); });
  /* The vendor team is editable on the event workspace now, so its controls
     need wiring here as well as on the client file. */
  document.querySelectorAll('[data-addbooking]').forEach(function(b){
    b.onclick=function(e2){ e2.stopPropagation(); openBookingModal(b.dataset.addbooking,null); };
  });
  document.querySelectorAll('.bstat-sel').forEach(function(sel){
    sel.onchange=function(){
      var bk=db.bookings.find(function(x){return x.id===sel.dataset.bid;});
      if(bk){ bk.status=sel.value; afterChange(); }
    };
  });
  document.querySelectorAll('.ev-card').forEach(function(c){c.onclick=function(){setView('events',{eventId:c.dataset.ev});};});
  /* Sub-event chips sit inside the primary's card, so they must claim the
     click before it bubbles up and opens the primary instead. */
  document.querySelectorAll('.ev-sub,.wknd-bar [data-ev]').forEach(function(s){
    s.onclick=function(e){ e.stopPropagation(); setView('events',{eventId:s.dataset.ev}); };
  });
  var addSub=document.querySelector('[data-addsub]');
  if(addSub)addSub.onclick=function(e){ e.stopPropagation(); openEventModal(null,addSub.dataset.addsub); };
  var b=$('#evBack'); if(b)b.onclick=function(){setView('events',{eventId:null});};
  /* The box ticks the task; the rest of the row opens it. Two targets in one
     row, so neither action can be reached only by accident. */
  var findTask=function(id){
    var ev2=db.events.find(function(x){return x.id===state.eventId;});
    return {ev:ev2,item:ev2&&ev2.checklist.find(function(c){return c.id===id;})};
  };
  document.querySelectorAll('[data-tick]').forEach(function(bx){
    bx.onclick=function(e2){
      e2.stopPropagation();
      var t=findTask(bx.dataset.tick); if(!t.item)return;
      t.item.done=!t.item.done; save(); render(); wireEvents();
    };
  });
  document.querySelectorAll('.check[data-cid]').forEach(function(ch){
    ch.onclick=function(e2){
      if(e2.target.closest('[data-tick],.r-act,select,textarea'))return;
      state.chkOpen=state.chkOpen===ch.dataset.cid?null:ch.dataset.cid;
      render(); wireEvents();
    };
  });
  document.querySelectorAll('[data-chktab]').forEach(function(b){
    b.onclick=function(e2){ e2.stopPropagation();
      state.chkTab=b.dataset.chktab; state.chkOpen=null; render(); wireEvents(); };
  });
  document.querySelectorAll('[data-assign]').forEach(function(b){
    b.onclick=function(e2){
      e2.stopPropagation();
      var t=findTask(b.dataset.assign); if(!t.item)return;
      t.item.owner=t.item.owner==='client'?'planner':'client';
      /* Follow the task to whichever list it just joined, so it does not
         appear to vanish. */
      state.chkTab=t.item.owner;
      save(); render(); wireEvents();
      var ev3=db.events.find(function(x){return x.id===state.eventId;});
      toast(t.item.owner==='client'?('Assigned to '+clientTerm(ev3)+' — it shows in their portal ✦')
                                   :'Moved back to your list');
    };
  });
  /* Notes save as you type. No re-render on input: it would tear the textarea
     out from under the cursor. */
  document.querySelectorAll('[data-note]').forEach(function(ta){
    var timer=null;
    ta.onclick=function(e2){ e2.stopPropagation(); };
    ta.oninput=function(){
      var t=findTask(ta.dataset.note); if(!t.item)return;
      t.item.note=ta.value;
      clearTimeout(timer);
      timer=setTimeout(function(){
        save();
        var tag=document.querySelector('[data-saved="'+ta.dataset.note+'"]');
        if(tag){ tag.textContent='Saved'; setTimeout(function(){ if(tag)tag.textContent=''; },1400); }
      },400);
    };
  });
}
function evSection(key,title,count,body,extra){
  var collapsed=!!evCollapsed[key];
  return '<div class="card ev-sec'+(collapsed?' collapsed':'')+'" data-evsec="'+key+'">'+
    '<button class="card-h ev-h" type="button" data-evtoggle="'+key+'" aria-expanded="'+(!collapsed)+'">'+
      '<h3>'+title+'</h3>'+
      '<span class="ev-h-r">'+(extra||'')+
        (count!==null?'<span class="pill">'+count+'</span>':'')+
        '<span class="chev ev-chev" aria-hidden="true"></span></span>'+
    '</button>'+
    '<div class="ev-wrap"><div class="ev-inner">'+body+'</div></div></div>';
}
function viewEventDetail(id){
  var e=db.events.find(function(x){return x.id===id;});if(!e)return viewEvents();
  var done=e.checklist.filter(function(c){return c.done;}).length,tot=e.checklist.length,pct=tot?Math.round(done/tot*100):0;
  var estT=e.budget.reduce(function(a,b){return a+b.est;},0),actT=e.budget.reduce(function(a,b){return a+b.act;},0);
  var vend=bookingsForEvent(e.id);
  var docs=db.documents.filter(function(d){return d.eventId===e.id;});
  var lead=leadForEvent(e)||{};
  var roster=rosterFor(e);
  var attending=roster.filter(function(g){return gRsvp(g,e)==='yes';});
  var pending=roster.filter(function(g){var r=gRsvp(g,e);return r==='pending'||r==='invited';});
  var declined=roster.filter(function(g){return gRsvp(g,e)==='no';});
  var diets=roster.filter(function(g){return g.diet;});
  var seated=attending.filter(function(g){return gTable(g,e);}).length;
  var addr=addrLines(e.venueAddress);
  var mapQ=encodeURIComponent([e.venue].concat(addr).join(', '));

  /* The weekend, as a strip across the top. Present whenever the event is part
     of a block, so a planner can step from the rehearsal dinner to the
     ceremony without going back out to the list. */
  var blk=evBlock(e),prim=evPrimary(e);
  var switcher=(blk.length>1?
    '<div class="wknd-bar"><span class="ew-k">'+esc(prim.title)+'</span>'+
      blk.map(function(x){
        return '<button type="button" class="ew-b'+(x.id===e.id?' on':'')+'" data-ev="'+x.id+'"'+
          (x.id===e.id?' aria-current="true"':'')+'>'+
          '<span class="ew-r">'+esc(roleLabel(x,true))+'</span>'+
          '<span class="ew-d">'+fmtDate(x.date)+'</span></button>';
      }).join('')+
      '<button type="button" class="ew-add" data-addsub="'+prim.id+'">+ Sub-event</button>'+
    '</div>'
    :'<div class="wknd-bar solo"><button type="button" class="ew-add" data-addsub="'+e.id+'">'+
      '+ Add a sub-event</button><span class="ew-h">Welcome party, rehearsal dinner, farewell brunch…</span></div>');

  return '<button class="back-link" data-back="events">‹ All events</button>'+
  sampleBanner()+
  switcher+

  // ---- venue, given the prominence it deserves ----
  '<div class="venue-band">'+
    '<div class="vb-main">'+
      '<div class="vb-k">Venue</div>'+
      '<div class="vb-name'+(e.venue?'':' tbc')+'">'+esc(venueName(e.venue))+'</div>'+
      (addr.length?'<div class="vb-addr">'+addr.map(esc).join('<br>')+'</div>'
                  :'<div class="vb-addr muted">No address on file</div>')+
      (addr.length?'<a class="vb-map" href="https://maps.google.com/?q='+mapQ+'" target="_blank" rel="noopener">Open in Maps ›</a>':'')+
    '</div>'+
    '<div class="vb-side">'+
      '<div class="vb-when"><span class="vb-day">'+fmtDate(e.date)+'</span>'+
        (e.startTime?'<span class="vb-time">'+esc(e.startTime)+' start</span>':'')+
        '<span class="vb-count">'+daysAway(e.date)+' days away</span></div>'+
      (e.venueContact&&e.venueContact.name?
        '<div class="vb-contact"><div class="vc-k">Venue contact</div>'+
          '<div class="vc-n">'+esc(e.venueContact.name)+'</div>'+
          '<div class="vc-r">'+esc(e.venueContact.role)+'</div>'+
          '<div class="vc-l">'+
            (e.venueContact.phone?'<a href="tel:'+esc(e.venueContact.phone.replace(/[^\d+]/g,''))+'">'+esc(e.venueContact.phone)+'</a>':'')+
            (e.venueContact.email?'<a href="mailto:'+esc(e.venueContact.email)+'">'+esc(e.venueContact.email)+'</a>':'')+
          '</div></div>':'')+
    '</div>'+
    (e.venueNotes?'<div class="vb-note"><b>Site notes</b> '+esc(e.venueNotes)+'</div>':'')+
  '</div>'+

  '<div class="stat-row">'+
    stat('Countdown',daysAway(e.date)+' days',fmtDate(e.date))+
    stat('Checklist',pct+'%',done+' of '+tot+' done')+
    stat('Guests',attending.length+' / '+e.guests.length,pending.length+' awaiting reply')+
    stat('Committed',money(actT),estT?Math.round(actT/estT*100)+'% of '+money(estT):'no budget set')+
  '</div>'+

  '<div class="grid-2" style="align-items:start">'+
    '<div class="ev-col">'+
      evSection('timeline','Day-of Timeline',e.timeline.length,
        '<div style="padding:20px 22px"><div class="tl">'+
          (e.timeline.length?e.timeline.map(function(t){return '<div class="tl-item"><div class="time">'+esc(t.t)+'</div><div class="ev">'+esc(t.ev)+rowActions('timeline',t.id)+'</div><div class="ds">'+esc(t.ds)+'</div></div>';}).join(''):'<div class="empty-hint">No running order yet.</div>')+
        '</div><button class="btn btn-ghost btn-sm" data-addtl="1" style="margin-top:14px">＋ Add moment</button></div>')+

      evSection('vendors','Vendor Team',vend.length,
        vendorTeamMarkup(e,true)+
        (lead.id?'<div class="sec-actions"><button class="link-btn" data-client="'+esc(lead.id)+'">Manage on the client file ›</button></div>':''),
        vend.length?'<span class="sec-badge">'+money(vend.reduce(function(a,b){return a+b.fee;},0))+'</span>':'')+

      evSection('guests',evIsSub(e)?'Invited to '+esc(roleLabel(e,true)):'Guest List',roster.length,
        '<div class="guest-sum">'+
          '<span class="gs yes"><b>'+attending.length+'</b> attending</span>'+
          '<span class="gs wait"><b>'+pending.length+'</b> awaiting</span>'+
          '<span class="gs no"><b>'+declined.length+'</b> declined</span>'+
          '<span class="gs"><b>'+seated+'</b> seated</span>'+
        '</div>'+
        (diets.length?'<div class="guest-diet"><b>Dietary</b> '+diets.map(function(d){
          return '<span class="pill gold">'+esc(d.name)+' · '+esc(d.diet)+'</span>';}).join('')+'</div>':'')+
        (roster.length?'<div class="tbl-wrap"><table><thead><tr><th>Guest</th><th>Party</th><th>RSVP</th><th>Meal</th><th>Table</th></tr></thead><tbody>'+
          roster.map(function(g){
            var r=RSVP[gRsvp(g,e)]||RSVP.invited;
            var tb=e.tables.find(function(t){return t.id===gTable(g,e);});
            return '<tr><td><b>'+esc(g.name)+'</b>'+(g.diet?' <span class="diet-dot" title="'+esc(g.diet)+'">◆</span>':'')+'</td>'+
              '<td>'+esc(g.party||'—')+'</td>'+
              '<td><span class="status '+r.cls+'">'+r.lbl+'</span></td>'+
              '<td>'+(gMeal(g,e)?esc(gMeal(g,e)):'<span style="color:var(--muted)">—</span>')+'</td>'+
              '<td>'+(tb?esc(tb.name):'<span style="color:var(--muted)">Unseated</span>')+'</td></tr>';
          }).join('')+'</tbody></table></div>'
          :'<div class="empty-hint">'+(evIsSub(e)?'Nobody invited yet — tick them on the guest list.':'No guests added yet.')+'</div>')+
        /* Checklist and Budget both had an add control here and Guests did
           not, so the only way in was the Guests view via the sidebar. */
        '<div class="sec-actions"><button class="btn btn-ghost btn-sm" data-addguest="1">＋ Add guest</button>'+
        '<button class="btn btn-ghost btn-sm" data-openguests="1">Open guest list ›</button></div>')+
    '</div>'+

    '<div class="ev-col">'+
      evSection('checklist','Checklist',null,
        '<div style="padding:6px 22px 14px">'+
          /* Two lists, not one. The studio's own work and the couple's jobs are
             different things, and the couple's are the only ones the portal
             shows — see migration 13. */
          (function(){
            var tab=state.chkTab==='client'?'client':'planner';
            var mine=e.checklist.filter(function(c){return c.owner!=='client';});
            var theirs=e.checklist.filter(function(c){return c.owner==='client';});
            var list=tab==='client'?theirs:mine;
            var open=state.chkOpen;
            /* The due date and the category each get their own fixed column,
               and the date cell renders even when empty — otherwise a task with
               no due date pulls its category left and the list reads as ragged.
               The scroller keeps a full template from burying the workspace. */
            return '<div class="chk-tabs">'+
              '<button class="chk-tab'+(tab==='planner'?' on':'')+'" data-chktab="planner">Yours'+
                '<span class="ct-n">'+mine.filter(function(c){return !c.done;}).length+'</span></button>'+
              '<button class="chk-tab'+(tab==='client'?' on':'')+'" data-chktab="client">'+esc(clientTerm(e,true))+'’s'+
                '<span class="ct-n">'+theirs.filter(function(c){return !c.done;}).length+'</span></button>'+
            '</div>'+
            (list.length?'<div class="chk-scroll">'+list.map(function(c){

/* --- Guests & RSVP --- */
var RSVP={yes:{lbl:'Attending',cls:'s-paid'},no:{lbl:'Declined',cls:'s-over'},pending:{lbl:'Pending',cls:'s-due'},invited:{lbl:'Invited',cls:'s-draft'}};
function viewGuests(){
  var e=activeEvent(); if(!e)return '<div class="card" style="padding:40px;text-align:center;color:var(--muted)">No events yet.</div>';
  /* On the primary the grid is the master list, and gains a tick-box column
     per sub-event. On a sub-event it is that night's list alone, with its own
     RSVPs, meals and seats. */
  var prim=evPrimary(e),subs=evChildren(prim.id),sub=evIsSub(e);
  /* A wedding guest list runs to 200 names. Scrolling to find the Vances —
     on a phone, on site — is the difference between using this and not.
     Matches name, party, meal and dietary needs, the four things a planner
     actually searches by. */
  var q=(state.guestQ||'').trim().toLowerCase();
  var all=rosterFor(e);
  var g=q?all.filter(function(x){
    return [x.name,x.party,gMeal(x,e),x.diet,x.email].join(' ').toLowerCase().indexOf(q)>-1;
  }):all;
  var yes=g.filter(function(x){return gRsvp(x,e)==='yes';}).length;
  var no=g.filter(function(x){return gRsvp(x,e)==='no';}).length;
  var wait=g.filter(function(x){var r=gRsvp(x,e);return r==='pending'||r==='invited';}).length;
  var diets=g.filter(function(x){return x.diet;});
  var meals={};
  g.forEach(function(x){ if(gRsvp(x,e)==='yes'&&gMeal(x,e)) meals[gMeal(x,e)]=(meals[gMeal(x,e)]||0)+1; });
  var mealRows=Object.keys(meals).map(function(m){
    var pct=yes?Math.round(meals[m]/yes*100):0;
    return '<div class="bud-row"><div class="cat">'+esc(m)+'</div><div class="track"><div class="bar" style="height:12px"><i style="width:'+pct+'%"></i></div></div><div class="amt"><b>'+meals[m]+'</b> guests</div></div>';
  }).join('')||'<div style="padding:18px 22px;color:var(--muted);font-size:13px">No meal selections yet.</div>';

  return ''+
  '<div class="stat-row">'+
    stat('Invited',String(g.length),g.length?Math.round(yes/g.length*100)+'% confirmed':'—')+
    stat('Attending',String(yes),no+' declined','up')+
    stat('Awaiting Reply',String(wait),'needs a follow-up')+
    stat('Dietary Needs',String(diets.length),'special meals')+
  '</div>'+
  (diets.length?'<div class="card" style="margin-bottom:20px"><div class="card-h"><h3>Dietary Alerts</h3><span class="sec-badge">Share with catering</span></div>'+
    '<div style="padding:16px 22px;display:flex;flex-wrap:wrap;gap:10px">'+diets.map(function(d){
      return '<span class="pill gold">'+esc(d.name)+' · '+esc(d.diet)+'</span>';
    }).join('')+'</div></div>':'')+
  (sub?'<div class="inv-note">Showing <b>'+esc(roleLabel(e))+'</b> · '+esc(e.title)+
      '. These RSVPs, meals and seats belong to this event alone — the master guest list lives on '+
      '<button type="button" class="link-btn" data-gotoev="'+esc(prim.id)+'">'+esc(prim.title)+'</button>.</div>':'')+
  '<div class="card" style="margin-bottom:20px"><div class="card-h"><h3>'+
    (sub?'Invited to '+esc(roleLabel(e,true)):'Guest List')+'</h3>'+
    '<span class="ev-h-r">'+
      '<input class="v-search" id="guestSearch" placeholder="Search guests…" value="'+esc(state.guestQ||'')+'" aria-label="Search guests">'+
      '<span class="pill">'+(q?g.length+' of '+all.length:String(g.length))+'</span>'+
    '</span></div>'+
    '<div class="tbl-wrap g-tbl-wrap"><table class="g-tbl"><thead><tr><th>Guest</th><th>Party</th><th>RSVP</th><th>Meal</th><th>Dietary</th><th>Table</th>'+
      /* One column per sub-event, only on the primary. This is the whole point
         of the feature: who is asked to what, readable in a single sweep. */
      /* The header doubles as a bulk control. Ticking 150 guests one at a time
         is not a feature — and because it acts on the rows currently shown,
         searching "Vance" then hitting all invites exactly that family. */
      (!sub?subs.map(function(s){
        var shown=g.length,on=g.filter(function(x){return !!inviteOf(x.id,s.id);}).length;
        var allOn=shown>0&&on===shown;
        return '<th class="inv-col" title="'+esc(s.title)+'">'+esc(roleLabel(s,true))+
          '<span class="inv-n">'+invitedCount(s)+'</span>'+
          (shown?'<button type="button" class="inv-all" data-invall="'+esc(s.id)+'" data-on="'+(allOn?'1':'0')+'">'+
            (allOn?'none':'all')+'</button>':'')+'</th>';
      }).join(''):'')+
    '</tr></thead><tbody>'+
    g.map(function(x){
      var tb=e.tables.find(function(t){return t.id===gTable(x,e);});
      var cur=gRsvp(x,e);
      return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.party)+'</td>'+
        '<td><select class="mini rsvp-sel" data-gid="'+esc(x.id)+'" aria-label="RSVP for '+esc(x.name)+'">'+
          Object.keys(RSVP).map(function(k){return '<option value="'+k+'"'+(cur===k?' selected':'')+'>'+RSVP[k].lbl+'</option>';}).join('')+
        '</select></td>'+
        '<td>'+(gMeal(x,e)?esc(gMeal(x,e)):'<span style="color:var(--muted)">—</span>')+'</td>'+
        '<td>'+(x.diet?'<span class="status s-due">'+esc(x.diet)+'</span>':'<span style="color:var(--muted)">—</span>')+'</td>'+
        '<td>'+(tb?'<span class="pill">'+esc(tb.name)+'</span>':'<span style="color:var(--muted)">Unseated</span>')+rowActions('guest',x.id)+'</td>'+
        (!sub?subs.map(function(s){
          var on=!!inviteOf(x.id,s.id);
          var r=on?gRsvp(x,s):null;
          return '<td class="inv-col"><label class="inv-box'+(on?' on':'')+'">'+
            '<input type="checkbox" class="inv-chk" data-gid="'+esc(x.id)+'" data-eid="'+esc(s.id)+'"'+(on?' checked':'')+
            ' aria-label="'+esc(x.name)+' invited to '+esc(s.title)+'">'+
            '<span class="inv-tick">'+(on?(r==='yes'?'✓':r==='no'?'✕':'·'):'')+'</span></label></td>';
        }).join(''):'')+
      '</tr>';
    }).join('')+'</tbody></table></div>'+
    (!sub&&subs.length?'<div class="inv-key">Tick to invite. <b>✓</b> attending · <b>✕</b> declined · <b>·</b> awaiting reply — '+
      'switch to a sub-event above to set its RSVPs, meals and seating.</div>':'')+
  '</div>'+
  '<div class="card"><div class="card-h"><h3>Meal Counts</h3><span class="sec-badge">'+yes+' attending</span></div><div style="padding:8px 0 12px">'+mealRows+'</div></div>';
}
function wireGuests(){
  document.querySelectorAll('.rsvp-sel').forEach(function(sel){
    sel.onchange=function(){
      var e=activeEvent();
      var g=rosterFor(e).find(function(x){return x.id===sel.dataset.gid;});
      if(!g)return;
      gSet(g,e,'rsvp',sel.value);
      /* A declined guest keeps no seat. On a sub-event that clears only this
         event's seat — they may still be at table 4 for the wedding. */
      if(sel.value==='no')gSet(g,e,'tableId',null);
      save();render();wireGuests();
    };
  });
  document.querySelectorAll('.inv-chk').forEach(function(chk){
    chk.onchange=function(){
      var prim=evPrimary(activeEvent());
      var g=(prim.guests||[]).find(function(x){return x.id===chk.dataset.gid;});
      var sub=evById(chk.dataset.eid);
      if(!g||!sub)return;
      setInvited(g,sub,chk.checked);
      save();render();wireGuests();
    };
  });
  document.querySelectorAll('[data-gotoev]').forEach(function(b){
    b.onclick=function(){ state.activeEventId=b.dataset.gotoev; render(); wireGuests(); };
  });
  /* Bulk invite acts on the rows on screen, so it composes with the search:
     find a family, invite the family. */
  document.querySelectorAll('[data-invall]').forEach(function(b){
    b.onclick=function(e2){
      e2.stopPropagation();
      var sub=evById(b.dataset.invall); if(!sub)return;
      var on=b.dataset.on==='1';
      var rows=[].map.call(document.querySelectorAll('.inv-chk[data-eid="'+sub.id+'"]'),function(c){return c.dataset.gid;});
      var prim=evPrimary(activeEvent());
      rows.forEach(function(gid){
        var g=(prim.guests||[]).find(function(x){return x.id===gid;});
        if(g)setInvited(g,sub,!on);
      });
      save();render();wireGuests();
      toast((on?'Removed ':'Invited ')+rows.length+(on?' from ':' to ')+sub.title);
    };
  });
  var gs=$('#guestSearch');
  if(gs)gs.oninput=function(){
    state.guestQ=gs.value;
    var pos=gs.selectionStart;
    render(); wireGuests();
    /* Re-rendering the view replaces the input, so focus and caret have to be
       put back or typing a second character is impossible. */
    var n=$('#guestSearch');
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
  };
}

/* ============================================================
 * Floor plan designer
 * Room coordinates are feet; the DOM positions everything as a
 * percentage of the room, so it scales to any screen for free.
 * Pointer Events drive dragging — one code path for mouse and touch,
 * unlike HTML5 drag which has no touch equivalent at all.
 * ============================================================ */
var FIXTURES={
  backdrop:{label:'Backdrop',w:10,h:1},
  dancefloor:{label:'Dance Floor',w:16,h:16},
  stage:{label:'Stage',w:16,h:6},
  bar:{label:'Bar',w:12,h:3},
  buffet:{label:'Buffet',w:14,h:3},
  cake:{label:'Cake Table',w:4,h:3},
  gifts:{label:'Gift Table',w:5,h:3},
  dj:{label:'DJ / Band',w:8,h:5},
  // Wall openings — these snap to the nearest wall and matter for
  // load-in routes, guest flow and where you can't put a table.
  door:{label:'Door',w:3,h:0.6,wall:true},
  doubledoor:{label:'Double Doors',w:6,h:0.6,wall:true},
  window:{label:'Window',w:5,h:0.4,wall:true},
  exit:{label:'Fire Exit',w:3.5,h:0.6,wall:true}
};
/* Real-world tops, the way a rental order is written. Sizes in inches. */
var TABLE_PRESETS=[
  {id:'r48',label:'48" round · seats 6',shape:'round',in:[48,48],seats:6},
  {id:'r60',label:'60" round · seats 8',shape:'round',in:[60,60],seats:8},
  {id:'r72',label:'72" round · seats 10',shape:'round',in:[72,72],seats:10},
  {id:'b6',label:'6ft banquet 72×30 · seats 6',shape:'rect',in:[72,30],seats:6},
  {id:'b8',label:'8ft banquet 96×30 · seats 8',shape:'rect',in:[96,30],seats:8},
  {id:'king',label:'King table 96×48 · seats 10',shape:'rect',in:[96,48],seats:10},
  {id:'sq',label:'Square 60×60 · seats 8',shape:'square',in:[60,60],seats:8},
  {id:'sweet',label:'Sweetheart 48×30 · seats 2',shape:'oval',in:[48,30],seats:2}
];
/* Declarations, not expressions: normalize() runs at boot and sits far
   above this point in the file, so these must hoist. */
function FT(inches){ return Math.round(inches/12*100)/100; }
function IN(feet){ return Math.round(feet*12); }
/* Chair positions in table-local percent, computed from the real geometry
   so eight chairs round a 60" top look like eight chairs round a 60" top. */
function seatPositions(shape,w,h,n){
  var out=[],i;
  if(!n||n<1)return out;
  var gap=1.15;                                   // ft from table edge to chair centre
  if(shape==='round'||(shape==='oval'&&Math.abs(w-h)<0.4)){
    var r=(Math.min(w,h)/2+gap)/w*100;
    for(i=0;i<n;i++){
      var a=(-90+i*360/n)*Math.PI/180;
      out.push({x:50+r*Math.cos(a),y:50+(r*w/h)*Math.sin(a)});
    }
    return out;
  }
  if(shape==='oval'){
    var rx=(w/2+gap)/w*100, ry=(h/2+gap)/h*100;
    for(i=0;i<n;i++){
      var t=(-90+i*360/n)*Math.PI/180;
      out.push({x:50+rx*Math.cos(t),y:50+ry*Math.sin(t)});
    }
    return out;
  }
  // Rectangles: fill the long sides first, then the ends — how banquet
  // tables are actually set.
  var offX=gap/w*100, offY=gap/h*100;
  var ends=n>=6?2:(n>=4?0:0);
  var perSide=Math.floor((n-ends*1)/2), extra=(n-ends)-perSide*2;
  var top=perSide+ (extra>0?1:0), bottom=perSide;
  var placed=0;
  for(i=0;i<top;i++){ out.push({x:(i+1)/(top+1)*100, y:-offY}); placed++; }
  for(i=0;i<bottom;i++){ out.push({x:(i+1)/(bottom+1)*100, y:100+offY}); placed++; }
  if(ends&&placed<n){ out.push({x:-offX,y:50}); placed++; }
  if(placed<n){ out.push({x:100+offX,y:50}); placed++; }
  while(placed<n){ out.push({x:50,y:-offY}); placed++; }
  return out;
}
/* Wall openings lock to whichever wall they're nearest. */
function snapToWall(f,i){
  var d=[{w:'top',v:i.y},{w:'bottom',v:f.h-i.y},{w:'left',v:i.x},{w:'right',v:f.w-i.x}]
    .sort(function(a,b){return a.v-b.v;})[0].w;
  var thick=Math.min(i.w,i.h)||0.6;
  var long=Math.max(i.w,i.h);
  if(d==='top'||d==='bottom'){
    i.w=long; i.h=thick; i.rot=0;
    i.y=(d==='top')?thick/2:f.h-thick/2;
    i.x=Math.max(long/2,Math.min(f.w-long/2,i.x));
  }else{
    i.w=thick; i.h=long; i.rot=0;
    i.x=(d==='left')?thick/2:f.w-thick/2;
    i.y=Math.max(long/2,Math.min(f.h-long/2,i.y));
  }
  i.wallSide=d;
  return i;
}
/* Every seating surface goes through here — the floor plan, the table cards
   and both print sheets — so making it read the invitation rather than the
   guest row is what makes seating per-event. The rehearsal dinner is a
   different room with different people at different tables. */
function seatedAt(ev,tid){
  return rosterFor(ev).filter(function(g){return gTable(g,ev)===tid&&gRsvp(g,ev)==='yes';});
}
function viewFloorPlan(ev){
  var f=ev.floor;
  var sel=state.floorSel;
  var pct=function(v,total){return (v/total*100)+'%';};

  var showChairs=f.showChairs!==false;
  var tables=ev.tables.map(function(t){
    var at=seatedAt(ev,t.id);
    var full=at.length>=t.seats, empty=at.length===0;
    var radius=t.shape==='round'?'50%':t.shape==='oval'?'50%':'6px';
    var chairs='';
    if(showChairs){
      var chairFt=1.5;
      var cw=chairFt/t.w*100, ch=chairFt/t.h*100;
      chairs=seatPositions(t.shape,t.w,t.h,t.seats).map(function(p,i){
        return '<i class="chair'+(i<at.length?' taken':'')+'" style="left:'+p.x+'%;top:'+p.y+'%;'+
          'width:'+cw+'%;height:'+ch+'%"></i>';
      }).join('');
    }
    return '<div class="fp-item fp-table'+(full?' full':'')+(empty?' empty':'')+(sel==='table:'+t.id?' sel':'')+'" '+
      'data-fp="table:'+esc(t.id)+'" tabindex="0" role="button" '+
      'aria-label="'+esc(t.name)+', '+at.length+' of '+t.seats+' seated, '+IN(t.w)+' by '+IN(t.h)+' inches" '+
      'style="left:'+pct(t.x,f.w)+';top:'+pct(t.y,f.h)+';width:'+pct(t.w,f.w)+';height:'+pct(t.h,f.h)+';'+
      'transform:translate(-50%,-50%) rotate('+(t.rot||0)+'deg)">'+
      chairs+
      '<span class="fp-top" style="border-radius:'+radius+'">'+
        '<span class="fp-name">'+esc(t.name)+'</span>'+
        '<span class="fp-count"><b>'+at.length+'</b><span class="fp-of">/'+t.seats+'</span></span>'+
      '</span>'+
    '</div>';
  }).join('');

  var fixtures=f.items.map(function(i){
    var def=FIXTURES[i.kind]||{label:i.kind};
    var isWall=!!def.wall;
    var vertical=i.wallSide==='left'||i.wallSide==='right';
    return '<div class="fp-item fp-fix fp-'+esc(i.kind)+(isWall?' fp-wall '+(vertical?'vert':'horz')+' side-'+esc(i.wallSide||'top'):'')+
      (sel==='fix:'+i.id?' sel':'')+'" '+
      'data-fp="fix:'+esc(i.id)+'" tabindex="0" role="button" aria-label="'+esc(i.label||def.label)+'" '+
      'style="left:'+pct(i.x,f.w)+';top:'+pct(i.y,f.h)+';width:'+pct(i.w,f.w)+';height:'+pct(i.h,f.h)+';'+
      'transform:translate(-50%,-50%) rotate('+(i.rot||0)+'deg)">'+
      (isWall?'<span class="fp-wlabel">'+esc(i.label||def.label)+'</span>'
             :'<span class="fp-fname">'+esc(i.label||def.label)+'</span>')+
    '</div>';
  }).join('');

  var attending=rosterFor(ev).filter(function(g){return gRsvp(g,ev)==='yes';});
  var unseated=attending.filter(function(g){return !gTable(g,ev);});

  return '<div class="fp-wrap">'+
    '<div class="fp-toolbar">'+
      '<button class="btn btn-ghost btn-sm" id="fpAddTable">＋ Table</button>'+
      '<select class="mini" id="fpAddFix" aria-label="Add a fixture"><option value="">＋ Add fixture…</option>'+
        Object.keys(FIXTURES).map(function(k){return '<option value="'+k+'">'+FIXTURES[k].label+'</option>';}).join('')+
      '</select>'+
      '<label class="fp-snap"><input type="checkbox" id="fpSnap"'+(f.snap?' checked':'')+'> Snap</label>'+
      '<label class="fp-snap"><input type="checkbox" id="fpChairs"'+(showChairs?' checked':'')+'> Chairs</label>'+
      '<span class="fp-room">Room '+f.w+' × '+f.h+' '+esc(f.unit)+'</span>'+
      '<button class="btn btn-ghost btn-sm" id="fpRoom">Room size</button>'+
      '<span style="flex:1"></span>'+
      '<span class="fp-stat">'+(attending.length-unseated.length)+' of '+attending.length+' seated</span>'+
      '<button class="btn btn-ghost btn-sm" id="fpPrint">⎙ Print</button>'+
    '</div>'+
    '<div class="fp-stage'+(f.snap?' grid':'')+'" id="fpStage" style="aspect-ratio:'+f.w+'/'+f.h+'">'+
      fixtures+tables+
      (ev.tables.length||f.items.length?'':'<div class="fp-empty">Add a table to start laying out the room</div>')+
    '</div>'+
    '<div class="fp-hint">'+(isTouchMode()?'Drag items to move them. Tap one to edit or seat guests.'
      :'Drag to move · click to select · arrow keys nudge · ⌫ deletes')+'</div>'+
  '</div>'+
  (sel?fpPanel(ev,sel):
    '<div class="card fp-side"><div class="card-h"><h3>Unseated</h3><span class="pill">'+unseated.length+'</span></div>'+
      '<div style="padding:14px">'+(unseated.length?unseated.map(function(g){
        return '<div class="gchip" data-gid="'+esc(g.id)+'"><span class="gname">'+esc(g.name)+'</span>'+
          (g.diet?'<span class="gdiet">◆</span>':'')+'<span class="gparty">'+esc(g.party||'')+'</span></div>';
      }).join(''):'<div class="empty-hint">Everyone is seated ✦</div>')+
      '<div class="fp-side-note">Select a table to seat people.</div></div></div>');
}

function wireFloorPlan(ev){
  var stage=$('#fpStage'); if(!stage)return;
  var f=ev.floor;
  var dragging=null;

  function roomFromEvent(e){
    var r=stage.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*f.w, y:(e.clientY-r.top)/r.height*f.h};
  }
  function itemFor(key){
    var kind=key.split(':')[0], id=key.split(':')[1];
    return kind==='table'?ev.tables.find(function(t){return t.id===id;})
                         :f.items.find(function(i){return i.id===id;});
  }
  function clampInto(it){
    it.x=Math.max(it.w/2,Math.min(f.w-it.w/2,it.x));
    it.y=Math.max(it.h/2,Math.min(f.h-it.h/2,it.y));
  }
  stage.querySelectorAll('.fp-item').forEach(function(el){
    el.addEventListener('pointerdown',function(e){
      if(e.button&&e.button!==0)return;
      var key=el.dataset.fp, it=itemFor(key); if(!it)return;
      var p=roomFromEvent(e);
      dragging={el:el,it:it,key:key,dx:p.x-it.x,dy:p.y-it.y,moved:false};
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      e.preventDefault();
    });
    el.addEventListener('pointermove',function(e){
      if(!dragging||dragging.el!==el)return;
      var p=roomFromEvent(e);
      var nx=p.x-dragging.dx, ny=p.y-dragging.dy;
      if(f.snap){ nx=Math.round(nx/2)*2; ny=Math.round(ny/2)*2; }
      if(Math.abs(nx-dragging.it.x)>0.01||Math.abs(ny-dragging.it.y)>0.01)dragging.moved=true;
      dragging.it.x=nx; dragging.it.y=ny; clampInto(dragging.it);
      el.style.left=(dragging.it.x/f.w*100)+'%';
      el.style.top=(dragging.it.y/f.h*100)+'%';
    });
    var end=function(e){
      if(!dragging||dragging.el!==el)return;
      el.classList.remove('dragging');
      var moved=dragging.moved, key=dragging.key, it=dragging.it;
      var wall=key.indexOf('fix:')===0&&FIXTURES[it.kind]&&FIXTURES[it.kind].wall;
      dragging=null;
      if(moved){
        if(wall){ snapToWall(f,it); afterChange(); return; }   // doors sit ON the wall
        save();
      } else { state.floorSel=(state.floorSel===key)?null:key; render(); }
    };
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
    el.addEventListener('keydown',function(e){
      var it=itemFor(el.dataset.fp); if(!it)return;
      var step=e.shiftKey?5:1, moved=true;
      if(e.key==='ArrowLeft')it.x-=step; else if(e.key==='ArrowRight')it.x+=step;
      else if(e.key==='ArrowUp')it.y-=step; else if(e.key==='ArrowDown')it.y+=step;
      else if(e.key==='Enter'||e.key===' '){ state.floorSel=el.dataset.fp; render(); return; }
      else if(e.key==='Backspace'||e.key==='Delete'){
        e.preventDefault();
        var k=el.dataset.fp.split(':')[0], id=el.dataset.fp.split(':')[1];
        if(k==='table')deleteRecord('table',id);
        else { f.items=f.items.filter(function(x){return x.id!==id;}); state.floorSel=null; afterChange(); }
        return;
      } else moved=false;
      if(moved){ e.preventDefault(); clampInto(it); save(); render();
        var again=document.querySelector('[data-fp="'+el.dataset.fp+'"]'); if(again)again.focus(); }
    });
  });
  // clicking empty floor clears the selection
  stage.addEventListener('pointerdown',function(e){
    if(e.target===stage&&state.floorSel){ state.floorSel=null; render(); }
  });

  var at=$('#fpAddTable');
  if(at)at.onclick=function(){
    var n=ev.tables.length+1;
    var t={id:uid('t'),name:'Table '+n,seats:8,shape:'round',w:FT(60),h:FT(60),rot:0,
           x:Math.round(f.w/2),y:Math.round(f.h/2)};
    ev.tables.push(t); state.floorSel='table:'+t.id; afterChange();
  };
  var af=$('#fpAddFix');
  if(af)af.onchange=function(){
    var k=af.value; if(!k)return;
    var d=FIXTURES[k];
    var i={id:uid('fx'),kind:k,label:d.label,w:d.w,h:d.h,rot:0,
           x:Math.round(f.w/2),y:d.wall?0:Math.round(f.h/2)};
    if(d.wall)snapToWall(f,i);
    f.items.push(i); state.floorSel='fix:'+i.id; afterChange();
  };
  var sn=$('#fpSnap');
  if(sn)sn.onchange=function(){ f.snap=sn.checked; afterChange(); };
  var ch=$('#fpChairs');
  if(ch)ch.onchange=function(){ f.showChairs=ch.checked; afterChange(); };
  var rm=$('#fpRoom');
  if(rm)rm.onclick=function(){
    openEditor({title:'Room Size',sub:ev.title,twoCol:true,saveLabel:'Update',
      fields:[{id:'w',label:'Width (ft)',type:'number',value:f.w,required:true},
              {id:'h',label:'Depth (ft)',type:'number',value:f.h,required:true}],
      onSave:function(v){
        f.w=Math.max(10,v.w); f.h=Math.max(10,v.h);
        ev.tables.forEach(clampInto); f.items.forEach(clampInto);
        closeModal(); afterChange();
      }});
  };
  var pr=$('#fpPrint');
  if(pr)pr.onclick=function(){ printSheet('floorplan',ev); };
  var cl=$('#fpClose');
  if(cl)cl.onclick=function(){ state.floorSel=null; render(); };

  // ---- selection panel ----
  var sel=state.floorSel;
  if(!sel)return;
  var kind=sel.split(':')[0], id=sel.split(':')[1];
  if(kind==='table'){
    var t=ev.tables.find(function(x){return x.id===id;}); if(!t)return;
    var nm=$('#tb_name'); if(nm)nm.oninput=function(){ t.name=nm.value; save();
      var lbl=document.querySelector('[data-fp="table:'+t.id+'"] .fp-name'); if(lbl)lbl.textContent=t.name; };
    var sc=$('#tb_seats'); if(sc)sc.onchange=function(){
      var n=Math.max(1,Number(sc.value)||1);
      var seated=seatedAt(ev,t.id).length;
      if(n<seated){ toast('That table already seats '+seated+'.'); sc.value=t.seats; return; }
      t.seats=n; afterChange(); };
    document.querySelectorAll('[data-shape]').forEach(function(b){
      b.onclick=function(){
        t.shape=b.dataset.shape;
        // snap to the nearest sensible real top for the new shape
        if(t.shape==='rect'){t.w=FT(96);t.h=FT(30);}
        else if(t.shape==='oval'){t.w=FT(48);t.h=FT(30);}
        else if(t.shape==='square'){t.w=FT(60);t.h=FT(60);}
        else {t.w=FT(60);t.h=FT(60);}
        afterChange(); };
    });
    var pp=$('#tb_preset'); if(pp)pp.onchange=function(){
      var pre=TABLE_PRESETS.find(function(x){return x.id===pp.value;});
      if(!pre)return;
      var seated=seatedAt(ev,t.id).length;
      if(pre.seats<seated){ toast('That top seats '+pre.seats+' but '+seated+' are already placed.'); render(); return; }
      t.shape=pre.shape; t.w=FT(pre.in[0]); t.h=FT(pre.in[1]); t.seats=pre.seats;
      afterChange(); };
    var tw=$('#tb_w'); if(tw)tw.onchange=function(){
      var inches=Math.max(12,Number(tw.value)||12);
      t.w=FT(inches); if(t.shape==='round')t.h=t.w;
      afterChange(); };
    var th=$('#tb_h'); if(th)th.onchange=function(){
      t.h=FT(Math.max(12,Number(th.value)||12)); afterChange(); };
    var rt=$('#tb_rot'); if(rt)rt.oninput=function(){
      t.rot=Number(rt.value); $('#tb_rotv').textContent=t.rot+'°';
      var el=document.querySelector('[data-fp="table:'+t.id+'"]');
      if(el)el.style.transform='translate(-50%,-50%) rotate('+t.rot+'deg)';
      save(); };
    var ss=$('#tb_seat'); if(ss)ss.onchange=function(){
      var g=rosterFor(ev).find(function(x){return x.id===ss.value;});
      if(!g)return;
      if(seatedAt(ev,t.id).length>=t.seats){ toast(t.name+' is full.'); return; }
      gSet(g,ev,'tableId',t.id); afterChange(); };
    document.querySelectorAll('[data-unseat]').forEach(function(b){
      b.onclick=function(){ var g=rosterFor(ev).find(function(x){return x.id===b.dataset.unseat;});
        if(g){ gSet(g,ev,'tableId',null); afterChange(); } };
    });
    var td=$('#tb_del'); if(td)td.onclick=function(){ deleteRecord('table',t.id); };
  }else{
    var i=f.items.find(function(x){return x.id===id;}); if(!i)return;
    var lb=$('#fx_label'); if(lb)lb.oninput=function(){ i.label=lb.value; save();
      var el=document.querySelector('[data-fp="fix:'+i.id+'"] .fp-fname'); if(el)el.textContent=i.label; };
    var fw=$('#fx_w'); if(fw)fw.onchange=function(){ i.w=Math.max(1,Number(fw.value)||1); afterChange(); };
    var fh=$('#fx_h'); if(fh)fh.onchange=function(){ i.h=Math.max(1,Number(fh.value)||1); afterChange(); };
    var fr=$('#fx_rot'); if(fr)fr.oninput=function(){
      i.rot=Number(fr.value); $('#fx_rotv').textContent=i.rot+'°';
      var el=document.querySelector('[data-fp="fix:'+i.id+'"]');
      if(el)el.style.transform='translate(-50%,-50%) rotate('+i.rot+'deg)';
      save(); };
    var fd=$('#fx_del'); if(fd)fd.onclick=function(){
      f.items=f.items.filter(function(x){return x.id!==i.id;});
      state.floorSel=null; afterChange(); };
  }
}

/* --- Seating Chart --- */
function seatModeSwitch(){
  var m=state.seatMode||'plan';
  return '<div class="seg" role="tablist">'+
    ['plan','list'].map(function(k){
      return '<button class="seg-b'+(m===k?' on':'')+'" data-seatmode="'+k+'" role="tab" aria-selected="'+(m===k)+'">'+
        (k==='plan'?'Floor Plan':'List')+'</button>';}).join('')+'</div>';
}
function viewSeating(){
  var e=activeEvent(); if(!e)return '<div class="card" style="padding:40px;text-align:center;color:var(--muted)">No events yet.</div>';
  if((state.seatMode||'plan')==='plan'){
    return seatModeSwitch()+'<div class="fp-layout">'+viewFloorPlan(e)+'</div>';
  }
  var attending=rosterFor(e).filter(function(g){return gRsvp(g,e)==='yes';});
  var unseated=attending.filter(function(g){return !gTable(g,e);});
  var seated=attending.length-unseated.length;
  /* Tap-to-seat. Dragging has no touch equivalent, and the per-guest dropdown
     it fell back to meant a native picker and three taps for every one of
     eighty guests. Tap the guest, tap the table: two taps, and the room stays
     on screen while you do it. */
  var pick=state.seatPick?attending.find(function(g){return g.id===state.seatPick;}):null;
  if(state.seatPick&&!pick)state.seatPick=null;
  return seatModeSwitch()+
  (pick?'<div class="seat-pick"><span class="sp-k">Seating</span>'+
    '<b>'+esc(pick.name)+'</b>'+
    '<span class="sp-h">tap a table below'+(gTable(pick,e)?', or Unseated to lift them':'')+'</span>'+
    '<button type="button" class="btn btn-ghost btn-sm" id="seatPickCancel">Cancel</button></div>':'')+
  '<div class="stat-row cols-3">'+
    stat('Seated',seated+' / '+attending.length,attending.length?Math.round(seated/attending.length*100)+'% placed':'—')+
    stat('Tables',String(e.tables.length),e.tables.reduce(function(a,t){return a+t.seats;},0)+' seats total')+
    stat('Unseated',String(unseated.length),unseated.length?(isTouchMode()?'tap one, then tap a table':'drag them to a table'):'everyone has a seat','up')+
  '</div>'+
  '<div class="seat-wrap'+(pick?' picking':'')+'">'+
    '<div class="card unseated-col" id="unseatedCol" data-table="none"><div class="card-h"><h3>Unseated</h3><span class="pill">'+unseated.length+'</span></div>'+
      '<div style="padding:14px">'+ (unseated.length?unseated.map(function(g){return guestChip(g,e.tables,e);}).join(''):'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">Everyone is seated ✦</div>') +'</div></div>'+
    '<div class="tables-grid">'+e.tables.map(function(t){
      var at=attending.filter(function(g){return gTable(g,e)===t.id;});
      var full=at.length>=t.seats;
      return '<div class="table-card'+(full?' full':'')+'" data-table="'+esc(t.id)+'">'+
        '<div class="table-h"><span class="tname">'+esc(t.name)+'</span><span class="pill'+(full?' gold':'')+'">'+at.length+'/'+t.seats+'</span>'+rowActions('table',t.id)+'</div>'+
        '<div class="seat-list">'+(at.length?at.map(function(g){return guestChip(g,e.tables,e);}).join(''):'<div class="empty-seat">Drop a guest here</div>')+'</div>'+
      '</div>';
    }).join('')+'</div>'+
  '</div>';
}
function guestChip(g,tables,ev){
  /* ev decides which seat is being shown — the guest row's for a primary, the
     invitation's for a sub-event. */
  var seat=ev?gTable(g,ev):g.tableId;
  var picked=state.seatPick===g.id;
  return '<div class="gchip'+(picked?' picked':'')+'" draggable="true" data-gid="'+esc(g.id)+'"'+
    (picked?' aria-current="true"':'')+'>'+
    '<span class="gname">'+esc(g.name)+'</span>'+
    (g.diet?'<span class="gdiet" title="'+esc(g.diet)+'">◆</span>':'')+
    '<span class="gparty">'+esc(g.party)+'</span>'+
    // Touch equivalent of dragging the chip onto a table.
    '<select class="move-sel seat-move" data-move="'+esc(g.id)+'" aria-label="Seat '+esc(g.name)+'">'+
      '<option value=""'+(seat?'':' selected')+'>Unseated</option>'+
      (tables||[]).map(function(t){return '<option value="'+esc(t.id)+'"'+(seat===t.id?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+
    '</select></div>';
}
function wireSeating(){
  var e=activeEvent(); if(!e)return;
  document.querySelectorAll('[data-seatmode]').forEach(function(btn){
    btn.onclick=function(){ state.seatMode=btn.dataset.seatmode; state.floorSel=null; setView('seating'); };
  });
  if((state.seatMode||'plan')==='plan'){ wireFloorPlan(e); return; }
  var dragGid=null;
  document.querySelectorAll('.gchip').forEach(function(chip){
    chip.addEventListener('dragstart',function(){dragGid=chip.dataset.gid;chip.classList.add('dragging');});
    chip.addEventListener('dragend',function(){chip.classList.remove('dragging');});
  });

  /* ---- tap to seat ---- */
  /* seatInto is shared with the drag path below so the capacity rule and the
     per-event write live in one place. */
  function seatInto(gid,tid){
    var g=rosterFor(e).find(function(x){return x.id===gid;});
    if(!g)return false;
    if(tid==='none'||!tid){ gSet(g,e,'tableId',null); return true; }
    var t=e.tables.find(function(x){return x.id===tid;});
    if(t&&gTable(g,e)!==tid&&seatedAt(e,tid).length>=t.seats){
      toast(t.name+' is full — add a seat first.'); return false;
    }
    gSet(g,e,'tableId',tid);
    return true;
  }
  var cancel=$('#seatPickCancel');
  if(cancel)cancel.onclick=function(){ state.seatPick=null; render(); };
  document.querySelectorAll('.gchip').forEach(function(chip){
    chip.onclick=function(ev2){
      /* The dropdown inside the chip must keep working on its own. */
      if(ev2.target.closest('select'))return;
      ev2.stopPropagation();
      state.seatPick=(state.seatPick===chip.dataset.gid)?null:chip.dataset.gid;
      render();
    };
  });
  if(state.seatPick){
    document.querySelectorAll('[data-table]').forEach(function(zone){
      zone.addEventListener('click',function(ev2){
        if(ev2.target.closest('.gchip,select,button'))return;
        var gid=state.seatPick; if(!gid)return;
        if(seatInto(gid,zone.dataset.table)){
          state.seatPick=null; save(); render();
        }
      });
    });
  }
  document.querySelectorAll('[data-table]').forEach(function(zone){
    zone.addEventListener('dragover',function(ev){ev.preventDefault();zone.classList.add('drag-over');});
    zone.addEventListener('dragleave',function(){zone.classList.remove('drag-over');});
    zone.addEventListener('drop',function(ev){
      ev.preventDefault();zone.classList.remove('drag-over');
      if(!seatInto(dragGid,zone.dataset.table))return;
      save();render();
    });
  });
  document.querySelectorAll('.seat-move').forEach(function(sel){
    sel.onchange=function(){
      var g=rosterFor(e).find(function(x){return x.id===sel.dataset.move;});
      if(!g)return;
      var tid=sel.value||null;
      if(tid){
        var t=e.tables.find(function(x){return x.id===tid;});
        var cnt=seatedAt(e,tid).length;

     build one first — which, from a client file, reads as the button doing
     nothing. You can create the vendor from right here now, and it lands in
     the directory as well as on this event. */

    dir.map(function(v){return {value:v.id,label:v.name+(v.cat?' · '+v.cat:'')};}));

  openEditor({
    title:b?'Edit Booking':'Book a Vendor',
    sub:(evById(eventId)||{}).title,
    twoCol:true,
    saveLabel:b?'Save changes':'Book vendor',
    onDelete:b?function(){ closeModal(); deleteRecord('booking',b.id); }:null,
    fields:[
      {id:'vendorId',label:'Vendor',type:'select',value:(b&&b.vendorId)||(dir.length?dir[0].id:'__new'),
       options:opts,required:true,full:true}
    ].concat(vendorFields(null,isNew)).concat([
      {id:'status',label:'Status',type:'select',value:b&&b.status,
       options:Object.keys(VSTATUS).map(function(k){return {value:k,label:VSTATUS[k].lbl};})},
      {id:'fee',label:'Fee',type:'number',value:b&&b.fee},
      {id:'notes',label:'Notes',type:'textarea',value:b&&b.notes,full:true}

    }

}

/* Downscale before storing: raw camera images blow the localStorage quota. */
function shrinkImage(file,maxDim,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,scale=Math.min(1,maxDim/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.round(w*scale); cv.height=Math.round(h*scale);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{ cb(cv.toDataURL('image/jpeg',0.82)); }catch(err){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}
function wireBoardDetail(){

    if(!list.length){ toast('Only image files can be added.'); return; }
    var pending=list.length, added=0;
    list.forEach(function(f){
      shrinkImage(f,1000,function(dataUrl){
        if(dataUrl){
          b.images.push({id:uid('im'),
                         src:dataUrl,caption:f.name.replace(/\.[^.]+$/,'')});
          added++;
        }
        if(--pending===0){

          else if(added) b.images.splice(-added);   // quota refused: roll back
          render(); wireBoardDetail();

  if(input) input.onchange=function(){ addFiles(input.files); input.value=''; };
  if(dz){
    ['dragenter','dragover'].forEach(function(t){

function viewCalendar(){
  var y=state.calY,m=state.calM;
  var first=new Date(y,m,1), start=first.getDay(), days=new Date(y,m+1,0).getDate();
  var today=new Date(), tKey=today.getFullYear()+'-'+today.getMonth()+'-'+today.getDate();

  // collect entries per ISO date
  var byDay={};
  function push(iso,item){ if(!iso)return; (byDay[iso]=byDay[iso]||[]).push(item); }
  db.events.forEach(function(e){ push(e.date,{k:'event',t:e.title,c:'#C9A24B'}); });
  db.leads.forEach(function(l){
    if(!db.events.some(function(e){return e.date===l.date&&e.title===l.names;})) push(l.date,{k:'lead',t:l.names,c:'#E4AAB3'});
  });
  db.events.forEach(function(e){
    e.checklist.forEach(function(c){ if(c.due&&!c.done) push(c.due,{k:'task',t:c.lbl,c:'#8FBF9F'}); });
  });
  db.invoices.forEach(function(x){
    if(x.status==='due'||x.status==='over') push(x.due,{k:'invoice',t:x.num+' · '+money(x.amount),c:'#D99A54'});
  });

  var cells='';
  for(var i=0;i<start;i++) cells+='<div class="cal-cell muted"></div>';
  for(var d=1;d<=days;d++){

  var names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return '<div class="card"><div class="card-h"><h3>'+names[m]+' '+y+'</h3>'+

    '<div class="cal-grid">'+cells+'</div></div>';

/* --- Contracts & Documents --- */
var DOCST={draft:{lbl:'Draft',cls:'s-draft'},sent:{lbl:'Awaiting Signature',cls:'s-due'},signed:{lbl:'Signed',cls:'s-paid'},declined:{lbl:'Declined',cls:'s-over'}};
/* How the paperwork is actually filed. Kind and subject mixed on purpose —
   nobody hunts for "the proposal", they hunt for "the venue's thing".
   These values are a Postgres enum (migration 11); adding one here without
   adding it there means the document never syncs. */
var DOC_TYPES=[
  {id:'contract', lbl:'Contract'},
  {id:'proposal', lbl:'Proposal'},
  {id:'invoice',  lbl:'Invoice'},
  {id:'venue',    lbl:'Venue'},
  {id:'vendor',   lbl:'Vendor'},
  {id:'client',   lbl:'Client'},
  {id:'insurance',lbl:'Insurance'},
  {id:'permit',   lbl:'Permit'},
  {id:'floorplan',lbl:'Floor plan'},
  {id:'timeline', lbl:'Timeline'},
  {id:'other',    lbl:'Other'}
];
function docTypeLabel(t){
  var m=DOC_TYPES.find(function(x){return x.id===t;});
  return m?m.lbl:(t||'Other');
}
function docTypeOptions(){ return DOC_TYPES.map(function(t){return {value:t.id,label:t.lbl};}); }
function fileSize(n){
  return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
}
/* One picker, reused by every upload control. Whatever the bucket accepts —
   anything else is rejected on upload, so there is no point offering it. */
function filePicker(){
  var p=document.getElementById('docFile');
  if(!p){
    p=document.createElement('input');
    p.type='file'; p.id='docFile'; p.hidden=true;
    p.accept='application/pdf,image/jpeg,image/png,image/webp,image/heic';
    document.body.appendChild(p);
  }
  return p;
}
/* Upload a file the studio already has: pick it, name it, label it. The
   document record is created around the file rather than the other way round,
   which is the whole difference from "attach to an existing document". */
function uploadDocFor(eventId,after){
  var p=filePicker();
  p.value='';
  p.onchange=function(){
    var f=p.files&&p.files[0];
    if(!f)return;
    /* Strip the extension for the title — "Hillside Barn COI.pdf" files better
       as "Hillside Barn COI", and the extension is still on the file itself. */
    var base=String(f.name).replace(/\.[^.]+$/,'');
    openEditor({
      title:'File a Document',
      sub:f.name+' · '+fileSize(f.size),
      twoCol:true,
      saveLabel:'Upload',
      fields:[
        {id:'title',label:'Title',value:base,required:true,full:true},
        {id:'type',label:'Label',type:'select',value:'venue',options:docTypeOptions()},
        {id:'status',label:'Status',type:'select',value:'signed',
         options:Object.keys(DOCST).map(function(k){return {value:k,label:DOCST[k].lbl};})},
        {id:'eventId',label:'Event',type:'select',value:eventId||'',
         options:db.events.map(function(e){return {value:e.id,label:(evIsSub(e)?'└ ':'')+e.title};}),full:true},
        {id:'amount',label:'Value',type:'number',value:0}
      ],
      onSave:function(v){
        var d={id:uid('doc'),title:v.title,type:v.type,status:v.status||'signed',
               amount:Number(v.amount)||0,eventId:v.eventId||eventId||null,
               body:'',file:null,sent:'',signed:''};
        db.documents.push(d);
        closeModal();
        /* docAttach saves and re-renders once the blob is in IndexedDB. */
        docAttach(d.id,f);
        toast('Filed under '+docTypeLabel(v.type));
      }
    });
  };
  p.click();
}
function viewDocuments(){
  var signed=db.documents.filter(function(d){return d.status==='signed';});
  var awaiting=db.documents.filter(function(d){return d.status==='sent';});
  var byEvent={};
  db.documents.forEach(function(d){ (byEvent[d.eventId]=byEvent[d.eventId]||[]).push(d); });

    stat('Awaiting Signature',String(awaiting.length),awaiting.length?'follow up with clients':'all clear')+
    stat('Documents',String(db.documents.length),'across '+Object.keys(byEvent).length+' events')+
  '</div>'+
  Object.keys(byEvent).map(function(eid){

      '<div class="tbl-wrap"><table><thead><tr><th>Document</th><th>Type</th><th>Sent</th><th>Signed</th><th>Status</th><th style="text-align:right">Value</th></tr></thead><tbody>'+
      list.map(function(d){
        var s=DOCST[d.status]||DOCST.draft;
        var fsz=d.file?(d.file.size>1048576?(d.file.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(d.file.size/1024))+' KB'):'';
        return '<tr><td><b>'+esc(d.title)+'</b>'+
          (d.file
            ? '<div class="doc-file"><button class="link-btn doc-open" data-id="'+esc(d.id)+'">'+
              esc(d.file.name)+'</button><span class="df-m">'+fsz+
              (d.file.path?'':' · on this device only')+'</span>'+
              '<button class="r-act r-del doc-drop" data-id="'+esc(d.id)+'" aria-label="Remove file" title="Remove file">✕</button></div>'
            : '<div class="doc-file"><button class="link-btn doc-add" data-id="'+esc(d.id)+'">＋ Attach a file</button></div>')+
          '</td>'+
          '<td><span class="pill">'+esc(docTypeLabel(d.type))+'</span></td>'+
          '<td>'+(d.sent?fmtDate(d.sent):'<span style="color:var(--muted)">—</span>')+'</td>'+
          '<td>'+(d.signed?fmtDate(d.signed):'<span style="color:var(--muted)">—</span>')+'</td>'+
          '<td><span class="status '+s.cls+'">'+s.lbl+'</span>'+
            (d.status==='draft'?' <button class="link-btn doc-send" data-id="'+esc(d.id)+'">Send</button>':'')+
            (d.status==='sent'?' <button class="link-btn doc-sign" data-id="'+esc(d.id)+'">Mark signed</button>':'')+
          '</td>'+
          '<td style="text-align:right"><span class="val">'+(d.amount?money(d.amount):'—')+'</span>'+rowActions('document',d.id)+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }).join('');
}
function wireDocuments(){
  var picker=document.getElementById('docFile');
  if(!picker){
    picker=document.createElement('input');
    picker.type='file'; picker.id='docFile'; picker.hidden=true;
    /* Whatever the bucket accepts — anything else is rejected on upload, so
       there is no point offering it here. */
    picker.accept='application/pdf,image/jpeg,image/png,image/webp,image/heic';

  document.querySelectorAll('.doc-add').forEach(function(b){
    b.onclick=function(){

      };
      picker.click();
    };
  });
  document.querySelectorAll('.doc-open').forEach(function(b){
    b.onclick=function(){
      docOpen(b.dataset.id).then(function(ok){
        if(!ok)toast('That file is not on this device yet — pull to fetch it.');
      });
    };
  });
  document.querySelectorAll('.doc-drop').forEach(function(b){

      confirmDelete('the attached file',function(){
        var d=db.documents.find(function(x){return x.id===b.dataset.id;});
        if(!d)return;
        d.file=null; save(); render(); wireDocuments(); toast('File removed');
      });
    };
  });
  function todayISO(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
  document.querySelectorAll('.doc-send').forEach(function(b){
    b.onclick=function(){
      var d=db.documents.find(function(x){return x.id===b.dataset.id;});
      if(d){d.status='sent';d.sent=todayISO();save();render();wireDocuments();toast('Sent for signature ✦');}
    };
  });
  document.querySelectorAll('.doc-sign').forEach(function(b){
    b.onclick=function(){
      var d=db.documents.find(function(x){return x.id===b.dataset.id;});
      if(d){d.status='signed';d.signed=todayISO();save();render();wireDocuments();toast('Marked as signed ✓');}
    };
  });
}

function addrLines(a){

/* --- Questionnaires --- */
var QST={draft:{lbl:'Draft',cls:'s-draft'},sent:{lbl:'Awaiting Answers',cls:'s-due'},partial:{lbl:'In Progress',cls:'s-due'},complete:{lbl:'Complete',cls:'s-paid'}};
function qProgress(q){
  var req=q.questions.length;
  var done=q.questions.filter(function(x){return q.answers[x.id]!==undefined&&q.answers[x.id]!=='';}).length;
  return {done:done,total:req,pct:req?Math.round(done/req*100):0};
}
function qStatus(q){
  if(q.status==='draft')return 'draft';
  var p=qProgress(q);
  if(p.done===0)return 'sent';
  return p.done>=p.total?'complete':'partial';
}
function viewQuestionnaires(){
  if(state.qId){ return viewQuestionnaireDetail(state.qId); }
  var sent=db.questionnaires.filter(function(q){return q.status!=='draft';});
  var complete=sent.filter(function(q){return qStatus(q)==='complete';});
  return ''+
  '<div class="stat-row cols-3">'+
    stat('Questionnaires',String(db.questionnaires.length),db.questionnaires.filter(function(q){return q.status==='draft';}).length+' in draft')+
    stat('Awaiting Answers',String(sent.length-complete.length),'sent to clients')+
    stat('Complete',String(complete.length),sent.length?Math.round(complete.length/sent.length*100)+'% response rate':'—','up')+
  '</div>'+
  '<div class="card"><div class="card-h"><h3>All Questionnaires</h3><span class="pill">'+db.questionnaires.length+'</span></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Title</th><th>Event</th><th>Questions</th><th>Progress</th><th>Status</th></tr></thead><tbody>'+
    db.questionnaires.map(function(q){
      var e=db.events.find(function(x){return x.id===q.eventId;});
      var st=QST[qStatus(q)], p=qProgress(q);
      return '<tr class="row-link" data-q="'+esc(q.id)+'" tabindex="0" role="link">'+
        '<td><b>'+esc(q.title)+'</b></td><td>'+esc(e?e.title:'—')+'</td>'+
        '<td>'+q.questions.length+'</td>'+
        '<td><div class="bar" style="width:90px"><i style="width:'+p.pct+'%"></i></div>'+
          '<div style="font-size:11px;color:var(--muted);margin-top:4px">'+p.done+' of '+p.total+'</div></td>'+
        '<td><span class="status '+st.cls+'">'+st.lbl+'</span>'+rowActions('questionnaire',q.id)+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';

/* ============================================================
 * Branding — the palette is already token-driven, so a studio's
 * colours can be derived from two choices and pushed into :root.
 * ============================================================ */
function hexToHsl(hex){
  var h=String(hex||'').replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, L=(mx+mn)/2, H=0, S=0;
  if(d){
    S=L>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)H=((g-b)/d+(g<b?6:0));
    else if(mx===g)H=((b-r)/d+2);
    else H=((r-g)/d+4);
    H*=60;
  }
  return {h:H,s:S*100,l:L*100};
}
function hsl(h,s,l){ return 'hsl('+Math.round(h)+' '+Math.max(0,Math.min(100,s)).toFixed(1)+'% '+Math.max(0,Math.min(100,l)).toFixed(1)+'%)'; }
function hslA(h,s,l,a){ return 'hsl('+Math.round(h)+' '+s.toFixed(1)+'% '+l.toFixed(1)+'% / '+a+')'; }
/* Readable text on a filled accent button, whatever the studio picks. */
function onAccent(hslObj){ return hslObj.l>62?'#2C2328':'#FFFFFF'; }

function applyBrand(){
  var p=prefs();
  var root=document.documentElement.style;
  var a=hexToHsl(p.accent||'#B08D3E');
  var t=hexToHsl(p.tint||'#F2DFE1');

  // metal / accent ramp
  root.setProperty('--gold',        hsl(a.h,a.s,a.l));
  root.setProperty('--gold-2',      hsl(a.h,Math.min(a.s+6,95),Math.min(a.l+18,86)));
  root.setProperty('--gold-deep',   hsl(a.h,Math.min(a.s+4,95),Math.max(a.l-13,16)));
  root.setProperty('--gold-soft',   hsl(a.h,Math.max(a.s-22,12),Math.min(a.l+42,95)));
  root.setProperty('--gold-line',   hslA(a.h,a.s,a.l,.28));
  root.setProperty('--gold-grad',
    'linear-gradient(145deg,'+hsl(a.h,Math.min(a.s+6,95),Math.min(a.l+16,84))+' 0%,'+
    hsl(a.h,a.s,a.l)+' 42%,'+hsl(a.h,Math.min(a.s+4,95),Math.max(a.l-10,18))+' 100%)');
  root.setProperty('--on-accent', onAccent(a));

  // surface tint ramp
  root.setProperty('--pink-50',  hsl(t.h,Math.max(t.s-14,6),Math.min(t.l+11,98.5)));
  root.setProperty('--pink-100', hsl(t.h,Math.max(t.s-8,8), Math.min(t.l+7,97)));
  root.setProperty('--pink-200', hsl(t.h,t.s,t.l));
  root.setProperty('--pink-300', hsl(t.h,Math.min(t.s+4,80),Math.max(t.l-7,58)));
  root.setProperty('--pink-400', hsl(t.h,Math.min(t.s+8,80),Math.max(t.l-18,44)));
  root.setProperty('--ivory',    hsl(t.h,Math.max(t.s-20,4),Math.min(t.l+13,99.2)));
  root.setProperty('--bg-1',     hsl(t.h,Math.max(t.s-10,6),Math.min(t.l+8,97.6)));
  root.setProperty('--bg-2',     hsl(t.h,Math.max(t.s-16,4),Math.min(t.l+12,98.8)));
  root.setProperty('--line',     hsl(t.h,Math.max(t.s-12,6),Math.max(t.l-2,88)));
  root.setProperty('--line-strong', hsl(t.h,Math.max(t.s-6,8),Math.max(t.l-7,82)));

  /* Page wash. Hue offsets and lightness targets were read off the original
     hand-picked gradient, so a default tint reproduces it and any other tint
     is carried through at the same weight rather than staying pink. */
  var H=function(d){ return (t.h+d+360)%360; };
  root.setProperty('--wash-1',  hsl(H(-4),Math.min(t.s+5,60), Math.min(t.l+2,94)));
  root.setProperty('--wash-1t', hslA(H(-4),Math.min(t.s+5,60), Math.min(t.l+2,94),0));
  root.setProperty('--wash-2',  hsl(H(33),Math.min(t.s+28,72), Math.min(t.l+2,94)));
  root.setProperty('--wash-2t', hslA(H(33),Math.min(t.s+28,72), Math.min(t.l+2,94),0));
  root.setProperty('--wash-3',  hsl(H(32),Math.min(t.s+3,55),  Math.min(t.l+2.5,95)));
  root.setProperty('--wash-3t', hslA(H(32),Math.min(t.s+3,55),  Math.min(t.l+2.5,95),0));
  root.setProperty('--wash-a',  hsl(H(6), Math.min(t.s+5,55),  Math.min(t.l+6,97.5)));
  root.setProperty('--wash-b',  hsl(H(26),Math.min(t.s+13,60), Math.min(t.l+7,98.4)));
  root.setProperty('--wash-c',  hsl(H(19),Math.min(t.s+3,52),  Math.min(t.l+5,96.6)));

  // ink follows the tint's hue a touch so nothing looks pasted on
  var ink=hexToHsl(p.ink||'#3B2E33');
  root.setProperty('--ink',      hsl(ink.h,ink.s,ink.l));
  root.setProperty('--ink-soft', hsl(ink.h,Math.max(ink.s-3,4),Math.min(ink.l+16,52)));
  root.setProperty('--muted',    hsl(ink.h,Math.max(ink.s-8,3),Math.min(ink.l+32,68)));

  document.querySelectorAll('.brand .mark').forEach(function(m){
    if(p.logo){ m.style.background='#fff'; m.style.backgroundImage='url('+p.logo+')';
      m.style.backgroundSize='cover'; m.style.backgroundPosition='center'; m.textContent=''; }
    else { m.style.background=''; m.style.backgroundImage=''; m.textContent=(p.bizName||'G').trim()[0].toUpperCase(); }
  });
  var nm=document.querySelector('.brand .name');
  if(nm)nm.textContent=p.brandMark||'GEM';
}

  var st=$('#s_sbTest');

      .replace(/\/+$/,'');

    p.sbUrl=url; p.sbKey=key; savePrefs();
    var out=$('#sbResult'), notes=[], fatal=false;
    function line(ok,txt){ return '<div class="chk '+(ok?'ok':'bad')+'"><span>'+(ok?'✓':'✕')+'</span>'+esc(txt)+'</div>'; }
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)){
      notes.push(line(false,'Project URL should look like https://abcdefgh.supabase.co')); fatal=true;

      notes.push(line(false,'That looks like a SECRET key — do not use it in a browser. Use the publishable key.')); fatal=true;
    } else if(/^sb_publishable_/i.test(key)){
      notes.push(line(true,'Publishable key format recognised'));
    } else if(/^eyJ/.test(key)){
      notes.push(line(true,'Legacy anon key recognised — this still works'));
    } else {
      notes.push(line(false,'Key should begin sb_publishable_ (or eyJ for the legacy anon key)')); fatal=true;

      '<div class="chk pend"><span>…</span>Contacting the project…</div></div>';
    if(fatal){
      out.innerHTML='<div class="chk-list">'+notes.join('')+
        '<div class="chk bad"><span>✕</span>Fix the above before deploying.</div></div>';
      return;
    }
    // A reachable project answers its auth health endpoint.
    fetch(url+'/auth/v1/health',{headers:{apikey:key}})
      .then(function(r){ return r.ok?r.json().catch(function(){return {};}):Promise.reject(r.status); })
      .then(function(){
        out.innerHTML='<div class="chk-list">'+notes.join('')+

  var sbUrlEl=$('#s_sbUrl'), sbKeyEl=$('#s_sbKey');

  if(sbKeyEl)sbKeyEl.onchange=function(){

    // database, RLS included. Refuse it rather than warn about it.
    if(/^sb_secret_/.test(v)||/^eyJ/.test(v)){
      sbSay('bad','That looks like a secret key. Only the publishable key belongs in a browser — nothing has been saved.');

        if(r.status===200)sbSay('ok','Project answers and the schema is in place. Sign in next.');
        else if(r.status===401)sbSay('bad','The project answered but rejected that key. Check you copied the publishable key.');
        else if(r.status===404)sbSay('bad','Reached the project, but the tables are missing — run the SQL files first.');
        else sbSay('bad','Unexpected response: HTTP '+r.status+'.');

  var sbA=$('#s_sbAuto');
  if(sbA)sbA.onclick=function(){

  var sbP=$('#s_sbPush');

    var url=URL.createObjectURL(blob), a=document.createElement('a');

          if(!incoming||!incoming.leads||!incoming.events)throw new Error('not a GEM backup');
          confirmDelete('everything currently in GEM and replace it',function(){
            db=normalize(incoming);
            if(parsed.settings){ settings=null; localStorage.setItem(SET_KEY,JSON.stringify(parsed.settings)); prefs(); }
            save(); loadStages(); applyPrefs(); applyBrand(); paintIdentity();
/* Photos are stored apart from the workspace now, so put them back. */
try{ mediaRehydrate(); }catch(e){} setView('dashboard'); toast('Backup restored ✦');
          });
        }catch(err){ toast('That file isn’t a GEM backup.'); }
      };
      fr.onerror=function(){ toast('Could not read that file.'); };
      fr.readAsText(f);
    };
  }
  var rs=$('#s_reset');
  if(rs)rs.onclick=function(){
    confirmDelete('all your data and restore the sample studio',function(){
      try{ localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    });
  };
}
/* Preferences that change how the app looks or behaves. */
function applyPrefs(){
